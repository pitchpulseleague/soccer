  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #070b09;
      color: #f1f5f9;
      transition: background-color 0.22s ease, color 0.22s ease;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      font-variant-numeric: tabular-nums;
      -webkit-text-size-adjust: 100%;
    }
    h1, h2, h3, .font-display { font-family: 'Outfit', 'Inter', sans-serif; }
    button, a, select, label, input[type="checkbox"] { touch-action: manipulation; }
    button:disabled { cursor: not-allowed; }
    :focus-visible { outline: 3px solid #00f59b; outline-offset: 2px; }
    .tap { min-height: 44px; }
    .tap-lg { min-height: 48px; }
    .glass-card {
      background: rgba(16, 26, 20, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(0, 245, 155, 0.16);
      box-shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.35);
    }
    .neon-btn {
      background: linear-gradient(135deg, #00f59b 0%, #10b981 100%);
      color: #05100a;
      font-weight: 700;
      transition: all 0.16s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .neon-btn:hover { background: linear-gradient(135deg, #34f7af 0%, #00f59b 100%); box-shadow: 0 6px 20px rgba(0, 245, 155, 0.28); }
    .neon-btn:active { transform: scale(0.97); }
    .neon-btn:disabled { opacity: 0.55; transform: none; }
    .press:active { transform: scale(0.97); }
    .pin-box {
      width: 46px; height: 56px; text-align: center; font-size: 22px; font-weight: 800; border-radius: 12px;
      background: #0b130f; border: 2px solid #065f46; color: #00f59b; outline: none; transition: all 0.16s ease;
    }
    .pin-box:focus { border-color: #00f59b; box-shadow: 0 0 0 3px rgba(0, 245, 155, 0.25); }

    /* Tactical 2D Pitch Graphic */
    .soccer-pitch-bg { background: radial-gradient(circle at center, #065f46 0%, #064e3b 70%, #022c22 100%); border: 2px solid rgba(255,255,255,0.28); position: relative; }
    .soccer-pitch-bg::before { content: ""; position: absolute; top: 50%; left: 0; right: 0; height: 1.5px; background: rgba(255,255,255,0.28); }
    .soccer-pitch-bg::after { content: ""; position: absolute; top: 50%; left: 50%; width: 68px; height: 68px; margin-top: -34px; margin-left: -34px; border: 1.5px solid rgba(255,255,255,0.28); border-radius: 9999px; pointer-events: none; }

    /* Native iOS Bottom Sheet Animation */
    @keyframes sheetSlideUp { from { transform: translateY(100%); opacity: 0.5; } to { transform: translateY(0); opacity: 1; } }
    .ios-sheet { animation: sheetSlideUp 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes toastIn { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .toast-in { animation: toastIn 0.2s ease-out forwards; }
    @media (prefers-reduced-motion: reduce) { .ios-sheet, .toast-in { animation: none; } * { transition: none !important; } }

    .seg-off { background-color: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
    .toast-ok { background-color: #052e1f; color: #d1fae5; border: 1px solid rgba(0,245,155,0.4); }
    .toast-err { background-color: #881337; color: #ffffff; border: 1px solid #fb7185; }
    .shirt-dot { display: inline-block; width: 14px; height: 14px; border-radius: 9999px; border: 2px solid rgba(100,116,139,0.6); flex-shrink: 0; }
    .shirt-banner { border: 2px solid #047857; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08); }

    /* Map | Satellite switch drawn on top of the maps (same look in light and dark mode) */

  <script>
    // Safety net: if the page ever shows a class the pre-built block above doesn't cover
    // (for example one added to this file later), Tailwind's CDN is loaded once to fill it in.
    (function () {
      var loaded = false, known = null, seen = {}, pending = false, obs = null;
      function loadCdn() {
        if (loaded) return;
        loaded = true;
        if (obs) obs.disconnect();
        var s = document.createElement("script"); s.src = "https://cdn.tailwindcss.com"; document.head.appendChild(s);
      }
      if (document.getElementById("tw-prebuilt").textContent.length < 1000) { loadCdn(); return; }
      function learn(rules) {
        for (var i = 0; i < rules.length; i++) {
          var r = rules[i];
          if (r.selectorText) {
            var m = r.selectorText.match(/\.((?:\\.|[A-Za-z0-9_-])+)/g);
            if (m) for (var j = 0; j < m.length; j++) known[m[j].slice(1).replace(/\\(.)/g, "$1")] = 1;
          } else if (r.cssRules) learn(r.cssRules);
        }
      }
      function scan() {
        pending = false;
        if (loaded) return;
        if (!known) { known = {}; for (var i = 0; i < document.styleSheets.length; i++) { try { learn(document.styleSheets[i].cssRules); } catch (e) {} } }
        var els = document.body.querySelectorAll("[class]");
        for (var k = 0; k < els.length; k++) {
          var list = els[k].classList;
          for (var n = 0; n < list.length; n++) {
            var c = list[n];
            if (seen[c]) continue;
            seen[c] = 1;
            if (!known[c] && !/^(leaflet|onesignal)/i.test(c)) { loadCdn(); return; }
          }
        }
      }
      document.addEventListener("DOMContentLoaded", function () {
        obs = new MutationObserver(function () { if (!pending) { pending = true; setTimeout(scan, 300); } });
        obs.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class"] });
        scan();
      });
    })();
  </script>

    function escHtml(str) {
      return String(str === undefined || str === null ? "" : str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");

      const parts = String(name || "P").trim().split(/\s+/);

      return `<span class="inline-flex items-center justify-center ${dim} rounded-full font-extrabold border shrink-0 ${ring}" aria-hidden="true">${escHtml(getInitials(fullName))}</span>`;

    function parseTimeParts(timeStr) {
      const raw = String(timeStr || "12:00 PM").trim().toUpperCase();
      const ampm = raw.indexOf("AM") !== -1 ? "AM" : "PM";
      const parts = raw.replace(/[^0-9:]/g, "").split(":");
      let hr = parts[0] ? String(parseInt(parts[0], 10)) : "12";
      if (!hr || hr === "0" || isNaN(hr)) hr = "12";
      let min = parts[1] ? parts[1].padStart(2, "0") : "00";
      if (["00", "15", "30", "45"].indexOf(min) === -1) min = "00";
      return { hr: hr, min: min, ampm: ampm };
    }
    function parseTimeMinutes(timeStr) {
      const str = String(timeStr || "12:00 PM").trim().toUpperCase();
      const isPM = str.indexOf("PM") !== -1, isAM = str.indexOf("AM") !== -1;
      const parts = str.replace(/[^0-9:]/g, "").split(":");
      let hrs = parseInt(parts[0] || "12", 10);
      const mins = parseInt(parts[1] || "0", 10);
      if (isPM && hrs < 12) hrs += 12;
      if (isAM && hrs === 12) hrs = 0;
      return hrs * 60 + mins;

    // =========================================================================

    async function fetchWeatherForAllGamesAsync() {
      const today = getTodayIso();
      const uniqueCoords = {};
      (appData.games || []).forEach(function(g) {
        if (g.Date < today || g.Date > addDaysIso(today, 7) || g.Status === "Cancelled") return;
        const lat = g.locationDetails && g.locationDetails.lat, lng = g.locationDetails && g.locationDetails.lng;
        if (lat && lng) { const key = lat + "," + lng; if (!weatherCache[key]) uniqueCoords[key] = { lat: lat, lng: lng }; }
      });
      const keys = Object.keys(uniqueCoords);
      if (!keys.length) return;
      await Promise.all(keys.map(async function(key) {
        const c = uniqueCoords[key];
        try {
          const ctrl = new AbortController();
          const tid = setTimeout(function() { ctrl.abort(); }, 6000);
          const url = "https://api.open-meteo.com/v1/forecast?latitude=" + encodeURIComponent(c.lat) + "&longitude=" + encodeURIComponent(c.lng) +
            "&hourly=temperature_2m,precipitation_probability,weathercode,windspeed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&temperature_unit=fahrenheit&windspeed_unit=mph&timezone=auto&forecast_days=8";
          const res = await fetch(url, { signal: ctrl.signal });
          clearTimeout(tid);
          const data = await res.json();
          if (data && (data.hourly || data.daily)) weatherCache[key] = data;
        } catch (e) { weatherCache[key] = { failed: true }; }
      }));
      try { weatherCache._ts = Date.now(); sessionStorage.setItem("soccer_weather_v51", JSON.stringify(weatherCache)); } catch (e) {}
      if (activeTab === "upcoming" && !byId("modal-root").innerHTML) renderUpcomingGamesView();
    }

    function weatherInfo(game) {
      const lat = game.locationDetails && game.locationDetails.lat, lng = game.locationDetails && game.locationDetails.lng;
      if (!lat || !lng) return null;
      const w = weatherCache[lat + "," + lng];
      if (!w || w.failed) return null;
      const hourIso = String(game.Date).slice(0, 10) + "T" + String(Math.floor(parseTimeMinutes(game.Time) / 60)).padStart(2, "0") + ":00";
      const icon = function(code) { return code === 0 ? "☀️" : (code < 3 ? "⛅" : (code < 50 ? "☁️" : "🌧️")); };
      if (w.hourly && w.hourly.time) {
        const i = w.hourly.time.indexOf(hourIso);
        if (i !== -1) {
          const temp = Math.round(w.hourly.temperature_2m[i]), rain = w.hourly.precipitation_probability[i] || 0, wind = Math.round(w.hourly.windspeed_10m[i] || 0);
          return { icon: icon(w.hourly.weathercode[i]), text: temp + "°F", sub: "💧" + rain + "% · 💨" + wind + " mph", heat: temp >= 85, windy: wind >= 18 };
        }
      }
      if (w.daily && w.daily.time) {
        const j = w.daily.time.indexOf(String(game.Date).slice(0, 10));
        if (j !== -1) return { icon: icon(w.daily.weathercode[j]), text: Math.round(w.daily.temperature_2m_max[j]) + "° / " + Math.round(w.daily.temperature_2m_min[j]) + "°", sub: "" };
      }
      return null;
    }

    // =========================================================================
    // MATCH STATE HELPERS
    // =========================================================================
    function gameMeta(game) {
      const roster = game.roster || [];
      const me = myEmail();
      const myEntry = roster.find(function(r) { return r.email === me; }) || null;
      const yesList = roster.filter(function(r) { return r.status === "Yes"; });
      const waitlist = roster.filter(function(r) { return r.status === "Waitlist"; });
      const maybeList = roster.filter(function(r) { return r.status === "Maybe"; });
      const noList = roster.filter(function(r) { return r.status === "No"; });
      const isCancelled = String(game.Status) === "Cancelled";
      const yesCount = Number(game.yesCount || 0), maxCap = Number(game.MaxCap || S().defaultMax), minThreshold = Number(game.MinThreshold || S().defaultMin);
      const isGameCaptain = !!(currentUser && game.captainEmail && game.captainEmail === me);
      const canManage = !!(currentUser && (currentUser.isAdmin || isGameCaptain));
      const locked = !!game.rsvpLocked;
      return {
        roster, myEntry, myStatus: myEntry ? myEntry.status : "", yesList, waitlist, maybeList, noList, isCancelled,
        yesCount, maxCap, minThreshold, isFull: yesCount >= maxCap, isConfirmed: !isCancelled && yesCount >= minThreshold,
        myWaitPos: myEntry && myEntry.status === "Waitlist" ? waitlist.findIndex(function(r) { return r.email === me; }) + 1 : 0,
        isGameCaptain, canManage, locked, lockReason: game.lockReason || "", kickedOff: hasKickedOff(game),
        isSysAdmin: currentUser && isSystemAdminOnly(currentUser.email),
        mySide: myTeamSide(game, me)
      };
    }
    function myTeamSide(game, em) {
      if (!game.teams || !em) return "";
      if ((game.teams.white || []).some(function(p) { return p.email === em; })) return "white";
      if ((game.teams.dark || []).some(function(p) { return p.email === em; })) return "dark";
      return "";
    }
    function statusPill(game, m) {
      let cls = "bg-amber-500/20 text-amber-300 border border-amber-500/40", txt = t("pillNeeds", { n: Math.max(0, m.minThreshold - m.yesCount) });
      if (m.isCancelled) { cls = "bg-rose-500/20 text-rose-300 border border-rose-500/40"; txt = t("pillCancelled"); }
      else if (game.hasScore) { cls = "bg-slate-800 text-slate-200"; txt = t("pillFinal"); }
      else if (m.kickedOff) { cls = "bg-rose-500/20 text-rose-300 border border-rose-500/40"; txt = t("pillLive"); }
      else if (m.isFull) { cls = "bg-sky-500/20 text-sky-300 border border-sky-500/40"; txt = t("pillFull", { n: m.waitlist.length }); }
      else if (m.isConfirmed) { cls = "bg-[#00f59b]/20 text-[#00f59b] border border-[#00f59b]/40"; txt = t("pillOn"); }
      return `<span class="px-2.5 py-1 rounded-full text-xs font-extrabold uppercase tracking-wide ${cls}">${escHtml(txt)}</span>`;
    }
    function myStatusChip(m) {
      if (m.isSysAdmin) return "";
      const map = {
        Yes: ["bg-[#00f59b]/20 text-[#00f59b] border border-[#00f59b]/40", t("chipIn")],
        Waitlist: ["bg-sky-500/20 text-sky-300 border border-sky-500/40", t("chipWaitlist", { n: m.myWaitPos })],
        Maybe: ["bg-amber-500/20 text-amber-300 border border-amber-500/40", t("chipMaybe")],
        No: ["bg-slate-800 text-slate-300", t("chipOut")]
      };
      const v = map[m.myStatus] || ["bg-slate-800 text-slate-300", t("chipNoAnswer")];
      return `<span class="px-2.5 py-1 rounded-full text-xs font-bold ${v[0]}">${escHtml(v[1])}</span>`;
    }

    function toggleGameExpanded(gameId) {
      triggerHaptic();
      const today = getTodayIso();
      const upcoming = (appData.games || []).filter(function(g) { return String(g.Date) >= today; });
      const firstActive = upcoming.find(function(g) { return g.Status !== "Cancelled"; });
      const cur = expandedGames[gameId] !== undefined ? !!expandedGames[gameId] : !!(firstActive && String(firstActive.GameID) === String(gameId));
      expandedGames[gameId] = !cur;
      try { sessionStorage.setItem("soccer_expanded", JSON.stringify(expandedGames)); } catch (e) {}
      renderCurrentTab();
      if (!cur) setTimeout(function() { const el = byId("game-" + gameId); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 30);
    }

    function renderGameCard(game, collapsible) {
      const m = gameMeta(game);
      const id = String(game.GameID);
      const s = S();
      const w = weatherInfo(game);
      const isToday = game.Date === getTodayIso();

      const capPct = Math.min(100, Math.round((m.yesCount / Math.max(1, m.maxCap)) * 100));
      const minPct = Math.min(100, Math.round((m.minThreshold / Math.max(1, m.maxCap)) * 100));

      let html = `<article id="game-${escHtml(id)}" class="glass-card rounded-3xl p-4 sm:p-5 shadow-xl ${isToday && !m.isCancelled ? "ring-2 ring-[#00f59b]/40" : ""} ${m.isCancelled ? "opacity-90" : ""}">

            <h2 class="text-xl font-extrabold text-white leading-tight ${m.isCancelled ? "line-through" : ""}">${escHtml(game.Title)}</h2>
            <p class="text-sm text-slate-300 mt-1.5">🗓️ <b>${escHtml(whenLabel(game))}</b></p>
            <p class="text-sm text-slate-300 mt-0.5">📍 ${escHtml(game.LocationName)}</p>
            <p class="text-sm text-slate-400 mt-0.5">${game.captainName ? "👑 " + escHtml(t("captainIs", { name: game.captainName })) : "🛡️ " + escHtml(t("managedByAdmins"))}</p>
          </div>
          <div class="shrink-0 flex flex-col items-end gap-2">
            ${collapsible ? `<button type="button" onclick="toggleGameExpanded('${escJsArg(id)}')" aria-expanded="true" class="tap w-11 rounded-xl bg-slate-800 text-slate-300 text-lg" aria-label="${escHtml(t("collapse"))}">▴</button>` : ""}
            ${w && !m.isCancelled ? `<div class="text-right bg-emerald-950/50 border border-emerald-800/40 rounded-2xl px-2.5 py-1.5">
              <div class="text-sm font-extrabold text-white whitespace-nowrap">${w.icon} ${escHtml(w.text)}</div>
              ${w.sub ? `<div class="text-[11px] text-emerald-300 whitespace-nowrap">${escHtml(w.sub)}</div>` : ""}
              ${w.heat ? `<div class="text-[11px] font-bold text-amber-300">${escHtml(t("heatAlert"))}</div>` : ""}
            </div>` : ""}

          html += `<div class="shirt-banner mt-4 rounded-2xl p-3.5 flex items-center gap-3" style="background:${SHIRT_HEX[shirt] || "#fff"};color:${dark ? "#ffffff" : "#0f172a"}">

          html += `<div class="mt-3 p-3 rounded-2xl bg-amber-500/10 border border-amber-500/40 text-sm text-amber-300 font-semibold">🔔 <b>${escHtml(t("scheduleUpdate"))}</b> ${escHtml(game.ScheduleChangeSummary)}</div>`;
        }
        html += `<div class="mt-4">

              <div class="text-sm font-bold ${m.isConfirmed ? "text-[#00f59b]" : "text-amber-300"}">${escHtml(m.isConfirmed ? t("minReached") : t("needMore", { n: need }))}</div>
            </div>
            <div class="relative h-3 rounded-full bg-slate-800 overflow-hidden" role="progressbar" aria-valuemin="0" aria-valuemax="${m.maxCap}" aria-valuenow="${m.yesCount}" aria-label="${escHtml(t("playersIn"))}">

    function shirtName(key) { return t("shirt_" + (key || "white")); }

    function renderRsvpBlock(game, m) {
      const id = String(game.GameID);
      if (m.isSysAdmin) {
        return `<div class="mt-4 bg-amber-500/10 p-3.5 rounded-2xl border border-amber-500/40 text-sm text-amber-300"><b>${escHtml(t("sysAdminTitle"))}</b> ${escHtml(t("sysAdminSub"))}</div>`;

      if (m.locked) {
        const msg = m.lockReason === "scored" ? t("lockedScored") : t("lockedPast");
        const score = game.hasScore ? `<div class="mt-1.5 text-base font-extrabold text-white">🏆 ${escHtml(teamLabel("white"))} ${escHtml(game.ScoreWhite)} – ${escHtml(game.ScoreDark)} ${escHtml(teamLabel("dark"))}</div>` : "";
        return `<div class="mt-4 bg-[#0b130f] p-3.5 rounded-2xl border border-emerald-950 text-sm text-slate-300">🔒 ${escHtml(msg)}${score}
          <div class="mt-1 text-slate-400">${escHtml(t("yourAnswer"))}: <b class="text-white">${escHtml(statusWord(m.myStatus))}</b></div></div>`;
      }
      let html = `<div class="mt-4">`;
      if (m.myEntry && m.myEntry.needsReconfirm) {
        const keep = m.myStatus === "Maybe" ? "Maybe" : "Yes";
        html += `<div class="mb-3 p-3 rounded-2xl bg-amber-500/20 border border-amber-500/40 text-amber-300 text-sm">
          <b>${escHtml(t("reconfirmHint"))}</b>
          <div class="grid grid-cols-2 gap-2 mt-2">
            <button type="button" onclick="onRsvpTap('${escJsArg(id)}','${keep}')" class="tap rounded-xl neon-btn text-sm">${escHtml(keep === "Maybe" ? t("stillMaybe") : t("stillIn"))}</button>
            <button type="button" onclick="onRsvpTap('${escJsArg(id)}','No')" class="tap rounded-xl bg-rose-950 text-rose-300 font-bold text-sm">${escHtml(t("cantMakeIt"))}</button>
          </div></div>`;
      }
      if (m.kickedOff) html += `<div class="mb-3 p-3 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-sm text-rose-300 font-semibold">⏱️ ${escHtml(t("liveNotice"))}</div>`;

    let leafletPromise = null;
    let liveMaps = [];
    function loadLeaflet() {
      if (window.L) return Promise.resolve(window.L);
      if (leafletPromise) return leafletPromise;
      leafletPromise = new Promise(function(resolve, reject) {
        const css = document.createElement("link");
        css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
        document.head.appendChild(css);
        const js = document.createElement("script");
        js.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
        js.onload = function() { resolve(window.L); };
        js.onerror = function() { leafletPromise = null; reject(new Error("map")); };
        document.head.appendChild(js);
      });
      return leafletPromise;
    }
    function destroyCardMaps() {

    // Street map or satellite photo (Esri World Imagery, with place names on top). The choice is
    // remembered on this phone: players start on the street map, the admin field picker on satellite.
    const MAP_STYLE_DEFAULTS = { directions: "map", picker: "satellite" };
    function mapStylePref(kind) {
      const v = lsGet("soccer_map_style_" + kind, MAP_STYLE_DEFAULTS[kind] || "map");
      return v === "satellite" ? "satellite" : "map";
    }
    function addMapStyleSwitch(L, map, kind) {
      const layers = {
        map: L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }),
        satellite: L.layerGroup([
          L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics" }),
          L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 })
        ])
      };
      let current = mapStylePref(kind);
      layers[current].addTo(map);
      const Switch = L.Control.extend({
        options: { position: "topright" },
        onAdd: function() {
          const box = L.DomUtil.create("div", "map-style-switch");
          box.setAttribute("role", "group");
          box.setAttribute("aria-label", t("mapStyleLabel"));
          box.innerHTML = ["map", "satellite"].map(function(k) {
            return `<button type="button" data-style="${k}" aria-pressed="${k === current}">${escHtml(k === "map" ? t("mapStyleMap") : t("mapStyleSatellite"))}</button>`;
          }).join("");
          // Taps on the switch must never reach the map: on the field picker a map tap moves the pin.
          // (The buttons stay in place and only their pressed state changes, so Leaflet can always
          // tell the tap started on a control.)
          L.DomEvent.disableClickPropagation(box);
          L.DomEvent.disableScrollPropagation(box);
          L.DomEvent.on(box, "click", function(e) {
            L.DomEvent.stop(e);
            const b = e.target && e.target.closest ? e.target.closest("button[data-style]") : null;
            if (!b) return;
            const next = b.getAttribute("data-style");
            if (next === current) return;
            map.removeLayer(layers[current]);
            layers[next].addTo(map);
            current = next;
            lsSet("soccer_map_style_" + kind, next);
            triggerHaptic();
            box.querySelectorAll("button[data-style]").forEach(function(x) { x.setAttribute("aria-pressed", String(x.getAttribute("data-style") === current)); });
          });
          return box;
        }
      });
      new Switch().addTo(map);
    }

    async function saveMyMatchSheet(gameId) {
      const g = findGame(gameId); if (!g) return;
      const m = gameMeta(g);
      const checked = document.querySelector('input[name="mm-timing"]:checked');
      const newNote = checked ? checked.value : "";
      const maxG = S().maxGuests || 3;
      const inputs = Array.from({ length: maxG }).map(function(_, i) { const el = byId("mm-guest-" + i); return el ? el.value.replace(/,/g, " ").trim() : null; });
      const guestsEditable = inputs.some(function(v) { return v !== null; });
      const newGuests = inputs.filter(Boolean);
      const oldGuests = (m.myEntry && m.myEntry.guestNames) || [];
      const noteChanged = newNote !== ((m.myEntry && m.myEntry.availabilityNote) || "");
      const guestsChanged = guestsEditable && JSON.stringify(newGuests) !== JSON.stringify(oldGuests);
      if (!noteChanged && !guestsChanged) { closeModal(); return; }
      await runAction("mm-" + gameId, async function() {
        setBusyButton("mm-save", true);
        let last = null, ok = true;
        if (guestsChanged) {
          last = await apiPost({ action: "updateSignupExtras", gameId: gameId, field: "guestNames", value: newGuests });
          if (!last || !last.success) { ok = false; setBusyButton("mm-save", false); if (last && last.error) showToast(last.error, true); return; }
          setAppData(last);
        }
        if (noteChanged) {
          last = await apiPost({ action: "updateSignupExtras", gameId: gameId, field: "availabilityNote", value: newNote });
          if (!last || !last.success) { ok = false; setBusyButton("mm-save", false); if (last && last.error) showToast(last.error, true); return; }
          setAppData(last);
        }
        if (ok) { closeModal(); showToast((last && last.message) || t("saved")); renderCurrentTab(); }
      });
    }

      mutate("mm-" + gameId, { action: "updateSignupExtras", gameId: gameId, field: "guestNames", value: [] });
    }

        loadLeaflet().then(function(L) {
          const el = byId("dir-map"); if (!el) return;
          el.innerHTML = "";

          if (isNaN(lat) || isNaN(lng)) return;

          addMapStyleSwitch(L, map, "directions");
          const label = document.createElement("b"); label.textContent = "⚽ " + g.LocationName;
          L.marker([lat, lng]).addTo(map).bindPopup(label);

        }).catch(function() { const el = byId("dir-map"); if (el) el.textContent = t("mapUnavailable"); });
      }

    function copyText(text, okMsg) {
      const done = function() { showToast(okMsg || t("copied")); };

      else { fallbackCopy(text); done(); }
    }
    function fallbackCopy(text) {
      const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} document.body.removeChild(ta);
    }

    // =========================================================================
    // CALENDAR & SHARE
    // =========================================================================
    function calTimes(game) {
      const start = gameStartDate(game);
      const end = new Date(start.getTime() + 75 * 60000);
      const fmt = function(d) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") + "T" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0") + "00"; };
      return { start: fmt(start), end: fmt(end) };
    }
    function buildGoogleCalendarUrl(game) {
      const c = calTimes(game);
      const addr = (game.locationDetails && game.locationDetails.address) || game.LocationName;
      return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent("⚽ " + game.Title) +
        "&dates=" + c.start + "/" + c.end + "&location=" + encodeURIComponent(game.LocationName + " - " + addr) + "&details=" + encodeURIComponent(t("calDetails") + " " + SITE_URL);
    }
    function downloadIcsCalendar(gameId) {
      const game = findGame(gameId); if (!game) return;
      const c = calTimes(game);
      const addr = (game.locationDetails && game.locationDetails.address) || game.LocationName;
      const esc = function(s) { return String(s).replace(/([,;\\])/g, "\\$1"); };
      const now = new Date();
      const stamp = now.getUTCFullYear() + String(now.getUTCMonth() + 1).padStart(2, "0") + String(now.getUTCDate()).padStart(2, "0") + "T" + String(now.getUTCHours()).padStart(2, "0") + String(now.getUTCMinutes()).padStart(2, "0") + "00Z";
      const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Pitch Pulse League//Soccer Hub//EN", "BEGIN:VEVENT",
        "UID:" + game.GameID + "@pitchpulseleague.github.io", "DTSTAMP:" + stamp, "DTSTART:" + c.start, "DTEND:" + c.end,
        "SUMMARY:" + esc("⚽ " + game.Title), "LOCATION:" + esc(game.LocationName + " (" + addr + ")"), "DESCRIPTION:" + esc(t("calDetails") + " " + SITE_URL),
        "END:VEVENT", "END:VCALENDAR"].join("\r\n");
      const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar;charset=utf-8" }));
      const a = document.createElement("a"); a.href = url; a.download = "pitch-pulse-" + game.Date + ".ics";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
    }

      const m = gameMeta(game);

      const status = m.isCancelled ? t("pillCancelled") : (m.isConfirmed ? t("pillOn") : t("pillNeeds", { n: Math.max(0, m.minThreshold - m.yesCount) }));
      return "⚽ *" + game.Title + "*\n🗓️ " + whenLabel(game) + "\n📍 " + game.LocationName + "\n📊 " + status + " (" + m.yesCount + "/" + m.maxCap + ")\n✅ " + names + "\n👉 " + SITE_URL;
    }

    function showLoginModal(prefillEmail, note) {
      renderSheetModal(`

        </div>
        <button type="button" id="l-btn" onclick="doLogin()" class="tap-lg w-full rounded-2xl neon-btn text-base">${escHtml(t("loginBtn"))}</button>

          <button type="button" onclick="showForgotPinModal()" class="tap rounded-xl text-sm font-bold text-[#00f59b]">${escHtml(t("forgotPin"))}</button>

    function getPinVal() { return [0, 1, 2, 3, 4, 5].map(function(i) { const b = byId("pin-box-" + i); return b ? b.value.trim() : ""; }).join(""); }
    function onPinInput(idx, e) {
      e.target.value = e.target.value.replace(/[^0-9]/g, "").slice(-1);
      if (e.target.value && idx < 5) { const n = byId("pin-box-" + (idx + 1)); if (n) n.focus(); }
      if (getPinVal().length === 6) doLogin();
    }
    function onPinKey(idx, e) {
      if (e.key === "Backspace" && !e.target.value && idx > 0) { const p = byId("pin-box-" + (idx - 1)); if (p) p.focus(); }
      if (e.key === "Enter") doLogin();
    }
    function onPinPaste(e) {
      const p = (e.clipboardData || window.clipboardData).getData("text").replace(/[^0-9]/g, "").slice(0, 6);
      if (p.length) {
        e.preventDefault();
        for (let i = 0; i < 6; i++) { const bx = byId("pin-box-" + i); if (bx) bx.value = p[i] || ""; }
        if (p.length === 6) doLogin();
      }
    }
    async function doLogin() {
      const email = (byId("l-email") ? byId("l-email").value : "").trim();
      const pin = getPinVal();
      if (!email) { showToast(t("errEnterEmail"), true); return; }
      if (!/^\d{6}$/.test(pin)) return;
      await runAction("login", async function() {
        setBusyButton("l-btn", true);
        const res = await apiPost({ action: "login", email: email, pin: pin }, { noAuth: true });
        setBusyButton("l-btn", false);
        if (res && res.success) {
          currentUser = res.user;
          lsSet("soccer_user", JSON.stringify(currentUser));
          setAppData(res.appData || {});
          closeModal(); renderAuthBar(); switchTab("upcoming");
          fetchWeatherForAllGamesAsync(); initOneSignalSdkIfConfigured();
          applyEmailRsvpIfReady();
        } else {
          for (let i = 0; i < 6; i++) { const bx = byId("pin-box-" + i); if (bx) bx.value = ""; }
          const first = byId("pin-box-0"); if (first) first.focus();
          if (res && res.error) showToast(res.error, true);
        }
      });
    }

    async function doRegister() {

    function initFieldPickerMap(L) {
      const el = byId("field-map"); if (!el) return;
      el.innerHTML = "";
      let lat = parseFloat(byId("loc-lat").value), lng = parseFloat(byId("loc-lng").value);
      if (isNaN(lat) || isNaN(lng)) { lat = 33.1434; lng = -117.1661; }
      fieldPickerMap = L.map(el).setView([lat, lng], 17);
      addMapStyleSwitch(L, fieldPickerMap, "picker");
      fieldPickerMarker = L.marker([lat, lng], { draggable: true }).addTo(fieldPickerMap);
      fieldPickerMarker.on("dragend", function(e) { updateCoords(e.target.getLatLng().lat, e.target.getLatLng().lng); });
      fieldPickerMap.on("click", function(e) { fieldPickerMarker.setLatLng(e.latlng); updateCoords(e.latlng.lat, e.latlng.lng); });
      liveMaps.push(fieldPickerMap);
      setTimeout(function() { fieldPickerMap.invalidateSize(); }, 150);
    }
    async function updateCoords(lat, lng) {
      if (!byId("loc-lat")) return;
      byId("loc-lat").value = lat.toFixed(6); byId("loc-lng").value = lng.toFixed(6);
      try {
        const res = await fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat=" + lat + "&lon=" + lng);
        const data = await res.json();
        if (data && data.display_name && byId("loc-addr")) byId("loc-addr").value = data.display_name;
      } catch (e) {}
    }
    async function searchFieldOnMap() {
      const q = byId("map-search-query").value.trim();
      if (!q) return;
      try {
        const res = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q));
        const hits = await res.json();
        if (!hits || !hits.length) { showToast(t("placeNotFound"), true); return; }
        const lat = parseFloat(hits[0].lat), lng = parseFloat(hits[0].lon);
        byId("loc-lat").value = lat.toFixed(6); byId("loc-lng").value = lng.toFixed(6);
        byId("loc-addr").value = hits[0].display_name;
        if (!byId("loc-name").value) byId("loc-name").value = hits[0].display_name.split(",")[0];
        if (fieldPickerMap) { fieldPickerMap.setView([lat, lng], 16); fieldPickerMarker.setLatLng([lat, lng]); }
      } catch (e) { showToast(t("errNetwork"), true); }
    }
    function submitFieldForm(locationId) {

    }

        <div id="push-vault-container">${renderPushVault()}</div>

        <h3 class="text-sm font-extrabold text-[#00f59b] mt-6 mb-2">🩺 ${escHtml(t("systemStatus"))}</h3>
        <div class="grid grid-cols-2 gap-2 text-sm">
          <div class="p-3 rounded-2xl bg-[#0b130f] border border-emerald-950"><div class="text-xs text-slate-400">${escHtml(t("emailQuota"))}</div><div class="text-lg font-extrabold ${sys.emailQuotaLeft !== undefined && sys.emailQuotaLeft < 20 ? "text-amber-300" : "text-white"}">${sys.emailQuotaLeft === undefined || sys.emailQuotaLeft < 0 ? "—" : sys.emailQuotaLeft}</div></div>
          <div class="p-3 rounded-2xl bg-[#0b130f] border border-emerald-950"><div class="text-xs text-slate-400">${escHtml(t("pushStatus"))}</div><div class="text-lg font-extrabold ${appData.pushConfigured ? "text-[#00f59b]" : "text-amber-300"}">${escHtml(appData.pushConfigured ? t("onWord") : t("offWord"))}</div></div>
        </div>
        <p class="text-xs text-slate-400 mt-2">${escHtml(t("quotaHelp"))}</p>
      `);
    }
    function saveLeagueSettingsForm() {
      const a = byId("st-a-name").value.trim(), b = byId("st-b-name").value.trim();
      const min = parseInt(byId("st-min").value, 10), max = parseInt(byId("st-max").value, 10);
      if (!a || !b) { showToast(t("errTeamNameEmpty"), true); return; }
      if (a.toLowerCase() === b.toLowerCase()) { showToast(t("errTeamNamesSame"), true); return; }
      if (isNaN(min) || isNaN(max) || min < 2 || max > 60 || min > max) { showToast(t("errMinMax"), true); return; }
      mutate("settings", { action: "adminSaveLeagueSettings", teamAName: a, teamAShirt: byId("st-a-shirt").value, teamBName: b, teamBShirt: byId("st-b-shirt").value,
        defaultMin: min, defaultMax: max, trackBall: byId("st-ball").checked, trackPinnies: byId("st-pinnies").checked, trackGK: byId("st-gk").checked }, { button: "st-save" });
    }
    function renderPushVault() {
      if (!pushVaultState) {
        return `<div class="p-4 rounded-2xl bg-[#0b130f] border border-emerald-950">
          <p class="text-sm text-slate-300 mb-2">🔒 ${escHtml(t("vaultLocked"))}</p>
          <div class="flex gap-2"><input id="vault-pin-input" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••" class="tap flex-1 min-w-0 px-3.5 rounded-2xl bg-[#111c16] border border-emerald-900 text-center text-lg font-bold tracking-[0.3em] text-white">
          <button type="button" id="vault-unlock" onclick="unlockPushVault()" class="tap px-5 rounded-2xl neon-btn text-base">${escHtml(t("unlockBtn"))}</button></div></div>`;
      }
      return `<div class="p-4 rounded-2xl bg-[#0b130f] border border-emerald-950 space-y-3">
        ${fieldInput("cfg-app-id", "OneSignal App ID", pushVaultState.appId || "", { attrs: 'autocomplete="off" spellcheck="false"' })}
        ${fieldInput("cfg-rest-key", t("restKeyLbl"), "", { type: "password", attrs: 'autocomplete="off" placeholder="' + escHtml(pushVaultState.restKeySet ? t("restKeyKeep", { hint: pushVaultState.restKeyHint }) : t("restKeyNone")) + '"' })}
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="pushVaultState=null; renderAdminView();" class="tap rounded-2xl bg-slate-800 text-slate-200 font-bold text-sm">🔒 ${escHtml(t("lockBtn"))}</button>
          <button type="button" id="vault-save" onclick="savePushConfigSubmit()" class="tap rounded-2xl neon-btn text-sm">${escHtml(t("saveBtn"))}</button>
        </div></div>`;
    }
    async function unlockPushVault() {
      const pin = byId("vault-pin-input").value.trim();
      if (!/^\d{6}$/.test(pin)) { showToast(t("errPin6"), true); return; }
      await runAction("vault", async function() {
        setBusyButton("vault-unlock", true);
        const res = await apiPost({ action: "adminUnlockPushConfig", confirmPin: pin });
        setBusyButton("vault-unlock", false);
        if (res && res.success) { pushVaultState = { pin: pin, appId: res.oneSignalAppId, restKeySet: res.restKeySet, restKeyHint: res.restKeyHint }; byId("push-vault-container").innerHTML = renderPushVault(); }
        else if (res && res.error) showToast(res.error, true);
      });
    }
    function savePushConfigSubmit() {
      if (!pushVaultState) return;
      mutate("vault-save", { action: "adminSavePushConfig", confirmPin: pushVaultState.pin, oneSignalAppId: byId("cfg-app-id").value.trim(), oneSignalRestKey: byId("cfg-rest-key").value.trim() },
        { button: "vault-save", after: function() { pushVaultState = null; renderAdminView(); } });
    }

    // =========================================================================
    // RSVP & EXTRAS — instant UI, automatic rollback if the save fails
    // =========================================================================
    function minutesToKickoff(g) { return Math.round((gameStartDate(g).getTime() - Date.now()) / 60000); }

    function onRsvpTap(gameId, status) {
      if (!currentUser) { showLoginModal(); return; }
      const g = findGame(gameId); if (!g) return;
      const m = gameMeta(g);
      if (m.isCancelled) { showToast(t("errCancelledMatch"), true); return; }
      if (m.locked) { showToast(m.lockReason === "scored" ? t("lockedScored") : t("lockedPast"), true); return; }
      if (status === "Yes" && m.myStatus === "Waitlist" && m.isFull) { showToast(t("sentWaitlist", { n: m.myWaitPos })); return; }
      // the same answer again is how you confirm it still stands after a time/place change
      if (status === m.myStatus && !(m.myEntry && m.myEntry.needsReconfirm)) { showToast(t("alreadyAnswered", { status: statusWord(status) })); return; }
      if (m.myStatus === "Yes" && status !== "Yes") {
        const guests = (m.myEntry && m.myEntry.guestNames ? m.myEntry.guestNames.length : 0);
        const mins = minutesToKickoff(g);
        const late = g.Date === getTodayIso() && mins <= 180 && mins > -60;
        const gear = [];
        if (S().trackBall && m.myEntry.bringBall) gear.push(t("gearBall"));
        if (S().trackPinnies && m.myEntry.bringPinnies) gear.push(t("gearPinnies"));
        const goalie = S().trackGK && m.myEntry.playGK;
        if (guests || late || gear.length || goalie) {
          const body = [guests ? t("leaveGuests", { n: guests }) : "", gear.length ? t("leaveGear", { items: gear.join(", ") }) : "", goalie ? t("leaveGK") : "", late ? t("leaveLate") : ""].filter(Boolean).join(" ");
          confirmDialog({ icon: "🤔", title: t("leaveConfirmTitle"), body: body, okLabel: status === "Maybe" ? t("rsvpMaybe") : t("rsvpOut"), cancelLabel: t("stayIn"), danger: true,
            onOk: function() { closeModal(); submitRsvp(gameId, status); } });
          return;
        }
      }
      submitRsvp(gameId, status);
    }

    function replaceGame(gameObj) {
      const i = (appData.games || []).findIndex(function(x) { return String(x.GameID) === String(gameObj.GameID); });
      if (i !== -1) appData.games[i] = gameObj;
    }

    async function submitRsvp(gameId, status) {
      const key = "rsvp-" + gameId;
      if (inFlight[key]) return;
      triggerHaptic();
      const g = findGame(gameId); if (!g) return;
      const snapshot = JSON.parse(JSON.stringify(g));
      const me = myEmail();
      g.roster = g.roster || [];
      let entry = g.roster.find(function(r) { return r.email === me; });
      const wasYes = entry && entry.status === "Yes";
      let optimistic = status;
      if (status === "Yes" && !wasYes && Number(g.yesCount || 0) >= Number(g.MaxCap || 18)) optimistic = "Waitlist";
      const startsAsGK = !!(S().trackGK && currentUser.position === "GK");
      if (entry) {
        entry.status = optimistic; entry.needsReconfirm = false;
        if (optimistic === "Yes" && !wasYes) entry.playGK = startsAsGK;
        if (optimistic !== "Yes") { entry.guestNames = []; entry.guestCount = 0; entry.bringBall = false; entry.bringPinnies = false; entry.playGK = false; entry.availabilityNote = ""; }
      } else {
        entry = { email: me, fullName: currentUser.fullName, position: currentUser.position || "MID", status: optimistic, bringBall: false, bringPinnies: false, playGK: optimistic === "Yes" && startsAsGK, guestNames: [], availabilityNote: "", timestamp: "" };
        g.roster.push(entry);
      }
      entry.playPosition = effectivePos(entry.position, entry.playGK);
      if (g.teams && optimistic !== "Yes") {
        ["white", "dark"].forEach(function(side) { g.teams[side] = (g.teams[side] || []).filter(function(p) { return p.email !== me && p.hostEmail !== me; }); });
      }
      g.yesCount = g.roster.reduce(function(n, r) { return n + (r.status === "Yes" ? 1 + (r.guestNames ? r.guestNames.length : 0) : 0); }, 0);
      rosterSubTabByGame[gameId] = optimistic === "Waitlist" ? "waitlist" : (optimistic === "Maybe" ? "maybe" : (optimistic === "No" ? "no" : "yes"));
      renderCurrentTab();

      await runAction(key, async function() {
        const res = await apiPost({ action: "updateSignup", gameId: gameId, email: currentUser.email, status: status });
        if (res && res.success) {
          setAppData(res);
          renderCurrentTab();
          const fin = res.finalStatus || status;
          showToast(res.message || (fin === "Yes" ? t("toastIn") : (fin === "Waitlist" ? t("toastWaitlist") : (fin === "Maybe" ? t("toastMaybe") : t("toastOut")))));
          if (res.captainLeft) {
            setTimeout(function() {
              confirmDialog({ icon: "👑", title: t("captainLeftTitle"), body: t("captainLeftBody"), okLabel: t("stepDownBtn"), cancelLabel: t("keepCaptain"),
                onOk: function() { mutate("stepdown-" + gameId, { action: "captainStepDown", gameId: gameId }, { button: "confirm-ok-btn" }); } });
            }, 400);
          }
        } else {
          replaceGame(snapshot);
          renderCurrentTab();
          if (res && res.error) showToast(res.error, true);
          if (res && res.locked) syncFromBackend(true);
        }
      });
    }

    async function toggleSignupExtra(gameId, field, value) {
      const key = "extra-" + gameId + "-" + field;
      if (inFlight[key]) return;
      triggerHaptic();
      const g = findGame(gameId); if (!g) return;
      const snapshot = JSON.parse(JSON.stringify(g));
      const entry = (g.roster || []).find(function(r) { return r.email === myEmail(); });
      if (entry) { entry[field] = value; if (field === "playGK") entry.playPosition = effectivePos(entry.position, value); }
      renderCurrentTab();
      await runAction(key, async function() {
        const res = await apiPost({ action: "updateSignupExtras", gameId: gameId, field: field, value: value });
        if (res && res.success) { setAppData(res); renderCurrentTab(); if (res.message) showToast(res.message); }
        else { replaceGame(snapshot); renderCurrentTab(); if (res && res.error) showToast(res.error, true); }
      });
    }

    // =========================================================================
    // ANSWER BUTTONS IN EMAILS (?rsvp=Yes|Maybe|No&game=…&email=…)
    // Logged in on this phone: the answer is applied right away (with the usual checks).
    // Not logged in: a login sheet with the email filled in, then the answer is applied.
    // =========================================================================
    let pendingEmailRsvp = null;
    function readEmailRsvpLink() {
      let p;
      try { p = new URLSearchParams(location.search); } catch (e) { return; }
      const status = p.get("rsvp"), gameId = p.get("game");
      if (!gameId || ["Yes", "Maybe", "No"].indexOf(status) === -1) return;
      pendingEmailRsvp = { status: status, gameId: gameId, email: String(p.get("email") || "").toLowerCase().trim() };
      try { history.replaceState(null, "", location.pathname); } catch (e) {} // a refresh must not answer again
    }
    function emailRsvpNote(r) { return t("rsvpLinkLogin", { status: statusWord(r.status) }); }
    function applyEmailRsvpIfReady() {
      const r = pendingEmailRsvp;
      if (!r || !currentUser) return;
      pendingEmailRsvp = null;
      if (r.email && myEmail() !== r.email) {
        confirmDialog({ icon: "✉️", title: t("rsvpLinkOtherTitle", { email: r.email }), body: t("rsvpLinkOtherBody", { me: currentUser.email, email: r.email }), okLabel: t("logoutBtn"),
          onOk: function() { logout(); pendingEmailRsvp = r; showLoginModal(r.email, emailRsvpNote(r)); } });
        return;
      }
      const g = findGame(r.gameId);
      if (!g) { showToast(t("rsvpLinkGone"), true); return; }
      if (activeTab !== "upcoming") switchTab("upcoming");
      expandedGames[r.gameId] = true;
      renderCurrentTab();
      setTimeout(function() {
        const el = byId("game-" + r.gameId);
        if (el) try { el.scrollIntoView({ block: "start" }); } catch (e) {}
        onRsvpTap(r.gameId, r.status);
      }, 60);
    }

    // =========================================================================
    // INVITE LINKS (?invite=…&email=…) & BOOT
    // =========================================================================
    function handleInviteLink() {
      let params;
      try { params = new URLSearchParams(location.search); } catch (e) { return; }
      const token = params.get("invite"), email = String(params.get("email") || "").toLowerCase().trim();
      if (!token || !email) return;
      if (currentUser && myEmail() === email) {
        try { history.replaceState(null, "", location.pathname); } catch (e) {}
        return;
      }
      pendingInvite = { token: token, email: email };
      if (currentUser) {
        setTimeout(function() {
          confirmDialog({ icon: "✉️", title: t("inviteOtherTitle", { email: email }), body: t("inviteOtherBody", { me: currentUser.email }), okLabel: t("logoutBtn"),
            onOk: function() { logout(); showRegisterModal(); } });
        }, 300);
      }
    }

    applyThemeAndLanguageUI();
    readEmailRsvpLink();
    handleInviteLink();
    renderAuthBar();
    renderCurrentTab();
    if (currentUser) {
      fetchWeatherForAllGamesAsync();
      syncFromBackend(true);           // the email answer is applied once fresh data arrives
      initOneSignalSdkIfConfigured();
    } else if (pendingInvite) {
      showRegisterModal();
    } else if (pendingEmailRsvp) {
      showLoginModal(pendingEmailRsvp.email, emailRsvpNote(pendingEmailRsvp));
    }
  </script>
</body>
</html>
