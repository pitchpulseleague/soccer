        ${subHead("pulse", t("systemStatus"), "hi_status")}
        <div class="grid grid-cols-2 gap-2 text-sm">
          <div class="p-3 rounded-2xl bg-[#0b130f] border border-emerald-950"><div class="text-xs text-slate-400">${escHtml(t("emailQuota"))}</div><div class="text-lg font-extrabold ${sys.emailQuotaLeft !== undefined && sys.emailQuotaLeft < 20 ? "text-amber-300" : "text-white"}">${sys.emailQuotaLeft === undefined || sys.emailQuotaLeft < 0 ? "—" : sys.emailQuotaLeft}</div></div>
          <div class="p-3 rounded-2xl bg-[#0b130f] border border-emerald-950"><div class="text-xs text-slate-400">${escHtml(t("pushStatus"))}</div><div class="text-lg font-extrabold ${appData.pushConfigured ? "text-[#00f59b]" : "text-amber-300"}">${escHtml(appData.pushConfigured ? t("onWord") : t("offWord"))}</div></div>
        </div>
        <p class="text-xs text-slate-400 mt-2">${escHtml(t("quotaHelp"))}</p>
      `, "", "hi_settings");
    }
    function saveLeagueSettingsForm() {
      const min = parseInt(byId("st-min").value, 10), max = parseInt(byId("st-max").value, 10);
      if (isNaN(min) || isNaN(max) || min < 2 || max > 60 || min > max) { showToast(t("errMinMax"), true); return; }
      const payload = { action: "adminSaveLeagueSettings", defaultMin: min, defaultMax: max };
      if (byId("st-a-name")) {
        const a = byId("st-a-name").value.trim(), b = byId("st-b-name").value.trim();
        if (!a || !b) { showToast(t("errTeamNameEmpty"), true); return; }
        if (a.toLowerCase() === b.toLowerCase()) { showToast(t("errTeamNamesSame"), true); return; }
        payload.teamAName = a; payload.teamAShirt = byId("st-a-shirt").value; payload.teamBName = b; payload.teamBShirt = byId("st-b-shirt").value;
      }
      mutate("settings", payload, { button: "st-save" });
    }
    function renderPushVault() {
      if (!pushVaultState) {
        return `<div class="p-4 rounded-2xl bg-[#0b130f] border border-emerald-950">
          <p class="text-sm text-slate-300 mb-2 flex gap-2">${ic("lock", "w-4 h-4 mt-0.5 shrink-0")}<span>${escHtml(t("vaultLocked"))}</span></p>
          <div class="flex gap-2"><input id="vault-pin-input" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••" class="tap flex-1 min-w-0 px-3.5 rounded-2xl bg-[#111c16] border border-emerald-900 text-center text-lg font-bold tracking-[0.3em] text-white">
          <button type="button" id="vault-unlock" onclick="unlockPushVault()" class="tap px-5 rounded-2xl neon-btn text-base">${escHtml(t("unlockBtn"))}</button></div></div>`;
      }
      return `<div class="p-4 rounded-2xl bg-[#0b130f] border border-emerald-950 space-y-3">
        ${fieldInput("cfg-app-id", "OneSignal App ID", pushVaultState.appId || "", { attrs: 'autocomplete="off" spellcheck="false" autocapitalize="none"' })}
        ${fieldInput("cfg-rest-key", t("restKeyLbl"), "", { type: "password", attrs: 'autocomplete="off" placeholder="' + escHtml(pushVaultState.restKeySet ? t("restKeyKeep", { hint: pushVaultState.restKeyHint }) : t("restKeyNone")) + '"' })}
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="pushVaultState=null; renderAdminView();" class="tap rounded-2xl bg-slate-800 text-slate-200 font-bold text-sm inline-flex items-center justify-center gap-1.5">${ic("lock", "w-4 h-4")}${escHtml(t("lockBtn"))}</button>
          <button type="button" id="vault-save" onclick="savePushConfigSubmit()" class="tap rounded-2xl neon-btn text-sm">${escHtml(t("saveBtn"))}</button>
        </div></div>`;
    }
    async function unlockPushVault() {
      const pin = byId("vault-pin-input").value.trim();
      if (!/^\d{6}$/.test(pin)) { showToast(t("errPin6"), true); return; }
      await runAction("vault", async function() {
        setBusyButton("vault-unlock", true);
        const res = await apiPost({ action: "adminUnlockPushConfig", confirmPin: pin });
        setBusyButton("vault-unlock", false);
        if (res && res.success) { pushVaultState = { pin: pin, appId: res.oneSignalAppId, restKeySet: res.restKeySet, restKeyHint: res.restKeyHint }; byId("push-vault-container").innerHTML = renderPushVault(); }
        else if (res && res.error) showToast(res.error, true);
      });
    }
    function savePushConfigSubmit() {
      if (!pushVaultState) return;
      mutate("vault-save", { action: "adminSavePushConfig", confirmPin: pushVaultState.pin, oneSignalAppId: byId("cfg-app-id").value.trim(), oneSignalRestKey: byId("cfg-rest-key").value.trim() },
        { button: "vault-save", after: function() { pushVaultState = null; renderAdminView(); } });
    }

    // =========================================================================
    // RSVP & EXTRAS — instant UI, automatic rollback if the save fails
    // =========================================================================
    function minutesToKickoff(g) { return Math.round((gameStartDate(g).getTime() - Date.now()) / 60000); }

    function onRsvpTap(gameId, status) {
      if (!currentUser) { showLoginModal(); return; }
      const g = findGame(gameId); if (!g) return;
      const m = gameMeta(g);
      if (m.isCancelled) { showToast(t("errCancelledMatch"), true); return; }
      if (m.locked) { showToast(m.lockReason === "scored" ? t("lockedScored") : t("lockedPast"), true); return; }
      if (status === "Yes" && m.myStatus === "Waitlist" && m.isFull) { showToast(t("sentWaitlist", { n: m.myWaitPos })); return; }
      // the same answer again is how you confirm it still stands after a time/place change
      if (status === m.myStatus && !(m.myEntry && m.myEntry.needsReconfirm)) { showToast(t("alreadyAnswered", { status: statusWord(status) })); return; }
      if (m.myStatus === "Yes" && status !== "Yes") {
        const guests = (m.myEntry && m.myEntry.guestNames ? m.myEntry.guestNames.length : 0);
        const mins = minutesToKickoff(g);
        const late = gf(g, "lateDrops") && g.Date === getTodayIso() && mins <= 180 && mins > -60;
        const gear = [];
        if (gf(g, "ball") && m.myEntry.bringBall) gear.push(t("gearBall"));
        if (gf(g, "pinnies") && m.myEntry.bringPinnies) gear.push(t("gearPinnies"));
        const goalie = gf(g, "gk") && m.myEntry.playGK;
        if (guests || late || gear.length || goalie) {
          const body = [guests ? t("leaveGuests", { n: guests }) : "", gear.length ? t("leaveGear", { items: gear.join(", ") }) : "", goalie ? t("leaveGK") : "", late ? t("leaveLate") : ""].filter(Boolean).join(" ");
          confirmDialog({ icon: "help", title: t("leaveConfirmTitle"), body: body, okLabel: status === "Maybe" ? t("rsvpMaybe") : t("rsvpOut"), cancelLabel: t("stayIn"), danger: true,
            onOk: function() { closeModal(); submitRsvp(gameId, status); } });
          return;
        }
      }
      submitRsvp(gameId, status);
    }

    function replaceGame(gameObj) {
      const i = (appData.games || []).findIndex(function(x) { return String(x.GameID) === String(gameObj.GameID); });
      if (i !== -1) appData.games[i] = gameObj;
    }

    async function submitRsvp(gameId, status) {
      const key = "rsvp-" + gameId;
      if (inFlight[key]) return;
      triggerHaptic();
      const g = findGame(gameId); if (!g) return;
      const snapshot = JSON.parse(JSON.stringify(g));
      const me = myEmail();
      g.roster = g.roster || [];
      let entry = g.roster.find(function(r) { return r.email === me; });
      const wasYes = entry && entry.status === "Yes";
      let optimistic = status;
      if (status === "Yes" && !wasYes && Number(g.yesCount || 0) >= Number(g.MaxCap || 18)) optimistic = "Waitlist";
      const startsAsGK = !!(gf(g, "gk") && currentUser.position === "GK");
      if (entry) {
        entry.status = optimistic; entry.needsReconfirm = false;
        if (optimistic === "Yes" && !wasYes) entry.playGK = startsAsGK;
        if (optimistic !== "Yes") { entry.guestNames = []; entry.guestCount = 0; entry.bringBall = false; entry.bringPinnies = false; entry.playGK = false; entry.availabilityNote = ""; }
      } else {
        entry = { email: me, fullName: currentUser.fullName, position: currentUser.position || "MID", status: optimistic, bringBall: false, bringPinnies: false, playGK: optimistic === "Yes" && startsAsGK, guestNames: [], availabilityNote: "", timestamp: "" };
        g.roster.push(entry);
      }
      entry.playPosition = effectivePos(entry.position, entry.playGK, g);
      if (g.teams && optimistic !== "Yes") {
        ["white", "dark"].forEach(function(side) { g.teams[side] = (g.teams[side] || []).filter(function(p) { return p.email !== me && p.hostEmail !== me; }); });
      }
      g.yesCount = g.roster.reduce(function(n, r) { return n + (r.status === "Yes" ? 1 + (r.guestNames ? r.guestNames.length : 0) : 0); }, 0);
      rosterSubTabByGame[gameId] = optimistic === "Waitlist" ? "waitlist" : (optimistic === "Maybe" ? "maybe" : (optimistic === "No" ? "no" : "yes"));
      renderCurrentTab();

      await runAction(key, async function() {
        const res = await apiPost({ action: "updateSignup", gameId: gameId, email: currentUser.email, status: status });
        if (res && res.success) {
          setAppData(res);
          renderCurrentTab();
          const fin = res.finalStatus || status;
          showToast(res.message || (fin === "Yes" ? t("toastIn") : (fin === "Waitlist" ? t("toastWaitlist") : (fin === "Maybe" ? t("toastMaybe") : t("toastOut")))));
          if (res.captainLeft) {
            setTimeout(function() {
              confirmDialog({ icon: "flag", title: t("captainLeftTitle"), body: t("captainLeftBody"), okLabel: t("stepDownBtn"), cancelLabel: t("keepCaptain"),
                onOk: function() { mutate("stepdown-" + gameId, { action: "captainStepDown", gameId: gameId }, { button: "confirm-ok-btn" }); } });
            }, 400);
          }
        } else {
          replaceGame(snapshot);
          renderCurrentTab();
          if (res && res.error) showToast(res.error, true);
          if (res && res.locked) syncFromBackend(true);
        }
      });
    }

    async function toggleSignupExtra(gameId, field, value) {
      const key = "extra-" + gameId + "-" + field;
      if (inFlight[key]) return;
      triggerHaptic();
      const g = findGame(gameId); if (!g) return;
      const snapshot = JSON.parse(JSON.stringify(g));
      const entry = (g.roster || []).find(function(r) { return r.email === myEmail(); });
      if (entry) { entry[field] = value; if (field === "playGK") entry.playPosition = effectivePos(entry.position, value, g); }
      renderCurrentTab();
      await runAction(key, async function() {
        const res = await apiPost({ action: "updateSignupExtras", gameId: gameId, field: field, value: value });
        if (res && res.success) { setAppData(res); renderCurrentTab(); if (res.message) showToast(res.message); }
        else { replaceGame(snapshot); renderCurrentTab(); if (res && res.error) showToast(res.error, true); }
      });
    }

    // =========================================================================
    // ANSWER BUTTONS IN EMAILS (?rsvp=Yes|Maybe|No&game=…&email=…&sig=…)
    // Signed links save the answer straight away — no login, on any phone or computer.
    // Older links without a signature: applied after logging in once on this phone.
    // =========================================================================
    let pendingEmailRsvp = null, pendingEmailAnswer = null;
    function readEmailRsvpLink() {
      let p;
      try { p = new URLSearchParams(location.search); } catch (e) { return; }
      const status = p.get("rsvp"), gameId = p.get("game");
      if (!gameId || ["Yes", "Maybe", "No"].indexOf(status) === -1) return;
      const email = String(p.get("email") || "").toLowerCase().trim(), sig = String(p.get("sig") || "");
      if (sig && email) pendingEmailAnswer = { status: status, gameId: gameId, email: email, sig: sig };
      else pendingEmailRsvp = { status: status, gameId: gameId, email: email };
      try { history.replaceState(null, "", location.pathname); } catch (e) {} // a refresh must not answer again
    }

    async function submitEmailAnswer(status) {
      const a = pendingEmailAnswer;
      if (!a) return;
      if (status) a.status = status;
      if (!a.result) renderEmailAnswerSheet({ saving: true });
      else setBusyButton("ea-" + a.status, true);
      const res = await runAction("email-answer", function() {
        return apiPost({ action: "emailAnswer", email: a.email, gameId: a.gameId, status: a.status, sig: a.sig }, { noAuth: true, silent: true });
      });
      if (res === null && inFlight["email-answer"]) return;
      if (!res) { renderEmailAnswerSheet({ error: t("errNetwork"), retry: true }); return; }
      if (!res.success) { renderEmailAnswerSheet({ error: res.badLink ? t("eaBadLink") : (res.error || t("rsvpLinkGone")) }); return; }
      a.result = res;
      renderEmailAnswerSheet({ res: res });
      triggerHaptic();
      if (currentUser && myEmail() === res.email) syncFromBackend(true);
    }
    function renderEmailAnswerSheet(st) {
      const a = pendingEmailAnswer || {};
      if (st.saving) {
        renderSheetModal(`<div class="text-center py-8">
          <span class="inline-block w-9 h-9 rounded-full border-[3px] border-[#00f59b] border-t-transparent animate-spin"></span>
          <p class="mt-3 text-sm font-semibold text-slate-300">${escHtml(t("eaSaving"))}</p></div>`, "max-w-sm");
        return;
      }
      const openBtn = currentUser
        ? `<button type="button" onclick="closeEmailAnswer(true)" class="tap-lg w-full rounded-2xl neon-btn text-base">${escHtml(myEmail() === a.email ? t("eaSeeWho") : t("eaOpenApp"))}</button>`
        : `<button type="button" onclick="closeEmailAnswer(false); showLoginModal('${escJsArg(a.email)}')" class="tap-lg w-full rounded-2xl neon-btn text-base">${escHtml(t("eaLoginToSee"))}</button>`;
      if (st.error) {
        renderSheetModal(`<div class="text-center pt-1">
          <span class="w-14 h-14 mx-auto mb-3 rounded-full inline-flex items-center justify-center bg-amber-500/20 text-amber-300">${ic("alert", "w-7 h-7")}</span>
          <p class="text-base font-bold text-white leading-snug mb-4">${escHtml(st.error)}</p>
          ${st.retry ? `<button type="button" onclick="submitEmailAnswer()" class="tap-lg w-full mb-2 rounded-2xl bg-slate-800 text-slate-200 font-bold text-base">${escHtml(t("eaRetry"))}</button>` : ""}
          ${openBtn}</div>`, "max-w-sm");
        return;
      }
      const res = st.res, g = res.game || {}, fin = res.finalStatus;
      const first = String(res.playerName || "").trim().split(/\s+/)[0] || "";
      const look = {
        Yes: ["check", "bg-[#00f59b]/20 text-[#00f59b]", t("eaIn", { name: first })],
        Waitlist: ["hourglass", "bg-sky-500/20 text-sky-300", t("eaWait", { n: g.waitPos || 1, name: first })],
        Maybe: ["help", "bg-amber-500/20 text-amber-300", t("eaMaybe", { name: first })],
        No: ["xCircle", "bg-slate-800 text-slate-300", t("eaOut", { name: first })]
      }[fin] || ["check", "bg-[#00f59b]/20 text-[#00f59b]", t("saved")];
      const confirmed = Number(g.yesCount) >= Number(g.MinThreshold);
      const segBtn = function(status, icon, label) {
        const on = fin === status || (status === "Yes" && fin === "Waitlist");
        return `<button type="button" id="ea-${status}" onclick="submitEmailAnswer('${status}')" aria-pressed="${on}" class="tap-lg rounded-2xl border font-extrabold text-sm inline-flex items-center justify-center gap-1.5 ${on ? "bg-emerald-950 text-[#00f59b] border-[#00f59b]/60" : "seg-off"}">${ic(icon, "w-4 h-4", 2.6)}${escHtml(label)}</button>`;
      };
      renderSheetModal(`
        <div class="text-center pt-1">
          <span class="w-16 h-16 mx-auto mb-3 rounded-full inline-flex items-center justify-center ${look[1]}">${ic(look[0], "w-8 h-8", 2.6)}</span>
          <h3 class="text-xl font-extrabold text-white leading-snug">${escHtml(look[2])}</h3>
          ${fin === "Waitlist" ? `<p class="text-sm text-sky-300 mt-1">${escHtml(t("eaWaitSub"))}</p>` : ""}
        </div>
        <div class="mt-4 p-3.5 rounded-2xl bg-[#0b130f] border border-emerald-950">
          <div class="text-base font-extrabold text-white">${escHtml(g.Title || "")}</div>
          <div class="text-sm text-slate-300 mt-1 flex items-center gap-1.5">${ic("calendar", "w-4 h-4 text-slate-400")}${escHtml(whenLabel({ Date: g.Date, Time: g.Time }))}</div>
          <div class="text-sm text-slate-300 flex items-center gap-1.5 min-w-0">${ic("pin", "w-4 h-4 text-slate-400")}<span class="truncate">${escHtml(g.LocationName || "")}</span></div>
          <div class="mt-2 text-sm font-bold ${confirmed ? "text-[#00f59b]" : "text-amber-300"}">${g.yesCount}/${g.MaxCap} ${escHtml(t("playersIn"))} · ${escHtml(confirmed ? t("pillOn") : t("pillNeeds", { n: Math.max(0, Number(g.MinThreshold) - Number(g.yesCount)) }))}</div>
        </div>
        <div class="mt-4 text-xs font-bold uppercase tracking-wide text-slate-400 mb-1.5">${escHtml(t("eaChange"))}</div>
        <div class="grid grid-cols-3 gap-2 mb-4">${segBtn("Yes", "check", t("rsvpIn"))}${segBtn("Maybe", "help", t("rsvpMaybe"))}${segBtn("No", "x", t("rsvpOut"))}</div>
        ${currentUser && myEmail() !== res.email ? `<p class="text-xs text-slate-400 text-center mb-2">${escHtml(t("eaSavedFor", { email: res.email }))}</p>` : ""}
        ${openBtn}
      `, "max-w-sm");
    }
    function closeEmailAnswer(showGame) {
      const a = pendingEmailAnswer;
      pendingEmailAnswer = null;
      closeModal();
      if (!showGame || !a || !currentUser) return;
      if (activeTab !== "upcoming") switchTab("upcoming");
      expandedGames[a.gameId] = true;
      renderCurrentTab();
      setTimeout(function() { const el = byId("game-" + a.gameId); if (el) try { el.scrollIntoView({ block: "start", behavior: "smooth" }); } catch (e) {} }, 60);
    }

    function emailRsvpNote(r) { return t("rsvpLinkLogin", { status: statusWord(r.status) }); }
    function applyEmailRsvpIfReady() {
      const r = pendingEmailRsvp;
      if (!r || !currentUser) return;
      pendingEmailRsvp = null;
      if (r.email && myEmail() !== r.email) {
        confirmDialog({ icon: "mail", title: t("rsvpLinkOtherTitle", { email: r.email }), body: t("rsvpLinkOtherBody", { me: currentUser.email, email: r.email }), okLabel: t("logoutBtn"),
          onOk: function() { logout(); pendingEmailRsvp = r; showLoginModal(r.email, emailRsvpNote(r)); } });
        return;
      }
      const g = findGame(r.gameId);
      if (!g) { showToast(t("rsvpLinkGone"), true); return; }
      if (activeTab !== "upcoming") switchTab("upcoming");
      expandedGames[r.gameId] = true;
      renderCurrentTab();
      setTimeout(function() {
        const el = byId("game-" + r.gameId);
        if (el) try { el.scrollIntoView({ block: "start" }); } catch (e) {}
        onRsvpTap(r.gameId, r.status);
      }, 60);
    }

    // =========================================================================
    // INVITE LINKS (?invite=…&email=…) & BOOT
    // =========================================================================
    function handleInviteLink() {
      let params;
      try { params = new URLSearchParams(location.search); } catch (e) { return; }
      const token = params.get("invite"), email = String(params.get("email") || "").toLowerCase().trim();
      if (!token || !email) return;
      if (currentUser && myEmail() === email) {
        try { history.replaceState(null, "", location.pathname); } catch (e) {}
        return;
      }
      pendingInvite = { token: token, email: email };
      if (currentUser) {
        setTimeout(function() {
          confirmDialog({ icon: "mail", title: t("inviteOtherTitle", { email: email }), body: t("inviteOtherBody", { me: currentUser.email }), okLabel: t("logoutBtn"),
            onOk: function() { logout(); showRegisterModal(); } });
        }, 300);
      }
    }

    applyThemeAndLanguageUI();
    readEmailRsvpLink();
    handleInviteLink();
    renderAuthBar();
    renderCurrentTab();
    if (pendingEmailAnswer) {
      // save the email answer first; then (if this phone is logged in) load the fresh league data
      submitEmailAnswer().then(function() { if (currentUser) { fetchWeatherForAllGamesAsync(); syncFromBackend(true); initOneSignalSdkIfConfigured(); } });
    } else if (currentUser) {
      fetchWeatherForAllGamesAsync();
      syncFromBackend(true);           // an older email answer is applied once fresh data arrives
      initOneSignalSdkIfConfigured();
    } else if (pendingInvite) {
      showRegisterModal();
    } else if (pendingEmailRsvp) {
      showLoginModal(pendingEmailRsvp.email, emailRsvpNote(pendingEmailRsvp));
    }
  </script>
</body>
</html>
