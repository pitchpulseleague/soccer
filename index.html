    .switch .thumb { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 999px; background: #ffffff; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.28); transition: transform 0.22s cubic-bezier(0.3, 0.7, 0.4, 1); }

  <script>
    // Safety net: if the page ever shows a class the pre-built block above doesn't cover
    // (for example one added to this file later), Tailwind's CDN is loaded once to fill it in.
    (function () {
      var loaded = false, known = null, seen = {}, pending = false, obs = null;
      function loadCdn() {
        if (loaded) return;
        loaded = true;
        if (obs) obs.disconnect();
        var s = document.createElement("script"); s.src = "https://cdn.tailwindcss.com"; document.head.appendChild(s);
      }
      if (document.getElementById("tw-prebuilt").textContent.length < 1000) { loadCdn(); return; }
      function learn(rules) {
        for (var i = 0; i < rules.length; i++) {
          var r = rules[i];
          if (r.selectorText) {
            var m = r.selectorText.match(/\.((?:\\.|[A-Za-z0-9_-])+)/g);
            if (m) for (var j = 0; j < m.length; j++) known[m[j].slice(1).replace(/\\(.)/g, "$1")] = 1;
          } else if (r.cssRules) learn(r.cssRules);
        }
      }
      function scan() {
        pending = false;
        if (loaded) return;
        if (!known) { known = {}; for (var i = 0; i < document.styleSheets.length; i++) { try { learn(document.styleSheets[i].cssRules); } catch (e) {} } }
        var els = document.body.querySelectorAll("[class]");
        for (var k = 0; k < els.length; k++) {
          var list = els[k].classList;
          for (var n = 0; n < list.length; n++) {
            var c = list[n];
            if (seen[c]) continue;
            seen[c] = 1;
            if (!known[c] && !/^(leaflet|onesignal)/i.test(c)) { loadCdn(); return; }
          }
        }
      }
      document.addEventListener("DOMContentLoaded", function () {
        obs = new MutationObserver(function () { if (!pending) { pending = true; setTimeout(scan, 300); } });
        obs.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class"] });
        scan();
      });
    })();
  </script>

    // =========================================================================
    // KICKOFF-HOUR WEATHER (parallel, cached 30 min)
    // =========================================================================
    async function fetchWeatherForAllGamesAsync() {
      if (!F("featWeather")) return;
      const today = getTodayIso();
      const uniqueCoords = {};
      (appData.games || []).forEach(function(g) {
        if (g.Date < today || g.Date > addDaysIso(today, 7) || g.Status === "Cancelled") return;
        const lat = g.locationDetails && g.locationDetails.lat, lng = g.locationDetails && g.locationDetails.lng;
        if (lat && lng) { const key = lat + "," + lng; if (!weatherCache[key]) uniqueCoords[key] = { lat: lat, lng: lng }; }
      });
      const keys = Object.keys(uniqueCoords);
      if (!keys.length) return;
      await Promise.all(keys.map(async function(key) {
        const c = uniqueCoords[key];
        try {
          const ctrl = new AbortController();
          const tid = setTimeout(function() { ctrl.abort(); }, 6000);
          const url = "https://api.open-meteo.com/v1/forecast?latitude=" + encodeURIComponent(c.lat) + "&longitude=" + encodeURIComponent(c.lng) +
            "&hourly=temperature_2m,precipitation_probability,weathercode,windspeed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&temperature_unit=fahrenheit&windspeed_unit=mph&timezone=auto&forecast_days=8";
          const res = await fetch(url, { signal: ctrl.signal });
          clearTimeout(tid);
          const data = await res.json();
          if (data && (data.hourly || data.daily)) weatherCache[key] = data;
        } catch (e) { weatherCache[key] = { failed: true }; }
      }));
      try { weatherCache._ts = Date.now(); sessionStorage.setItem("soccer_weather_v51", JSON.stringify(weatherCache)); } catch (e) {}
      if (activeTab === "upcoming" && !byId("modal-root").innerHTML) renderUpcomingGamesView();
    }

    function weatherInfo(game) {
      if (!F("featWeather")) return null;
      const lat = game.locationDetails && game.locationDetails.lat, lng = game.locationDetails && game.locationDetails.lng;
      if (!lat || !lng) return null;
      const w = weatherCache[lat + "," + lng];
      if (!w || w.failed) return null;
      const hourIso = String(game.Date).slice(0, 10) + "T" + String(Math.floor(parseTimeMinutes(game.Time) / 60)).padStart(2, "0") + ":00";
      const icon = function(code) { return code === 0 ? "☀️" : (code < 3 ? "⛅" : (code < 50 ? "☁️" : "🌧️")); };
      if (w.hourly && w.hourly.time) {
        const i = w.hourly.time.indexOf(hourIso);
        if (i !== -1) {
          const temp = Math.round(w.hourly.temperature_2m[i]), rain = w.hourly.precipitation_probability[i] || 0, wind = Math.round(w.hourly.windspeed_10m[i] || 0);
          return { icon: icon(w.hourly.weathercode[i]), text: temp + "°F", sub: "💧" + rain + "% · 💨" + wind + " mph", heat: temp >= 85, windy: wind >= 18 };
        }
      }
      if (w.daily && w.daily.time) {
        const j = w.daily.time.indexOf(String(game.Date).slice(0, 10));
        if (j !== -1) return { icon: icon(w.daily.weathercode[j]), text: Math.round(w.daily.temperature_2m_max[j]) + "° / " + Math.round(w.daily.temperature_2m_min[j]) + "°", sub: "" };
      }
      return null;
    }

      const noList = roster.filter(function(r) { return r.status === "No"; });
      const isCancelled = String(game.Status) === "Cancelled";
      const yesCount = Number(game.yesCount || 0), maxCap = Number(game.MaxCap || S().defaultMax), minThreshold = Number(game.MinThreshold || S().defaultMin);

        roster, myEntry, myStatus: myEntry ? myEntry.status : "", yesList, waitlist, maybeList, noList, isCancelled,
        yesCount, maxCap, minThreshold, isFull: yesCount >= maxCap, isConfirmed: !isCancelled && yesCount >= minThreshold,
        myWaitPos: myEntry && myEntry.status === "Waitlist" ? waitlist.findIndex(function(r) { return r.email === me; }) + 1 : 0,

          html += `<div class="shirt-banner mt-4 rounded-2xl p-3.5 flex items-center gap-3" style="background:${SHIRT_HEX[shirt] || "#fff"};color:${dark ? "#ffffff" : "#0f172a"}">
            ${ic("shirt", "w-6 h-6")}
            <div class="text-sm font-extrabold uppercase leading-snug">${escHtml(t("youAreOn", { team: teamLabel(m.mySide), shirt: shirtName(shirt) }))}</div></div>`;
        }
        if (game.ScheduleChangeSummary && !m.locked) {
          html += `<div class="mt-3 p-3 rounded-2xl bg-amber-500/10 border border-amber-500/40 text-sm text-amber-300 font-semibold flex gap-2">${ic("bell", "w-5 h-5 shrink-0")}<div><b>${escHtml(t("scheduleUpdate"))}</b> ${escHtml(game.ScheduleChangeSummary)}</div></div>`;
        }
        html += `<div class="mt-4">
            <div class="flex items-end justify-between gap-2 mb-1.5">
              <div class="text-base font-extrabold text-white">${m.yesCount}/${m.maxCap} <span class="text-sm font-semibold text-slate-400">${escHtml(t("playersIn"))}</span></div>
              <div class="text-sm font-bold ${m.isConfirmed ? "text-[#00f59b]" : "text-amber-300"}">${escHtml(m.isConfirmed ? t("minReached") : t("needMore", { n: need }))}</div>
            </div>
            <div class="relative h-2.5 rounded-full bg-slate-800 overflow-hidden" role="progressbar" aria-valuemin="0" aria-valuemax="${m.maxCap}" aria-valuenow="${m.yesCount}" aria-label="${escHtml(t("playersIn"))}">
              <div class="h-full rounded-full bg-[#00f59b]" style="width:${capPct}%"></div>
              <div class="absolute top-0 bottom-0 w-1 bg-amber-400" style="left:calc(${minPct}% - 2px)"></div>
            </div>
            <div class="text-xs text-slate-400 mt-1.5">${escHtml(t("capLine", { min: m.minThreshold, max: m.maxCap }))}${m.waitlist.length ? " · " + escHtml(t("waitlistN", { n: m.waitlist.length })) : ""}</div>
          </div>`;
        html += renderRsvpBlock(game, m);
      }

      if (!m.isCancelled && game.teams && (game.teams.white.length + game.teams.dark.length) > 0) html += renderTeamsPanel(game, m);
      html += renderAnnouncements(game, m);
      if (!m.isCancelled) html += renderRosterTabs(game, m);

      const cal = F("featCalendar");
      html += `<div class="mt-4 grid ${cal ? "grid-cols-2" : "grid-cols-1"} gap-2">
          <button type="button" onclick="openDirectionsSheet('${escJsArg(id)}')" class="tap-lg press rounded-2xl bg-[#111c16] border border-emerald-900/60 text-white font-bold text-sm inline-flex items-center justify-center gap-2">${ic("nav", "w-[18px] h-[18px] text-emerald-300")}${escHtml(t("directions"))}</button>
          ${cal ? `<button type="button" onclick="openCalendarShareSheet('${escJsArg(id)}')" class="tap-lg press rounded-2xl bg-[#111c16] border border-emerald-900/60 text-white font-bold text-sm inline-flex items-center justify-center gap-2">${ic("calendar", "w-[18px] h-[18px] text-emerald-300")}${escHtml(t("calShareBtn"))}</button>` : ""}
        </div>`;
      if (m.canManage) {
        html += `<button type="button" onclick="openOrganizerTools('${escJsArg(id)}')" class="tap-lg press w-full mt-2 rounded-2xl bg-amber-500/20 text-amber-300 border border-amber-500/40 font-extrabold text-base inline-flex items-center justify-center gap-2">${ic("bolt", "w-5 h-5")}<span>${escHtml(t("organizerTools"))}${m.isGameCaptain ? " · " + escHtml(t("youAreCaptain")) : ""}</span></button>`;
      }
      if (m.canManage && game.adminActivity && game.adminActivity.length) {
        html += `<details class="mt-3 text-sm text-slate-400">
          <summary class="tap flex items-center gap-2 cursor-pointer font-semibold">${ic("clock", "w-4 h-4 shrink-0")}<span class="truncate">${escHtml(t("latestAction"))}: <b>${escHtml(game.adminActivity[0].actor)}</b> — ${escHtml(game.adminActivity[0].summary)}</span></summary>
          <div class="mt-1 space-y-1.5 pl-3 border-l-2 border-emerald-900 text-[13px]">${game.adminActivity.map(function(a) { return `<div><b>${escHtml(a.actor)}:</b> ${escHtml(a.summary)} <span class="text-slate-500">(${escHtml(a.timestamp)})</span></div>`; }).join("")}</div>
        </details>`;
      }
      html += `</article>`;
      return html;
    }

    function shirtName(key) { return t("shirt_" + (key || "white")); }

    function renderRsvpBlock(game, m) {
      const id = String(game.GameID);
      if (m.isSysAdmin) {
        return `<div class="mt-4 bg-amber-500/10 p-3.5 rounded-2xl border border-amber-500/40 text-sm text-amber-300"><b>${escHtml(t("sysAdminTitle"))}</b> ${escHtml(t("sysAdminSub"))}</div>`;
      }
      if (m.locked) {
        const msg = m.lockReason === "scored" ? t("lockedScored") : t("lockedPast");
        const score = game.hasScore ? `<div class="mt-1.5 text-base font-extrabold text-white flex items-center gap-1.5">${ic("trophy", "w-5 h-5 text-amber-300")}${escHtml(teamLabel("white"))} ${escHtml(game.ScoreWhite)} – ${escHtml(game.ScoreDark)} ${escHtml(teamLabel("dark"))}</div>` : "";
        return `<div class="mt-4 bg-[#0b130f] p-3.5 rounded-2xl border border-emerald-950 text-sm text-slate-300"><div class="flex items-center gap-1.5">${ic("lock", "w-4 h-4")}${escHtml(msg)}</div>${score}
          <div class="mt-1 text-slate-400">${escHtml(t("yourAnswer"))}: <b class="text-white">${escHtml(statusWord(m.myStatus))}</b></div></div>`;
      }
      let html = `<div class="mt-4">`;
      if (m.myEntry && m.myEntry.needsReconfirm) {
        const keep = m.myStatus === "Maybe" ? "Maybe" : "Yes";
        html += `<div class="mb-3 p-3 rounded-2xl bg-amber-500/20 border border-amber-500/40 text-amber-300 text-sm">
          <b>${escHtml(t("reconfirmHint"))}</b>
          <div class="grid grid-cols-2 gap-2 mt-2">
            <button type="button" onclick="onRsvpTap('${escJsArg(id)}','${keep}')" class="tap rounded-xl neon-btn text-sm">${escHtml(keep === "Maybe" ? t("stillMaybe") : t("stillIn"))}</button>
            <button type="button" onclick="onRsvpTap('${escJsArg(id)}','No')" class="tap rounded-xl bg-rose-950 text-rose-300 font-bold text-sm">${escHtml(t("cantMakeIt"))}</button>
          </div></div>`;
      }
      if (m.kickedOff && !(m.ended && !gf(game, "scores"))) {
        html += `<div class="mb-3 p-3 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-sm text-rose-300 font-semibold flex gap-2">${ic("pulse", "w-5 h-5 shrink-0")}<span>${escHtml(gf(game, "scores") ? t("liveNotice") : t("liveNoticeOpen"))}</span></div>`;
      }
      // Waiting but a spot is free (it can happen once the match has started): offer "I'm in".
      const waitingFull = m.myStatus === "Waitlist" && m.isFull;
      const yesLabel = m.myStatus === "Yes" ? t("rsvpIn") : (waitingFull ? t("rsvpWaitPos", { n: m.myWaitPos }) : (m.isFull && m.myStatus !== "Waitlist" ? t("rsvpJoinWait") : t("rsvpIn")));
      const btn = function(status, icon, label, count, onCls) {
        const on = m.myStatus === status || (status === "Yes" && waitingFull);
        return `<button type="button" onclick="onRsvpTap('${escJsArg(id)}','${status}')" aria-pressed="${on}" class="tap-lg press rounded-2xl font-extrabold flex flex-col items-center justify-center gap-0.5 px-1 py-2 border ${on ? onCls : "seg-off"}">
          <span class="inline-flex items-center justify-center gap-1.5 text-[15px] leading-tight text-center">${ic(icon, "w-[18px] h-[18px]", 2.6)}<span>${escHtml(label)}</span></span><span class="text-xs font-semibold opacity-80">${count}</span></button>`;
      };
      html += `<div class="text-sm font-bold text-white mb-2">${escHtml(t("rsvpPrompt"))}</div>
        <div class="grid grid-cols-3 gap-2" role="group" aria-label="${escHtml(t("rsvpPrompt"))}">
          ${btn("Yes", waitingFull || (m.isFull && m.myStatus !== "Yes") ? "hourglass" : "check", yesLabel, m.yesCount + "/" + m.maxCap, m.myStatus === "Waitlist" ? "bg-sky-500 text-white border-sky-400" : "bg-[#00f59b] text-[#070b09] border-[#00f59b]")}
          ${btn("Maybe", "help", t("rsvpMaybe"), m.maybeList.length, "bg-amber-400 text-[#070b09] border-amber-400")}
          ${btn("No", "x", t("rsvpOut"), m.noList.length, "bg-rose-500 text-white border-rose-500")}
        </div>
        <p class="text-sm text-slate-300 mt-2">${escHtml(myStatusSentence(m))}</p>`;
      if (m.myStatus === "Yes" && m.myEntry) html += renderMyExtras(game, m);
      html += `</div>`;
      return html;
    }
    function statusWord(st) {
      return { Yes: t("statusYes"), Maybe: t("statusMaybe"), No: t("statusNo"), Waitlist: t("statusWaitlist") }[st] || t("statusNone");
    }
    function myStatusSentence(m) {
      if (m.myStatus === "Yes") return m.mySide ? t("sentInTeam", { team: teamLabel(m.mySide) }) : t("sentIn");
      if (m.myStatus === "Waitlist") return m.isFull ? t("sentWaitlist", { n: m.myWaitPos }) : t("spotOpenWaitlist");
      if (m.myStatus === "Maybe") return t("sentMaybe");
      if (m.myStatus === "No") return t("sentOut");
      return m.isFull ? t("sentFull") : t("sentNone");
    }

    // Guests are on unless the league sets 0 or an admin blocked them for this player.
    function myGuestsAllowed() {
      const profile = profileFor(myEmail()) || {};
      return maxGuests() > 0 && !(currentUser.canBringGuests === false || profile.canBringGuests === false);
    }
    function renderMyExtras(game, m) {
      const id = String(game.GameID), e = m.myEntry;
      const ball = gf(game, "ball"), pinnies = gf(game, "pinnies"), gk = gf(game, "gk"), arrival = gf(game, "arrival");
      const guestsAllowed = myGuestsAllowed();
      if (!ball && !pinnies && !gk && !arrival && !guestsAllowed) return "";
      const pill = function(field, on, icon, label) {
        return `<button type="button" onclick="toggleSignupExtra('${escJsArg(id)}','${field}',${!on})" aria-pressed="${on}" class="tap press px-3.5 rounded-full border font-bold text-sm inline-flex items-center gap-1.5 ${on ? "bg-emerald-950 text-[#00f59b] border-[#00f59b]/60" : "seg-off"}">${ic(on ? "check" : icon, "w-4 h-4", on ? 2.8 : 2)}${escHtml(label)}</button>`;
      };
      const guests = e.guestNames || [];
      let html = `<div class="mt-3 pt-3 border-t border-emerald-950">`;
      if (ball || pinnies || gk) {
        html += `<div class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">${escHtml(t("bringingTitle"))}</div><div class="flex flex-wrap gap-2">`;
        if (ball) html += pill("bringBall", !!e.bringBall, "ball", t("gearBall"));
        if (pinnies) html += pill("bringPinnies", !!e.bringPinnies, "vest", t("gearPinnies"));
        if (gk) html += pill("playGK", !!e.playGK, "glove", t("gearGK"));
        html += `</div>`;
      }
      if (arrival || guestsAllowed) {
        const left = arrival
          ? `${ic("clock", "w-[18px] h-[18px] text-emerald-300")}<span class="truncate">${escHtml(timingLabel(e.availabilityNote || ""))}</span>`
          : `${ic("users", "w-[18px] h-[18px] text-emerald-300")}<span class="truncate">${escHtml(guests.length ? t("guestsCount", { n: guests.length, max: maxGuests() }) : t("addGuestsBtn"))}</span>`;
        const right = arrival && guestsAllowed ? `${ic("users", "w-4 h-4")}${escHtml(t("guestsCount", { n: guests.length, max: maxGuests() }))}` : "";
        html += `<button type="button" onclick="openMyMatchSheet('${escJsArg(id)}')" class="tap-lg press w-full ${ball || pinnies || gk ? "mt-2.5" : ""} px-4 rounded-2xl bg-[#111c16] border border-emerald-900/60 flex items-center justify-between gap-3 text-left">
          <span class="text-sm font-bold text-white min-w-0 flex items-center gap-2">${left}</span>
          <span class="text-sm font-bold text-emerald-300 whitespace-nowrap inline-flex items-center gap-1">${right}${ic("chevRight", "w-4 h-4 text-slate-400", 2.4)}</span>
        </button>`;
      }
      if (guests.length) html += `<div class="text-sm text-emerald-300 mt-1.5 flex items-center gap-1.5">${ic("users", "w-4 h-4")}<span>${escHtml(guests.join(", "))}</span></div>`;
      html += `</div>`;
      return html;
    }

    function renderTeamsPanel(game, m) {
      const id = String(game.GameID);
      const me = myEmail();
      const col = function(side) {
        const list = game.teams[side] || [];
        return `<div class="bg-[#111c16] rounded-2xl border border-emerald-950 p-2.5 min-w-0">
          <div class="flex items-center gap-2 mb-2">${shirtDot(teamShirt(side))}<span class="text-sm font-extrabold text-white truncate">${escHtml(teamLabel(side))}</span><span class="text-xs text-slate-400 ml-auto">${list.length}</span></div>
          <ul class="space-y-1">${list.map(function(p) {
            const mine = p.email && p.email === me;
            return `<li class="flex items-center gap-1.5 text-[13px] rounded-lg px-1 py-0.5 ${mine ? "bg-emerald-950 font-extrabold" : ""}"><span class="truncate ${mine ? "text-[#00f59b]" : "text-slate-200"}">${escHtml(p.fullName)}</span><span class="ml-auto text-[10px] font-mono text-slate-400">${escHtml(p.isGuest ? t("guestTag") : p.position)}</span></li>`;
          }).join("") || `<li class="text-[13px] text-slate-500 italic">—</li>`}</ul></div>`;
      };
      const score = game.hasScore ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-emerald-950 text-[#00f59b] text-xs font-extrabold">${ic("trophy", "w-3.5 h-3.5")}${escHtml(game.ScoreWhite)} – ${escHtml(game.ScoreDark)}</span>` : "";
      return `<section class="mt-4">
        <div class="flex items-center justify-between gap-2 mb-2">
          <h3 class="text-sm font-extrabold uppercase tracking-wide text-[#00f59b] inline-flex items-center gap-1.5">${ic("shirt", "w-4 h-4")}${escHtml(t("teamsTitle"))}</h3>
          <div class="flex items-center gap-2">${score}<button type="button" onclick="togglePitch('${escJsArg(id)}')" class="tap px-3 rounded-xl bg-[#111c16] border border-emerald-900/60 text-xs font-bold text-emerald-300 inline-flex items-center gap-1.5">${ic("field", "w-4 h-4")}${escHtml(openPitchByGame[id] ? t("hidePitch") : t("pitchView"))}</button></div>
        </div>
        ${openPitchByGame[id] ? render2dPitch(game) : `<div class="grid grid-cols-2 gap-2">${col("white")}${col("dark")}</div>`}
        ${m.canManage && game.teamsStale ? `<div class="mt-2 text-xs font-semibold text-amber-300">${escHtml(t("teamsChangedHint"))}</div>` : ""}
      </section>`;
    }
    function togglePitch(id) { openPitchByGame[id] = !openPitchByGame[id]; renderCurrentTab(); }
    function render2dPitch(game) {
      const pills = function(list) {
        return list.map(function(p) {
          return `<span class="pitch-player-label inline-flex items-center gap-1 px-2 py-1 rounded-full bg-black/55 border border-white/30 text-white text-xs font-bold">${escHtml(p.fullName)}<span class="text-[9px] opacity-80 font-mono">${escHtml(p.isGuest ? t("guestTag") : p.position)}</span></span>`;
        }).join("");
      };
      return `<div class="soccer-pitch-bg rounded-2xl p-4 text-white">
        <div class="relative z-10 text-center">
          <div class="text-xs uppercase tracking-widest font-extrabold mb-2 flex items-center justify-center gap-1.5">${shirtDot(teamShirt("white"))} ${escHtml(teamLabel("white"))}</div>
          <div class="flex flex-wrap justify-center gap-1.5 mb-6">${pills(game.teams.white)}</div>
          <div class="flex flex-wrap justify-center gap-1.5 mt-6">${pills(game.teams.dark)}</div>
          <div class="text-xs uppercase tracking-widest font-extrabold mt-2 flex items-center justify-center gap-1.5">${shirtDot(teamShirt("dark"))} ${escHtml(teamLabel("dark"))}</div>
        </div></div>`;
    }

    function renderAnnouncements(game, m) {
      if (!gf(game, "announcements")) return "";
      const isAdmin = !!(currentUser && currentUser.isAdmin);
      const list = (game.blasts || []).filter(function(b) { return isAdmin || !b.hidden; }).slice().reverse();
      if (!list.length) return "";
      const item = function(b) {
        return `<div class="p-3 rounded-2xl border ${b.hidden ? "border-amber-500/40 bg-amber-500/10" : "border-emerald-950 bg-[#111c16]"}">
          <div class="flex items-center justify-between gap-2 mb-1">
            <span class="text-sm font-bold text-white truncate">${escHtml(b.senderName)} <span class="text-xs font-normal text-slate-400">· ${escHtml(b.timestamp || "")}</span></span>
            ${isAdmin ? `<button type="button" onclick="toggleBlastVisibility('${escJsArg(b.blastId)}', ${!b.hidden})" class="tap px-3 rounded-xl bg-slate-800 text-xs font-bold text-slate-200 shrink-0">${escHtml(b.hidden ? t("show") : t("hide"))}</button>` : ""}
          </div>
          <div class="text-sm text-slate-200 whitespace-pre-wrap leading-relaxed">${escHtml(b.message)}</div></div>`;
      };
      return `<section class="mt-4">
        <h3 class="text-sm font-extrabold uppercase tracking-wide text-[#00f59b] mb-2 inline-flex items-center gap-1.5">${ic("megaphone", "w-4 h-4")}${escHtml(t("announcements"))}</h3>
        <div class="space-y-2">${item(list[0])}</div>
        ${list.length > 1 ? `<details class="mt-2"><summary class="tap flex items-center text-sm font-bold text-emerald-300 cursor-pointer">${escHtml(t("showOlder", { n: list.length - 1 }))}</summary><div class="space-y-2 mt-1">${list.slice(1).map(item).join("")}</div></details>` : ""}
      </section>`;
    }

    // Player cards open when there's something to show: standings, or an admin looking.
    function playerCardsOpen() { return standingsOn() || !!(currentUser && currentUser.isAdmin); }
    function setRosterSubTab(gameId, sub) { triggerHaptic(); rosterSubTabByGame[gameId] = sub; renderCurrentTab(); }
    function renderRosterTabs(game, m) {
      const id = String(game.GameID);
      const active = rosterSubTabByGame[id] || "yes";
      const teamsOn = gf(game, "teams"), arrival = gf(game, "arrival");
      const fBall = gf(game, "ball"), fPin = gf(game, "pinnies"), fGk = gf(game, "gk");
      const cards = playerCardsOpen();
      // the waitlist tab only appears when someone is actually waiting
      const showWait = m.waitlist.length > 0 || active === "waitlist";
      const tab = function(key, icon, label, n, onCls) {
        const on = active === key;
        return `<button type="button" role="tab" onclick="setRosterSubTab('${escJsArg(id)}','${key}')" aria-selected="${on}" class="tap-lg press min-w-0 px-1 rounded-xl border flex flex-col items-center justify-center leading-tight ${on ? onCls : "seg-off"}">
          <span class="inline-flex items-center gap-1 text-base font-extrabold">${ic(icon, "w-4 h-4", 2.6)}${n}</span><span class="block max-w-full truncate text-[11px] font-bold uppercase tracking-wide">${escHtml(label)}</span></button>`;
      };
      const row = function(r, i) {
        const pos = r.playPosition || effectivePos(r.position, r.playGK, game);
        const gear = (fBall && r.bringBall ? ic("ball", "w-3.5 h-3.5 text-emerald-300") : "") + (fPin && r.bringPinnies ? ic("vest", "w-3.5 h-3.5 text-emerald-300") : "") + (fGk && r.playGK ? ic("glove", "w-3.5 h-3.5 text-amber-300") : "");
        const inner = `${renderAvatarBadge(r.fullName, teamsOn ? pos : "")}
          <span class="min-w-0 flex-1"><span class="flex items-center gap-1 text-sm font-bold text-white min-w-0"><span class="truncate">${i !== undefined ? (i + 1) + ". " : ""}${escHtml(r.fullName)}</span>${teamsOn ? ` <span class="text-[11px] font-mono text-slate-400 shrink-0">${escHtml(pos)}</span>` : ""}${gear ? `<span class="inline-flex gap-0.5 shrink-0">${gear}</span>` : ""}</span>
          ${r.guestNames && r.guestNames.length ? `<span class="block text-xs text-emerald-300 truncate">+${r.guestNames.length}: ${escHtml(r.guestNames.join(", "))}</span>` : ""}
          ${arrival && r.availabilityNote ? `<span class="block text-xs text-amber-300 truncate">${escHtml(timingLabel(r.availabilityNote))}</span>` : ""}</span>`;
        return cards
          ? `<button type="button" onclick="openPlayerCareerModal('${escJsArg(r.email)}')" class="tap w-full text-left p-2 rounded-xl bg-[#111c16] border border-emerald-950 flex items-center gap-2.5">${inner}</button>`
          : `<div class="w-full p-2 min-h-[44px] rounded-xl bg-[#111c16] border border-emerald-950 flex items-center gap-2.5">${inner}</div>`;
      };
      let body = "";
      if (active === "yes") body = m.yesList.length ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">${m.yesList.map(row).join("")}</div>` : `<p class="text-sm text-slate-500 italic">${escHtml(t("noneYet"))}</p>`;
      else if (active === "waitlist") body = m.waitlist.length ? `<div class="space-y-1.5">${m.waitlist.map(row).join("")}</div><p class="text-xs text-sky-300 mt-2">${escHtml(t("waitlistHint"))}</p>` : `<p class="text-sm text-slate-500 italic">${escHtml(t("noneWord"))}</p>`;
      else if (active === "maybe") body = m.maybeList.length ? `<div class="space-y-1.5">${m.maybeList.map(function(r) { return row(r); }).join("")}</div>` : `<p class="text-sm text-slate-500 italic">${escHtml(t("noneWord"))}</p>`;
      else body = m.noList.length ? `<div class="space-y-1.5">${m.noList.map(function(r) { return row(r); }).join("")}</div>` : `<p class="text-sm text-slate-500 italic">${escHtml(t("noneWord"))}</p>`;
      return `<section class="mt-4">
        <div class="grid ${showWait ? "grid-cols-4" : "grid-cols-3"} gap-1.5 mb-2" role="tablist" aria-label="${escHtml(t("rosterTitle"))}">
          ${tab("yes", "check", t("tabYes"), m.yesCount, "bg-[#00f59b] text-[#070b09] border-[#00f59b]")}
          ${showWait ? tab("waitlist", "hourglass", t("tabWaitlist"), m.waitlist.length, "bg-sky-500 text-white border-sky-500") : ""}
          ${tab("maybe", "help", t("tabMaybe"), m.maybeList.length, "bg-amber-400 text-[#070b09] border-amber-400")}
          ${tab("no", "x", t("tabNo"), m.noList.length, "bg-rose-500 text-white border-rose-500")}
        </div>${body}</section>`;
    }

    // =========================================================================
    // MAPS (Leaflet is loaded only when someone actually opens a map)
    // =========================================================================
    let leafletPromise = null;
    let liveMaps = [];
    function loadLeaflet() {
      if (window.L) return Promise.resolve(window.L);
      if (leafletPromise) return leafletPromise;
      leafletPromise = new Promise(function(resolve, reject) {
        const css = document.createElement("link");
        css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";

    // Street map or satellite photo (Esri World Imagery, with place names on top). The choice is
    // remembered on this phone: players start on the street map, the admin field picker on satellite.
    const MAP_STYLE_DEFAULTS = { directions: "map", picker: "satellite" };
    function mapStylePref(kind) {
      const v = lsGet("soccer_map_style_" + kind, MAP_STYLE_DEFAULTS[kind] || "map");
      return v === "satellite" ? "satellite" : "map";
    }
    function addMapStyleSwitch(L, map, kind) {
      const layers = {
        map: L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }),
        satellite: L.layerGroup([
          L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics" }),
          L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 })
        ])
      };
      let current = mapStylePref(kind);
      layers[current].addTo(map);
      const Switch = L.Control.extend({
        options: { position: "topright" },
        onAdd: function() {
          const box = L.DomUtil.create("div", "map-style-switch");
          box.setAttribute("role", "group");
          box.setAttribute("aria-label", t("mapStyleLabel"));
          box.innerHTML = ["map", "satellite"].map(function(k) {
            return `<button type="button" data-style="${k}" aria-pressed="${k === current}">${escHtml(k === "map" ? t("mapStyleMap") : t("mapStyleSatellite"))}</button>`;
          }).join("");
          // Taps on the switch must never reach the map: on the field picker a map tap moves the pin.
          // (The buttons stay in place and only their pressed state changes, so Leaflet can always
          // tell the tap started on a control.)
          L.DomEvent.disableClickPropagation(box);
          L.DomEvent.disableScrollPropagation(box);
          L.DomEvent.on(box, "click", function(e) {
            L.DomEvent.stop(e);
            const b = e.target && e.target.closest ? e.target.closest("button[data-style]") : null;
            if (!b) return;
            const next = b.getAttribute("data-style");
            if (next === current) return;
            map.removeLayer(layers[current]);
            layers[next].addTo(map);
            current = next;
            lsSet("soccer_map_style_" + kind, next);
            triggerHaptic();
            box.querySelectorAll("button[data-style]").forEach(function(x) { x.setAttribute("aria-pressed", String(x.getAttribute("data-style") === current)); });
          });
          return box;
        }
      });
      new Switch().addTo(map);
    }

    async function saveMyMatchSheet(gameId) {
      const g = findGame(gameId); if (!g) return;
      const m = gameMeta(g);
      const checked = document.querySelector('input[name="mm-timing"]:checked');
      const noteEditable = !!document.querySelector('input[name="mm-timing"]');
      const newNote = checked ? checked.value : "";
      const maxG = maxGuests();
      const inputs = Array.from({ length: maxG }).map(function(_, i) { const el = byId("mm-guest-" + i); return el ? el.value.replace(/,/g, " ").trim() : null; });
      const guestsEditable = inputs.some(function(v) { return v !== null; });
      const newGuests = inputs.filter(Boolean);
      const oldGuests = (m.myEntry && m.myEntry.guestNames) || [];
      const noteChanged = noteEditable && newNote !== ((m.myEntry && m.myEntry.availabilityNote) || "");
      const guestsChanged = guestsEditable && JSON.stringify(newGuests) !== JSON.stringify(oldGuests);
      if (!noteChanged && !guestsChanged) { closeModal(); return; }
      await runAction("mm-" + gameId, async function() {
        setBusyButton("mm-save", true);
        let last = null;
        if (guestsChanged) {
          last = await apiPost({ action: "updateSignupExtras", gameId: gameId, field: "guestNames", value: newGuests });
          if (!last || !last.success) { setBusyButton("mm-save", false); if (last && last.error) showToast(last.error, true); return; }
          setAppData(last);
        }
        if (noteChanged) {
          last = await apiPost({ action: "updateSignupExtras", gameId: gameId, field: "availabilityNote", value: newNote });
          if (!last || !last.success) { setBusyButton("mm-save", false); if (last && last.error) showToast(last.error, true); return; }
          setAppData(last);
        }
        closeModal(); showToast((last && last.message) || t("saved")); renderCurrentTab();
      });
    }

    function calTimes(game) {
      const start = gameStartDate(game);
      const end = new Date(start.getTime() + 75 * 60000);
      const fmt = function(d) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") + "T" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0") + "00"; };
      return { start: fmt(start), end: fmt(end) };
    }
    function buildGoogleCalendarUrl(game) {
      const c = calTimes(game);
      const addr = (game.locationDetails && game.locationDetails.address) || game.LocationName;
      return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent("⚽ " + game.Title) +
        "&dates=" + c.start + "/" + c.end + "&location=" + encodeURIComponent(game.LocationName + " - " + addr) + "&details=" + encodeURIComponent(t("calDetails") + " " + SITE_URL);
    }
    function downloadIcsCalendar(gameId) {
      const game = findGame(gameId); if (!game) return;
      const c = calTimes(game);
      const addr = (game.locationDetails && game.locationDetails.address) || game.LocationName;
      const esc = function(s) { return String(s).replace(/([,;\\])/g, "\\$1"); };
      const now = new Date();
      const stamp = now.getUTCFullYear() + String(now.getUTCMonth() + 1).padStart(2, "0") + String(now.getUTCDate()).padStart(2, "0") + "T" + String(now.getUTCHours()).padStart(2, "0") + String(now.getUTCMinutes()).padStart(2, "0") + "00Z";
      const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Pitch Pulse League//Soccer Hub//EN", "BEGIN:VEVENT",
        "UID:" + game.GameID + "@pitchpulseleague.github.io", "DTSTAMP:" + stamp, "DTSTART:" + c.start, "DTEND:" + c.end,
        "SUMMARY:" + esc("⚽ " + game.Title), "LOCATION:" + esc(game.LocationName + " (" + addr + ")"), "DESCRIPTION:" + esc(t("calDetails") + " " + SITE_URL),
        "END:VEVENT", "END:VCALENDAR"].join("\r\n");
      const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar;charset=utf-8" }));
      const a = document.createElement("a"); a.href = url; a.download = "pitch-pulse-" + game.Date + ".ics";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
    }

          <div class="flex items-center gap-2 mb-1.5">${shirtDot(teamShirt(side))}<span class="text-sm font-extrabold text-white truncate">${escHtml(teamLabel(side))}</span><span class="text-xs text-slate-400 ml-auto">${g.teams[side].length}</span></div>
          <div class="space-y-1.5">${g.teams[side].map(function(p) {

          <button type="button" id="tm-defaults" onclick="generateTeams('${id}','defaults')" class="tap-lg rounded-2xl bg-[#111c16] border border-emerald-900/60 text-white font-bold text-base inline-flex items-center justify-center gap-2">${ic("home", "w-5 h-5 text-emerald-300")}${escHtml(t("useDefaults"))}</button>

        </div>
        ${has ? `<p class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">${escHtml(t("tapToMove"))}</p><div class="grid grid-cols-2 gap-2">${list("white")}${list("dark")}</div>` : `<p class="text-sm text-slate-400">${escHtml(t("noLineupYet"))}</p>`}
        <button type="button" onclick="closeModal()" class="tap-lg w-full mt-4 rounded-2xl bg-slate-800 text-slate-200 font-bold text-base">${escHtml(t("doneBtn"))}</button>
      `, "max-w-lg");

    function generateTeams(gameId, strategy) {
      const g = findGame(gameId); if (!g) return;

      };
      if (g.hasScore) {
        confirmDialog({ icon: "trophy", title: t("rebalanceScoredTitle"), body: t("rebalanceScoredBody"), okLabel: t("continueBtn"), onOk: go });
      } else go();
    }
    function moveTeamPlayer(gameId, key, toSide) {
      triggerHaptic();
      mutate("move-" + gameId, { action: "adminMoveTeamPlayer", gameId: gameId, key: key, toSide: toSide }, { closeSheet: false, after: function() { openTeamsSheet(gameId); } });
    }

    // ---- Attendance sheet ----------------------------------------------------
    function openAttendanceSheet(gameId) {
      const g = findGame(gameId); if (!g) return;
      const id = escJsArg(gameId);
      const yes = (g.roster || []).filter(function(r) { return r.status === "Yes"; });
      const yesEmails = yes.map(function(r) { return r.email; });
      const others = Object.keys(appData.profiles || {}).map(function(k) { return Object.assign({ key: k }, appData.profiles[k]); }).filter(function(p) {
        return !p.isSystemAdminOnly && String(p.status).toLowerCase() !== "suspended" && yesEmails.indexOf(p.key) === -1 && yesEmails.indexOf(p.email) === -1;
      }).sort(function(a, b) { return String(a.fullName).localeCompare(String(b.fullName)); });
      renderSheetModal(`
        ${sheetHeader(escHtml(t("toolAttendance")), escHtml(g.Title) + " · " + escHtml(fmtDate(g.Date)), "clipboard")}

        <div class="flex gap-2 mb-1">
          <select id="walkin-select" class="tap flex-1 min-w-0 px-3 rounded-2xl bg-[#0b130f] border border-emerald-900 text-base text-white">
            <option value="">${escHtml(t("pickPlayer"))}</option>

        <div class="space-y-1.5">${yes.map(function(r) {
          return `<div class="flex items-center gap-2.5 p-2 rounded-2xl bg-[#0b130f] border border-emerald-950">
            ${renderAvatarBadge(r.fullName, gf(g, "teams") ? r.position : "")}<span class="min-w-0 flex-1 text-sm font-bold text-white truncate">${escHtml(r.fullName)}${r.guestNames && r.guestNames.length ? ` <span class="text-xs text-emerald-300">+${r.guestNames.length}</span>` : ""}</span>
            <button type="button" onclick="confirmNoShow('${id}','${escJsArg(r.email)}','${escJsArg(r.fullName)}')" class="tap px-3.5 rounded-xl bg-rose-950 text-rose-300 text-sm font-bold">${escHtml(t("noShowBtn"))}</button></div>`;

    function confirmNoShow(gameId, email, name) {
      confirmDialog({ icon: "xCircle", danger: true, title: t("noShowConfirm", { name: name }), body: t("noShowBody"), okLabel: t("noShowBtn"),

    function submitAttendanceChange(gameId, targetEmail, newStatus, btnId) {
      if (!targetEmail) { showToast(t("pickPlayer"), true); return; }
      mutate("att-" + gameId, { action: "adminUpdateAttendance", gameId: gameId, targetEmail: targetEmail, newStatus: newStatus }, { button: btnId, closeSheet: false, after: function() { openAttendanceSheet(gameId); } });
    }

    // ---- Score sheet ---------------------------------------------------------
    function openScoreSheet(gameId) {
      const g = findGame(gameId); if (!g) return;
      const id = escJsArg(gameId);
      const sw = g.ScoreWhite !== "" ? Number(g.ScoreWhite) : 0, sd = g.ScoreDark !== "" ? Number(g.ScoreDark) : 0;
      const stepper = function(side, val) {
        return `<div class="flex-1 min-w-0 text-center">
          <div class="flex items-center justify-center gap-1.5 mb-2">${shirtDot(teamShirt(side))}<span class="text-sm font-extrabold text-white truncate">${escHtml(teamLabel(side))}</span></div>
          <div class="flex items-center justify-center gap-2">
            <button type="button" onclick="bumpScore('${side}',-1)" class="tap-lg w-12 rounded-2xl bg-slate-800 text-slate-200 inline-flex items-center justify-center" aria-label="−1">${ic("minus", "w-5 h-5", 2.8)}</button>
            <input id="sc-${side}" type="number" inputmode="numeric" min="0" max="99" value="${val}" class="tap-lg w-16 rounded-2xl bg-[#0b130f] border border-emerald-900 text-center text-2xl font-extrabold text-white" aria-label="${escHtml(teamLabel(side))}">
            <button type="button" onclick="bumpScore('${side}',1)" class="tap-lg w-12 rounded-2xl bg-slate-800 text-slate-200 inline-flex items-center justify-center" aria-label="+1">${ic("plus", "w-5 h-5", 2.8)}</button>
          </div></div>`;
      };
      renderSheetModal(`
        ${sheetHeader(escHtml(t("toolScore")), escHtml(g.Title) + " · " + escHtml(fmtDate(g.Date)), "trophy")}
        <div class="flex items-start gap-3 mb-4">${stepper("white", sw)}<div class="pt-10 text-xl font-extrabold text-slate-400">–</div>${stepper("dark", sd)}</div>
        ${!g.teams ? `<p class="text-xs text-amber-300 mb-3">${escHtml(t("scoreNoLineup"))}</p>` : ""}
        <p class="text-xs text-slate-400 mb-3">${escHtml(t("scoreLocksRsvp"))}</p>
        <button type="button" id="sc-save" onclick="submitFinalScore('${id}')" class="tap-lg w-full rounded-2xl neon-btn text-base">${escHtml(t("saveScoreBtn"))}</button>
        ${g.hasScore ? `<button type="button" id="sc-clear" onclick="mutate('score-${id}', {action:'adminSaveScore', gameId:'${id}', clear:true}, {button:'sc-clear'})" class="tap-lg w-full mt-2 rounded-2xl bg-slate-800 text-slate-200 font-bold text-sm">${escHtml(t("clearScoreBtn"))}</button>` : ""}
      `, "max-w-sm");
    }
    function bumpScore(side, d) {
      const el = byId("sc-" + side); if (!el) return;
      el.value = Math.max(0, Math.min(99, (parseInt(el.value, 10) || 0) + d));
      triggerHaptic();
    }
    function submitFinalScore(gameId) {
      const a = parseInt(byId("sc-white").value, 10), b = parseInt(byId("sc-dark").value, 10);
      if (isNaN(a) || isNaN(b) || a < 0 || b < 0) { showToast(t("errScoreValue"), true); return; }
      mutate("score-" + gameId, { action: "adminSaveScore", gameId: gameId, scoreWhite: a, scoreDark: b }, { button: "sc-save" });
    }

    // ---- Announcement sheet --------------------------------------------------
    function openBlastSheet(gameId) {
      const g = findGame(gameId); if (!g) return;
      const n = (g.roster || []).filter(function(r) { return r.status === "Yes" || r.status === "Maybe" || r.status === "Waitlist"; }).length;
      renderSheetModal(`
        ${sheetHeader(escHtml(t("toolBlast")), escHtml(t("blastWillNotify", { n: n })), "megaphone")}
        <textarea id="blast-msg-input" rows="5" maxlength="1000" placeholder="${escHtml(t("blastPh"))}" class="w-full mb-3 p-3.5 rounded-2xl bg-[#0b130f] border border-emerald-900 text-base text-white"></textarea>
        <label class="tap-lg flex items-start gap-3 px-3.5 py-3 mb-3 rounded-2xl bg-[#0b130f] border border-emerald-950 cursor-pointer">
          <input id="blast-email" type="checkbox" class="mt-0.5 w-5 h-5 accent-[#00f59b] shrink-0">
          <span class="min-w-0"><span class="block text-sm font-bold text-white">${escHtml(t("alsoEmail"))}</span><span class="block text-xs text-slate-400 mt-0.5">${escHtml(t("alsoEmailHelp"))}</span></span>
        </label>
        <button type="button" id="blast-send" onclick="submitBlast('${escJsArg(gameId)}')" class="tap-lg w-full rounded-2xl neon-btn text-base">${escHtml(t("sendBtn"))}</button>
      `);
    }
    function submitBlast(gameId) {
      const msg = byId("blast-msg-input").value.trim();
      if (!msg) { showToast(t("errBlastEmpty"), true); return; }
      mutate("blast-" + gameId, { action: "adminSendGameBlast", gameId: gameId, message: msg, alsoEmail: !!(byId("blast-email") && byId("blast-email").checked) }, { button: "blast-send" });
    }
    function toggleBlastVisibility(blastId, hideFlag) {
      mutate("blastvis-" + blastId, { action: "adminToggleBlastVisibility", blastId: blastId, hidden: hideFlag });
    }

    // =========================================================================
    // STANDINGS, RIVALRY & MATCH HISTORY (only while Scores & standings is on)
    // =========================================================================
    function reliabilityOn() { return F("featAttendance") || F("featLateDrops"); }
    function renderHistoryAndDirectoryView() {
      const container = byId("view-container");
      const profilesList = Object.keys(appData.profiles || {}).map(function(k) { return Object.assign({ key: k }, appData.profiles[k]); })
        .filter(function(p) { return !p.isSystemAdminOnly && String(p.status).toLowerCase() !== "suspended"; });
      profilesList.sort(function(a, b) { return (b.points || 0) - (a.points || 0) || (b.wins || 0) - (a.wins || 0) || (b.gamesPlayed || 0) - (a.gamesPlayed || 0) || String(a.fullName).localeCompare(String(b.fullName)); });
      const completed = (appData.games || []).filter(function(g) { return !!g.hasStartedOrPassed && g.Status !== "Cancelled"; }).slice().reverse();

          <div class="text-3xl font-extrabold text-white mt-1 leading-none">${wins}</div>
          <div class="text-[11px] font-bold uppercase tracking-wide text-emerald-300 mt-1">${escHtml(t("winsWord"))}</div>
          <div class="text-xs text-slate-400">${escHtml(t("goalsN", { g: goals }))}</div></div>`;
      };
      let html = `<div class="space-y-3.5">
        <section class="glass-card rounded-[28px] p-4 sm:p-5">
          <h2 class="text-sm font-extrabold uppercase tracking-wide text-[#00f59b] inline-flex items-center gap-1.5">${ic("trophy", "w-4 h-4")}${escHtml(t("rivalryTitle"))}</h2>
          <p class="text-xs font-bold text-slate-400 mb-3">${escHtml(t("matchesScored", { n: riv.totalMatchesScored || 0 }))}</p>
          <div class="bg-[#0b130f] p-3 rounded-2xl border border-emerald-950 grid grid-cols-3 gap-2 items-start">
            ${side("white", riv.whiteWins || 0, riv.whiteGoals || 0)}
            <div class="text-center">
              <div class="text-sm font-bold text-amber-300">${escHtml(capFirst(t("drawsWord")))}</div>
              <div class="text-3xl font-extrabold text-amber-300 mt-1 leading-none">${riv.draws || 0}</div>
            </div>
            ${side("dark", riv.darkWins || 0, riv.darkGoals || 0)}
          </div>
        </section>

        <section class="glass-card rounded-[28px] p-4 sm:p-5">
          <h2 class="text-lg font-extrabold text-white mb-0.5">${escHtml(t("standingsTitle"))}</h2>
          <p class="text-sm text-slate-400 mb-3">${escHtml(t("standingsSub"))}</p>
          <ol class="space-y-1.5">${profilesList.map(function(p, i) {
            const wdl = t("wdl", { w: p.wins || 0, d: p.draws || 0, l: p.losses || 0 });
            const mine = p.key === me;
            return `<li><button type="button" onclick="openPlayerCareerModal('${escJsArg(p.key)}')" class="tap-lg w-full text-left px-3 py-2 rounded-2xl border flex items-center gap-3 ${mine ? "bg-emerald-950 border-[#00f59b]/40" : "bg-[#0b130f] border-emerald-950"}">
              <span class="w-7 text-center text-sm font-extrabold ${i < 3 ? "text-amber-300" : "text-slate-400"}">${i + 1}</span>
              ${renderAvatarBadge(p.fullName, p.position)}
              <span class="min-w-0 flex-1"><span class="block text-sm font-bold text-white truncate">${escHtml(p.fullName)}</span>
              <span class="block text-xs text-slate-400">${escHtml(wdl)} · ${escHtml(t("gpN", { n: p.gamesPlayed || 0 }))}${rel ? " · " + (p.reliability !== undefined ? p.reliability : 100) + "%" : ""}${F("featMotm") && p.motmCount ? " · ★" + p.motmCount : ""}</span></span>
              <span class="text-right shrink-0"><span class="block text-lg font-extrabold text-[#00f59b] leading-none">${p.points || 0}</span><span class="block text-[10px] font-bold text-slate-400 uppercase">${escHtml(t("ptsShort"))}</span></span>
            </button></li>`;
          }).join("")}</ol>
        </section>

        <section class="glass-card rounded-[28px] p-4 sm:p-5">
          <h2 class="text-lg font-extrabold text-white mb-3">${escHtml(t("historyTitle"))}</h2>
          ${(function() {
            const shown = (appData.games || []).filter(function(g) { return g.Date < getTodayIso(); }).length;
            const total = Number(appData.pastMatchesTotal || 0);
            return total > shown ? `<p class="text-xs text-slate-400 -mt-2 mb-3">${escHtml(t("historyNote", { n: shown, total: total }))}</p>` : "";
          })()}
          ${completed.length === 0 ? `<p class="text-sm text-slate-500 italic">${escHtml(t("noHistory"))}</p>` : ""}
          <div class="space-y-2.5">${completed.map(function(g) { return renderHistoryItem(g); }).join("")}</div>
        </section>
      </div>`;
      container.innerHTML = html;
    }

    function renderHistoryItem(g) {
      const id = escJsArg(g.GameID);
      const me = myEmail();
      const yes = (g.roster || []).filter(function(r) { return r.status === "Yes"; });
      const myEntry = (g.roster || []).find(function(r) { return r.email === me; });
      const canManage = !!(currentUser && (currentUser.isAdmin || (gf(g, "captains") && g.captainEmail && g.captainEmail === me)));
      const candidates = yes.filter(function(p) { return p.email !== me; });
      const att = gf(g, "attendance"), scores = gf(g, "scores");
      const tools = [];
      if (canManage && att) tools.push(`<button type="button" onclick="openAttendanceSheet('${id}')" class="tap rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/40 text-sm font-bold inline-flex items-center justify-center gap-1.5">${ic("clipboard", "w-4 h-4")}${escHtml(t("toolAttendance"))}</button>`);
      if (canManage && scores) tools.push(`<button type="button" onclick="openScoreSheet('${id}')" class="tap rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/40 text-sm font-bold inline-flex items-center justify-center gap-1.5">${ic("trophy", "w-4 h-4")}${escHtml(g.hasScore ? t("toolScoreEdit") : t("toolScore"))}</button>`);
      return `<div class="bg-[#0b130f] p-3.5 rounded-2xl border border-emerald-950">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <div class="text-sm font-extrabold text-white truncate">${escHtml(g.Title)}</div>
            <div class="text-xs text-slate-400">${escHtml(fmtDate(g.Date))} · ${escHtml(fmtTime(g.Time))} · ${escHtml(t("nPlayed", { n: g.yesCount || yes.length }))}</div>
          </div>
          ${g.hasScore ? `<div class="shrink-0 text-right"><div class="text-base font-extrabold text-white whitespace-nowrap">${escHtml(g.ScoreWhite)} – ${escHtml(g.ScoreDark)}</div><div class="text-[11px] text-slate-400 whitespace-nowrap">${escHtml(teamLabel("white"))} · ${escHtml(teamLabel("dark"))}</div></div>` : (scores ? `<span class="shrink-0 text-xs font-bold text-slate-400">${escHtml(t("noScore"))}</span>` : "")}
        </div>
        <details class="mt-1.5"><summary class="tap flex items-center text-sm font-semibold text-emerald-300 cursor-pointer">${escHtml(t("whoPlayed"))}</summary>
          <p class="text-sm text-slate-300 pb-1">${escHtml(yes.map(function(r) { return r.fullName; }).join(", ")) || escHtml(t("noneWord"))}</p></details>
        ${gf(g, "motm") && g.motmWinnerName ? `<div class="mt-1 text-sm font-bold text-amber-300 flex items-center gap-1.5">${ic("star", "w-4 h-4")}${escHtml(t("motmIs", { name: g.motmWinnerName, n: g.motmWinnerVotes }))}</div>` : ""}
        ${gf(g, "motm") && myEntry && myEntry.status === "Yes" && candidates.length && !(currentUser && isSystemAdminOnly(currentUser.email)) ? `
          <label class="block mt-2"><span class="text-xs font-bold uppercase tracking-wide text-slate-400">${escHtml(t("voteMotm"))}</span>
            <select onchange="submitMotmVote('${id}', this.value)" class="tap mt-1 w-full px-3 rounded-2xl bg-[#111c16] border border-emerald-900 text-base text-white">
              <option value="">${escHtml(t("pickPlayer"))}</option>
              ${candidates.map(function(p) { return `<option value="${escHtml(p.email)}" ${myEntry.motmVote === p.email ? "selected" : ""}>${escHtml(p.fullName)}</option>`; }).join("")}
            </select></label>` : ""}
        ${tools.length ? `<div class="grid ${tools.length > 1 ? "grid-cols-2" : "grid-cols-1"} gap-2 mt-2.5">${tools.join("")}</div>` : ""}

    function submitMotmVote(gameId, nomineeEmail) {
      if (!nomineeEmail) return;
      mutate("motm-" + gameId, { action: "voteMotm", gameId: gameId, nomineeEmail: nomineeEmail });
    }

    function openPlayerCareerModal(key) {
      const k = String(key || "").trim();
      const prof = profileFor(k);
      if (!prof) return;
      const em = appData.profiles[k] ? k : k.toLowerCase();
      triggerHaptic();
      const isAdmin = !!(currentUser && currentUser.isAdmin);
      const scores = F("featScores"), teams = F("featTeams");
      const completed = (appData.games || []).filter(function(g) {
        return !!g.hasStartedOrPassed && g.Status !== "Cancelled" && (g.roster || []).some(function(r) { return r.email === em && r.status === "Yes"; });
      }).slice().reverse();
      const pills = completed.slice(0, 5).map(function(g) {
        if (!g.hasScore || !g.teams) return `<span class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 text-xs font-extrabold">✓</span>`;
        const sw = Number(g.ScoreWhite), sd = Number(g.ScoreDark);
        const onW = (g.teams.white || []).some(function(p) { return p.email === em; }), onD = (g.teams.dark || []).some(function(p) { return p.email === em; });
        if (!onW && !onD) return `<span class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 text-xs font-extrabold">✓</span>`;
        if (sw === sd) return `<span class="px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300 text-xs font-extrabold">${escHtml(t("formD"))}</span>`;
        const won = (onW && sw > sd) || (onD && sd > sw);
        return won ? `<span class="px-2.5 py-1 rounded-lg bg-emerald-950 text-[#00f59b] text-xs font-extrabold">${escHtml(t("formW"))}</span>` : `<span class="px-2.5 py-1 rounded-lg bg-rose-950 text-rose-300 text-xs font-extrabold">${escHtml(t("formL"))}</span>`;
      }).join("");
      const scored = (prof.wins || 0) + (prof.draws || 0) + (prof.losses || 0);
      const winRate = scored > 0 ? Math.round(((prof.wins || 0) / scored) * 100) : 0;
      const stat = function(label, val, cls) { return `<div class="bg-[#0b130f] p-3 rounded-2xl border border-emerald-950 text-center"><div class="text-[11px] text-slate-400 font-bold uppercase">${escHtml(label)}</div><div class="text-xl font-extrabold ${cls || "text-white"}">${val}</div></div>`; };
      const dt = prof.defaultTeam === "A" ? "white" : (prof.defaultTeam === "B" ? "dark" : "");
      renderSheetModal(`
        <div class="flex items-start gap-3 mb-4">

        <button type="button" id="l-btn" onclick="doLogin()" class="tap-lg w-full rounded-2xl neon-btn text-base">${escHtml(t("loginBtn"))}</button>

          <button type="button" onclick="showRegisterModal()" class="tap rounded-xl text-sm font-semibold text-slate-400">${escHtml(t("newHere"))}</button>

    function getPinVal() { return [0, 1, 2, 3, 4, 5].map(function(i) { const b = byId("pin-box-" + i); return b ? b.value.trim() : ""; }).join(""); }
    function onPinInput(idx, e) {
      const v = e.target.value.replace(/[^0-9]/g, "");
      // iOS/Android can fill the whole code into one box (paste or autofill): spread it out
      if (v.length > 1) {
        for (let i = 0; i < 6; i++) { const bx = byId("pin-box-" + i); if (bx && i >= idx) bx.value = v[i - idx] || ""; }
        if (getPinVal().length === 6) doLogin();
        return;
      }
      e.target.value = v.slice(-1);
      if (e.target.value && idx < 5) { const n = byId("pin-box-" + (idx + 1)); if (n) n.focus(); }
      if (getPinVal().length === 6) doLogin();
    }
    function onPinKey(idx, e) {
      if (e.key === "Backspace" && !e.target.value && idx > 0) { const p = byId("pin-box-" + (idx - 1)); if (p) p.focus(); }
      if (e.key === "Enter") doLogin();
    }
    function onPinPaste(e) {
      const p = (e.clipboardData || window.clipboardData).getData("text").replace(/[^0-9]/g, "").slice(0, 6);
      if (p.length) {
        e.preventDefault();
        for (let i = 0; i < 6; i++) { const bx = byId("pin-box-" + i); if (bx) bx.value = p[i] || ""; }
        if (p.length === 6) doLogin();
      }
    }
    async function doLogin() {
      const email = (byId("l-email") ? byId("l-email").value : "").trim();
      const pin = getPinVal();
      if (!email) { showToast(t("errEnterEmail"), true); return; }
      if (!/^\d{6}$/.test(pin)) return;
      await runAction("login", async function() {
        setBusyButton("l-btn", true);
        const res = await apiPost({ action: "login", email: email, pin: pin }, { noAuth: true });
        setBusyButton("l-btn", false);
        if (res && res.success) {
          currentUser = res.user;
          lsSet("soccer_user", JSON.stringify(currentUser));
          setAppData(res.appData || {});
          closeModal(); applyThemeAndLanguageUI(); renderAuthBar(); switchTab("upcoming");
          fetchWeatherForAllGamesAsync(); initOneSignalSdkIfConfigured();
          applyEmailRsvpIfReady();
        } else {
          for (let i = 0; i < 6; i++) { const bx = byId("pin-box-" + i); if (bx) bx.value = ""; }
          const first = byId("pin-box-0"); if (first) first.focus();
          if (res && res.error) showToast(res.error, true);
        }
      });
    }

      let body = "";
      if (adminSection === "games") body = renderAdminGames();
      else if (adminSection === "series") body = renderAdminSeries();

    function initFieldPickerMap(L) {
      const el = byId("field-map"); if (!el) return;
      el.innerHTML = "";
      let lat = parseFloat(byId("loc-lat").value), lng = parseFloat(byId("loc-lng").value);
      if (isNaN(lat) || isNaN(lng)) { lat = 33.1434; lng = -117.1661; }
      fieldPickerMap = L.map(el).setView([lat, lng], 17);
      addMapStyleSwitch(L, fieldPickerMap, "picker");
      fieldPickerMarker = L.marker([lat, lng], { draggable: true }).addTo(fieldPickerMap);
      fieldPickerMarker.on("dragend", function(e) { updateCoords(e.target.getLatLng().lat, e.target.getLatLng().lng); });
      fieldPickerMap.on("click", function(e) { fieldPickerMarker.setLatLng(e.latlng); updateCoords(e.latlng.lat, e.latlng.lng); });
      liveMaps.push(fieldPickerMap);
      setTimeout(function() { fieldPickerMap.invalidateSize(); }, 150);

    async function updateCoords(lat, lng) {
      if (!byId("loc-lat")) return;
      byId("loc-lat").value = lat.toFixed(6); byId("loc-lng").value = lng.toFixed(6);
      try {
        const res = await fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat=" + lat + "&lon=" + lng);
        const data = await res.json();
        if (data && data.display_name && byId("loc-addr")) byId("loc-addr").value = data.display_name;
      } catch (e) {}

      const q = byId("map-search-query").value.trim();
      if (!q) return;
      try {
        const res = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q));
        const hits = await res.json();
        if (!hits || !hits.length) { showToast(t("placeNotFound"), true); return; }
        const lat = parseFloat(hits[0].lat), lng = parseFloat(hits[0].lon);
        byId("loc-lat").value = lat.toFixed(6); byId("loc-lng").value = lng.toFixed(6);
        byId("loc-addr").value = hits[0].display_name;
        if (!byId("loc-name").value) byId("loc-name").value = hits[0].display_name.split(",")[0];
        if (fieldPickerMap) { fieldPickerMap.setView([lat, lng], 16); fieldPickerMarker.setLatLng([lat, lng]); }
      } catch (e) { showToast(t("errNetwork"), true); }
    }

      const name = byId("loc-name").value.trim(), address = byId("loc-addr").value.trim();
