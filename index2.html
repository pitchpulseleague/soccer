  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #070b09;
      color: #f1f5f9;
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    h1, h2, h3, .font-display { font-family: 'Outfit', sans-serif; }
    .glass-card {
      background: rgba(17, 28, 22, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 245, 155, 0.16);
    }
    .neon-btn {
      background: #00f59b;
      color: #070b09;
      font-weight: 700;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .neon-btn:hover {
      background: #34f7af;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 245, 155, 0.25);
    }
    .pin-box {
      width: 44px;
      height: 54px;
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      border-radius: 12px;
      background: #0b130f;
      border: 2px solid #065f46;
      color: #00f59b;
      outline: none;
      transition: all 0.18s ease;
    }
    .pin-box:focus {
      border-color: #00f59b;
      box-shadow: 0 0 0 3px rgba(0, 245, 155, 0.25);
      transform: translateY(-1px);
    }
    /* Tactical 2D Pitch Graphic */
    .soccer-pitch-bg {
      background: radial-gradient(circle at center, #065f46 0%, #064e3b 70%, #022c22 100%);
      border: 2px solid rgba(255,255,255,0.28);
      position: relative;
    }
    .soccer-pitch-bg::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1.5px;
      background: rgba(255,255,255,0.25);
    }
    .soccer-pitch-bg::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 72px;
      height: 72px;
      margin-top: -36px;
      margin-left: -36px;
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 9999px;
      pointer-events: none;
    }

    /* ======================================================================
       DEFAULT DAYLIGHT / HIGH-CONTRAST LIGHT MODE OVERRIDES
       ====================================================================== */
    body.light-mode {
      background-color: #f1f5f9 !important;
      color: #0f172a !important;
    }
    body.light-mode header,
    body.light-mode #mobile-bottom-dock {
      background-color: rgba(255, 255, 255, 0.96) !important;
      border-color: #cbd5e1 !important;
    }
    body.light-mode .glass-card {
      background: #ffffff !important;

      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.06) !important;
    }

    body.light-mode .bg-\[\#0b130f\]\/70,
    body.light-mode .bg-\[\#111c16\] {
      background-color: #f8fafc !important;

    body.light-mode .text-slate-400,

  <script>
    window.addEventListener("error", function(e) {
      var b = document.getElementById("status-banner");
      if (b) {
        b.className = "mb-6 p-4 rounded-xl text-sm font-semibold border bg-rose-950/90 border-rose-600 text-rose-200";
        b.innerHTML = "⚠️ Script Notice (Line " + e.lineno + "): " + e.message;
        b.classList.remove("hidden");
      }
    });
  </script>

    function getTodayIso() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    function parseTimeParts(timeStr) {
      const raw = String(timeStr || "12:00 PM").trim().toUpperCase();
      const ampm = raw.indexOf("AM") !== -1 ? "AM" : "PM";
      const clean = raw.replace(/[^0-9:]/g, "");
      const parts = clean.split(":");
      let hr = parts[0] ? String(parseInt(parts[0], 10)) : "12";
      if (!hr || hr === "0" || isNaN(hr)) hr = "12";
      let min = parts[1] ? parts[1].padStart(2, "0") : "00";
      if (["00", "15", "30", "45"].indexOf(min) === -1) min = "00";
      return { hr: hr, min: min, ampm: ampm };
    }

    // Google Calendar Quick-Add Link Builder
    function buildGoogleCalendarUrl(game) {
      try {
        const dParts = String(game.Date).split("-");
        const tParts = parseTimeParts(game.Time);
        let hr = parseInt(tParts.hr, 10);
        if (tParts.ampm === "PM" && hr < 12) hr += 12;
        if (tParts.ampm === "AM" && hr === 12) hr = 0;
        const min = parseInt(tParts.min, 10);
        const startDt = new Date(Number(dParts[0]), Number(dParts[1]) - 1, Number(dParts[2]), hr, min, 0);
        const endDt = new Date(startDt.getTime() + 75 * 60000); // 75 min lunch session
        function fmtCal(d) {
          return d.getFullYear() +
            String(d.getMonth() + 1).padStart(2, "0") +
            String(d.getDate()).padStart(2, "0") + "T" +
            String(d.getHours()).padStart(2, "0") +
            String(d.getMinutes()).padStart(2, "0") + "00";
        }
        const addr = (game.locationDetails && game.locationDetails.address) ? game.locationDetails.address : game.LocationName;
        return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
          "&text=" + encodeURIComponent("⚽ " + game.Title) +
          "&dates=" + fmtCal(startDt) + "/" + fmtCal(endDt) +
          "&location=" + encodeURIComponent(game.LocationName + " - " + addr) +
          "&details=" + encodeURIComponent("Pitch Pulse Lunchtime Soccer League Match. Live roster & weather: https://pitchpulseleague.github.io/soccer/");
      } catch (e) {
        return "#";
      }
    }

    async function fetchWeatherForAllGames() {
      const games = appData.games || [];
      for (let i = 0; i < games.length; i++) {
        const g = games[i];
        const lat = g.locationDetails && g.locationDetails.lat;
        const lng = g.locationDetails && g.locationDetails.lng;
        if (!lat || !lng) continue;
        const key = lat + "," + lng;
        if (!weatherCache[key]) {
          try {
            const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lng + "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&temperature_unit=fahrenheit&timezone=auto";
            const res = await fetch(url);
            const data = await res.json();
            if (data && data.daily) weatherCache[key] = data.daily;
          } catch (e) {}
        }
      }
    }

    function renderWeatherBadge(game) {
      const lat = game.locationDetails && game.locationDetails.lat;
      const lng = game.locationDetails && game.locationDetails.lng;
      if (!lat || !lng) return '<span class="text-xs text-slate-400">' + t("weatherPending") + '</span>';
      const daily = weatherCache[lat + "," + lng];
      if (!daily || !daily.time) return '<span class="text-xs text-slate-400">' + t("weather7Days") + '</span>';

      const idx = daily.time.indexOf(String(game.Date).slice(0, 10));
      if (idx === -1) return '<span class="text-xs text-slate-400">' + t("weather7Days") + '</span>';

      const hi = Math.round(daily.temperature_2m_max[idx]);
      const lo = Math.round(daily.temperature_2m_min[idx]);
      const rain = daily.precipitation_probability_max[idx] || 0;
      const code = daily.weathercode[idx];
      let icon = "☀️", label = t("clearSunny");
      if (code > 0 && code < 3) { icon = "⛅"; label = t("partlyCloudy"); }
      else if (code >= 3 && code < 50) { icon = "☁️"; label = t("cloudyWord"); }
      else if (code >= 50) { icon = "🌧️"; label = t("rainLikely"); }

      return '<div class="flex items-center gap-2.5 bg-emerald-950/50 border border-emerald-800/40 px-3 py-2 rounded-xl text-xs shrink-0">' +
        '<span class="text-xl">' + icon + '</span>' +
        '<div><div class="font-bold text-white">' + label + ' • ' + hi + '°F <span class="text-slate-400 font-normal">/ ' + lo + '°F</span></div>' +
        '<div class="text-emerald-300">' + t("rainChance") + ' ' + rain + '%</div></div></div>';
    }

    function renderGameCard(game) {
      const roster = game.roster || [];
      const yesList = roster.filter(function(r) { return r.status === "Yes"; });
      const waitlistList = roster.filter(function(r) { return r.status === "Waitlist"; });
      const maybeList = roster.filter(function(r) { return r.status === "Maybe"; });
      const noList = roster.filter(function(r) { return r.status === "No"; });

      const yesCount = Number(game.yesCount !== undefined ? game.yesCount : yesList.length);
      const maxCap = Number(game.MaxCap || 18);
      const minThreshold = Number(game.MinThreshold || 10);
      const isConfirmed = yesCount >= minThreshold;
      const isFull = yesCount >= maxCap;
      const pct = Math.min(100, Math.round((yesCount / minThreshold) * 100));

      let myEntry = null;
      let myStatus = "";
      if (currentUser) {
        myEntry = roster.find(function(r) { return r.email.toLowerCase() === currentUser.email.toLowerCase(); });
        if (myEntry) myStatus = myEntry.status;
      }

    function toggleGameCardMap(gameId, lat, lng, locName) {
      const wrap = document.getElementById("game-map-wrap-" + gameId);
      if (!wrap) return;
      const isHidden = wrap.classList.contains("hidden");
      if (isHidden) {
        wrap.classList.remove("hidden");
        setTimeout(function() {
          const latNum = parseFloat(lat);
          const lngNum = parseFloat(lng);
          if (isNaN(latNum) || isNaN(lngNum)) return;
          if (gameCardMaps[gameId]) {
            gameCardMaps[gameId].remove();
          }
          const map = L.map("game-map-" + gameId).setView([latNum, lngNum], 15);
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap"
          }).addTo(map);
          L.marker([latNum, lngNum]).addTo(map).bindPopup("<b>⚽ " + locName + "</b>").openPopup();
          gameCardMaps[gameId] = map;
        }, 60);
      } else {
        wrap.classList.add("hidden");
      }
    }

    function openBlastModal(gameId) {
      const game = (appData.games || []).find(function(g) { return String(g.GameID) === String(gameId); });
      if (!game) return;
      const rsvpCount = (game.roster || []).filter(function(r) { return r.status === "Yes" || r.status === "Maybe" || r.status === "Waitlist"; }).length;

      document.getElementById("modal-root").innerHTML = `
        <div class="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
          <div class="glass-card rounded-2xl p-6 max-w-md w-full">
            <h3 class="text-lg font-extrabold text-white mb-1">📢 Send Game Update / Email Blast</h3>
            <p class="text-xs text-slate-400 mb-3">
              Game: <b class="text-white">${game.Title} (${game.Date} @ ${game.Time})</b><br>
              This message will be emailed immediately to <b>${rsvpCount} RSVPed (Yes/Maybe/Waitlist) player(s)</b> and posted under the match card for future signups to read.
            </p>
            <textarea id="blast-msg-input" rows="4" placeholder="Type your update or announcement here (e.g., Field #2 is wet, we moved 50 yards north to Field #4)..." class="w-full mb-4 p-3 rounded-xl bg-[#0b130f] border border-emerald-900 text-sm text-white"></textarea>
            <div class="flex justify-end gap-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs bg-slate-800 text-slate-300 cursor-pointer">Cancel</button>
              <button type="button" onclick="submitGameBlast('${game.GameID}')" class="px-5 py-2 rounded-xl text-xs neon-btn">📧 Send Email Blast & Post</button>
            </div>
          </div>
        </div>
      `;
    }

    async function submitGameBlast(gameId) {
      const msg = document.getElementById("blast-msg-input").value.trim();
      if (!msg) return alert("Please type a message first.");

      const res = await apiPost({
        action: "adminSendGameBlast",
        senderName: currentUser.fullName || "League Admin",
        gameId: gameId,
        message: msg
      });

      if (res && res.success) {
        appData = res;
        closeModal();
        showBanner(res.message || "Blast sent and posted!");
        renderCurrentTab();
      } else if (res) {
        alert(res.error);
      }
    }

    async function toggleBlastVisibility(blastId, hideFlag) {
      const res = await apiPost({
        action: "adminToggleBlastVisibility",
        blastId: blastId,
        hidden: hideFlag
      });
      if (res && res.success) {
        appData = res;
        showBanner(res.message || "Blast visibility updated.");
        renderCurrentTab();
      } else if (res) {
        showBanner(res.error, true);
      }
    }

      const game = (appData.games || []).find(function(g) { return String(g.GameID) === String(gameId); });
      if (!game) return;
      const wVal = (game.ScoreWhite !== undefined && game.ScoreWhite !== "") ? game.ScoreWhite : 0;
      const dVal = (game.ScoreDark !== undefined && game.ScoreDark !== "") ? game.ScoreDark : 0;

      document.getElementById("modal-root").innerHTML = `
        <div class="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
          <div class="glass-card rounded-2xl p-6 max-w-sm w-full text-center">

            <p class="text-xs text-slate-400 mb-4">${game.Title} (${game.Date})</p>
            <div class="flex items-center justify-center gap-4 mb-5">
              <div>

                <input id="sc-white" type="number" min="0" value="${wVal}" class="w-20 p-2.5 rounded-xl bg-[#0b130f] border border-emerald-900 text-center text-lg font-extrabold text-white">

              <span class="text-2xl font-extrabold text-slate-400 mt-4">—</span>
              <div>
                <label class="text-xs font-bold text-slate-400 block mb-1">⚫ Team Dark</label>
                <input id="sc-dark" type="number" min="0" value="${dVal}" class="w-20 p-2.5 rounded-xl bg-[#0b130f] border border-emerald-900 text-center text-lg font-extrabold text-white">

            <div class="flex justify-end gap-2">

            </div>
          </div>
        </div>
      `;

    async function submitGameScore(gameId) {
      const scoreWhite = Number(document.getElementById("sc-white").value || 0);
      const scoreDark = Number(document.getElementById("sc-dark").value || 0);
      const res = await apiPost({ action: "adminSaveScore", gameId: gameId, scoreWhite: scoreWhite, scoreDark: scoreDark });
      if (res && res.success) {
        appData = res;
        closeModal();
        showBanner(res.message || "Score saved!");
        renderCurrentTab();
      } else if (res) {
        alert(res.error);
      }
    }

    function initAdminLocationPickerMap() {
      const mapEl = document.getElementById("admin-picker-map");
      if (!mapEl || typeof L === "undefined") return;

      if (adminPickerMap) {
        adminPickerMap.remove();
        adminPickerMap = null;
      }

      const latInput = document.getElementById("loc-lat");
      const lngInput = document.getElementById("loc-lng");
      let startLat = parseFloat(latInput && latInput.value ? latInput.value : "33.1434");
      let startLng = parseFloat(lngInput && lngInput.value ? lngInput.value : "-117.1661");
      if (isNaN(startLat) || isNaN(startLng)) {
        startLat = 33.1434;
        startLng = -117.1661;
      }

      adminPickerMap = L.map("admin-picker-map").setView([startLat, startLng], 14);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors"
      }).addTo(adminPickerMap);

      adminPickerMarker = L.marker([startLat, startLng], { draggable: true }).addTo(adminPickerMap);
      adminPickerMarker.bindPopup("<b>⚽ Drag me or click anywhere on the map to pinpoint the field!</b>").openPopup();

      adminPickerMarker.on("dragend", function(e) {
        const pos = e.target.getLatLng();
        updatePickerCoordsAndReverseGeocode(pos.lat, pos.lng);
      });

      adminPickerMap.on("click", function(e) {
        adminPickerMarker.setLatLng(e.latlng);
        updatePickerCoordsAndReverseGeocode(e.latlng.lat, e.latlng.lng);
      });
    }

    async function updatePickerCoordsAndReverseGeocode(lat, lng) {
      const latIn = document.getElementById("loc-lat");
      const lngIn = document.getElementById("loc-lng");
      const addrIn = document.getElementById("loc-addr");
      if (latIn) latIn.value = lat.toFixed(6);
      if (lngIn) lngIn.value = lng.toFixed(6);

      try {
        const res = await fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat=" + lat + "&lon=" + lng);
        const data = await res.json();
        if (data && data.display_name && addrIn) {
          addrIn.value = data.display_name;
        }
      } catch (e) {}
    }

    async function searchFieldOnMap() {
      const q = document.getElementById("map-search-query").value.trim();
      if (!q) return alert("Enter a park name, city, or street address to search.");
      try {
        const res = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q));
        const results = await res.json();
        if (!results || results.length === 0) {
          return alert("Location not found. Try adding the city or state (e.g., 'Bradley Park San Marcos CA').");
        }
        const hit = results[0];
        const lat = parseFloat(hit.lat);
        const lng = parseFloat(hit.lon);

        document.getElementById("loc-lat").value = lat.toFixed(6);
        document.getElementById("loc-lng").value = lng.toFixed(6);
        document.getElementById("loc-addr").value = hit.display_name;
        const nameIn = document.getElementById("loc-name");
        if (nameIn && !nameIn.value.trim()) {
          nameIn.value = hit.display_name.split(",")[0];
        }

        if (adminPickerMap && adminPickerMarker) {
          adminPickerMap.setView([lat, lng], 16);
          adminPickerMarker.setLatLng([lat, lng]);
          adminPickerMarker.bindPopup("<b>📍 " + hit.display_name.split(",")[0] + "</b>").openPopup();
        }
      } catch (e) {
        alert("Map search error: " + e.message);
      }
    }

        action: "adminToggleLocationStatus",
        locationId: locationId,
        newStatus: newStatus
      });
      if (res && res.success) {
        appData = res;
        showBanner(res.message || "Location status updated.");
        renderAdminView();
      } else if (res) showBanner(res.error, true);
    }

    async function adminRemoveLocation(locationId) {
      if (!confirm("Remove this field location? (If it was used in past games, it will be Deactivated instead to preserve history).")) return;
      const res = await apiPost({ action: "adminDeleteLocation", locationId: locationId });
      if (res && res.success) {
        appData = res;
        if (res.message) showBanner(res.message);
        renderAdminView();
      } else if (res) showBanner(res.error, true);
    }

    async function adminToggleRole(targetEmail, newRole) {
      if (isProtectedEmail(targetEmail)) return alert("Protected System Admin accounts cannot be demoted.");
      if (!confirm("Update " + targetEmail + " role to " + newRole + "?")) return;
      const res = await apiPost({ action: "adminUpdateUserRole", targetEmail: targetEmail, newRole: newRole });
      if (res && res.success) {
        appData = res;
        renderAdminView();
      } else if (res) showBanner(res.error, true);
    }

    async function adminToggleSuspend(targetEmail, newStatus) {
      if (isProtectedEmail(targetEmail)) return alert("Protected System Admin accounts cannot be suspended.");
      const actionVerb = newStatus === "Suspended" ? "SUSPEND" : "REACTIVATE";
      if (!confirm("Are you sure you want to " + actionVerb + " " + targetEmail + "?")) return;
      const res = await apiPost({ action: "adminToggleSuspendUser", targetEmail: targetEmail, newStatus: newStatus });
      if (res && res.success) {
        appData = res;
        showBanner(res.message || targetEmail + " updated.");
        renderAdminView();
      } else if (res) showBanner(res.error, true);
    }

    async function adminRemovePlayer(targetEmail) {
      if (isProtectedEmail(targetEmail)) return alert("Protected System Admin accounts cannot be removed.");
      if (!confirm("Remove " + targetEmail + "? (If they participated in past games, they will be Suspended instead so historical rosters stay intact).")) return;
      const res = await apiPost({ action: "adminDeleteUser", targetEmail: targetEmail });
      if (res && res.success) {
        appData = res;
        showBanner(res.message || ("Removed player " + targetEmail));
        renderAdminView();
      } else if (res) showBanner(res.error, true);
    }

    // =========================================================================
    // 6-BOX AUTO-ADVANCE PIN LOGIN, REGISTER & PROFILE MODALS
    // =========================================================================
    function showLoginModal() {
      document.getElementById("modal-root").innerHTML = `
        <div class="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
          <div class="glass-card rounded-3xl p-6 max-w-sm w-full">
            <h3 class="text-lg font-extrabold text-white mb-1">${t("loginBtn")}</h3>
            <p class="text-xs text-slate-400 mb-4">Enter your email and 6-digit PIN (auto-submits on 6th digit).</p>
            <input id="l-email" type="email" placeholder="Email Address" class="w-full mb-4 p-3 rounded-xl bg-[#0b130f] border border-emerald-900 text-sm text-white">
            <div class="flex justify-between gap-1.5 mb-3">
              ${[0,1,2,3,4,5].map(i => `
                <input id="pin-box-${i}" type="password" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="pin-box"
                  oninput="onPinBoxInput(${i}, event)" onkeydown="onPinBoxKey(${i}, event)" onpaste="onPinBoxPaste(event)">
              `).join("")}
            </div>
            <div class="text-right mb-4">
              <button type="button" onclick="showForgotPinModal()" class="text-xs text-[#00f59b] font-semibold hover:underline cursor-pointer">Forgot 6-Digit PIN / Backup Admin Recovery?</button>
            </div>
            <div class="flex justify-end gap-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-xs bg-slate-800 text-slate-300 cursor-pointer">Cancel</button>
              <button type="button" onclick="doLogin()" class="px-5 py-2.5 rounded-xl text-xs neon-btn">Login</button>
            </div>
          </div>
        </div>
      `;
      setTimeout(function() {
        const emIn = document.getElementById("l-email");
        if (emIn) emIn.focus();
      }, 60);
    }

    function getEnteredPinBoxes() {
      return [0,1,2,3,4,5].map(function(i) {
        const el = document.getElementById("pin-box-" + i);
        return el ? el.value.trim() : "";
      }).join("");
    }

    function onPinBoxInput(idx, e) {
      const val = e.target.value.replace(/[^0-9]/g, "");
      e.target.value = val.slice(-1);
      if (e.target.value && idx < 5) {
        const nextEl = document.getElementById("pin-box-" + (idx + 1));
        if (nextEl) nextEl.focus();
      }
      const fullPin = getEnteredPinBoxes();
      if (fullPin.length === 6) {
        doLogin();
      }
    }

    function onPinBoxKey(idx, e) {
      if (e.key === "Backspace" && !e.target.value && idx > 0) {
        const prevEl = document.getElementById("pin-box-" + (idx - 1));
        if (prevEl) prevEl.focus();
      }
    }

    function onPinBoxPaste(e) {
      const pasted = (e.clipboardData || window.clipboardData).getData("text").replace(/[^0-9]/g, "").slice(0, 6);
      if (pasted.length > 0) {
        e.preventDefault();
        for (let i = 0; i < 6; i++) {
          const bx = document.getElementById("pin-box-" + i);
          if (bx) bx.value = pasted[i] || "";
        }
        if (pasted.length === 6) doLogin();
      }
    }

    async function doLogin() {
      const email = document.getElementById("l-email").value.trim();
      const pin = getEnteredPinBoxes();
      if (!email || pin.length !== 6) return alert("Please enter your email and all 6 digits of your PIN.");

      const res = await apiPost({ action: "login", email: email, pin: pin });
      if (res && res.success) {
        currentUser = res.user;
        currentUser.pin = pin;
        if (res.appData) appData = res.appData;
        localStorage.setItem("soccer_user", JSON.stringify(currentUser));
        closeModal();
        await fetchWeatherForAllGames();
        renderAuthBar();
        switchTab("upcoming");
      } else if (res) {
        alert(res.error);
      }
    }

    function showRegisterModal() {
      document.getElementById("modal-root").innerHTML = `
        <div class="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
          <div class="glass-card rounded-3xl p-6 max-w-sm w-full">
            <h3 class="text-lg font-extrabold text-white mb-1">${t("registerBtn")}</h3>
            <p class="text-xs text-slate-400 mb-4">Your email must be invited by a League Admin first.</p>
            <input id="r-name" type="text" placeholder="Your Full Name" class="w-full mb-3 p-2.5 rounded-xl bg-[#0b130f] border border-emerald-900 text-sm text-white">
            <input id="r-email" type="email" placeholder="Invited Email Address" class="w-full mb-3 p-2.5 rounded-xl bg-[#0b130f] border border-emerald-900 text-sm text-white">
            <select id="r-pos" class="w-full mb-3 p-2.5 rounded-xl bg-[#0b130f] border border-emerald-900 text-sm text-white font-semibold cursor-pointer">
              <option value="MID">Preferred Position: Midfielder (MID)</option>
              <option value="DEF">Preferred Position: Defender (DEF)</option>
              <option value="FWD">Preferred Position: Forward (FWD)</option>
              <option value="GK">Preferred Position: Goalkeeper (GK)</option>
            </select>
            <input id="r-pin" type="password" maxlength="6" inputmode="numeric" placeholder="Create 6-Digit PIN (Numbers)" class="w-full mb-4 p-2.5 rounded-xl bg-[#0b130f] border border-emerald-900 text-sm text-white tracking-widest text-center font-bold">
            <div class="flex justify-end gap-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs bg-slate-800 text-slate-300 cursor-pointer">Cancel</button>
              <button type="button" onclick="doRegister()" class="px-5 py-2 rounded-xl text-xs neon-btn">Create Profile</button>
            </div>
          </div>
        </div>
      `;
    }

    async function doRegister() {
      const fullName = document.getElementById("r-name").value.trim();
      const email = document.getElementById("r-email").value.trim();
      const position = document.getElementById("r-pos").value;
      const pin = document.getElementById("r-pin").value.trim();
      if (pin.length !== 6) return alert("PIN must be exactly 6 digits.");
      const res = await apiPost({ action: "register", fullName: fullName, email: email, position: position, pin: pin });
      if (res && res.success) {
        currentUser = res.user;
        currentUser.pin = pin;
        if (res.appData) appData = res.appData;
        localStorage.setItem("soccer_user", JSON.stringify(currentUser));
        closeModal();
        await fetchWeatherForAllGames();
        renderAuthBar();
        switchTab("upcoming");
      } else if (res) {
        alert(res.error);
      }
    }

    function showForgotPinModal() {
      document.getElementById("modal-root").innerHTML = `
        <div class="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
          <div class="glass-card rounded-3xl p-6 max-w-sm w-full">
            <h3 class="text-lg font-extrabold text-white mb-1">🔒 Reset Your 6-Digit PIN</h3>
            <p class="text-xs text-slate-400 mb-4">Enter your registered email to receive a 6-digit verification code.</p>
            <input id="f-email" type="email" placeholder="Registered Email Address" class="w-full mb-3 p-2.5 rounded-xl bg-[#0b130f] border border-emerald-900 text-sm text-white">
            
            <label class="flex items-start gap-2 bg-amber-500/20 border border-amber-500/40 p-3 rounded-xl text-xs text-amber-200 mb-4 cursor-pointer">
              <input id="f-backup" type="checkbox" class="mt-0.5 accent-[#00f59b]">
              <span><b>Emergency System Admin Recovery:</b> Send the reset code for <b>pitchpulseleague@gmail.com</b> to backup address <b>ralph@me.com</b></span>
            </label>

            <div class="flex justify-end gap-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs bg-slate-800 text-slate-300 cursor-pointer">Cancel</button>
              <button type="button" onclick="sendPinResetEmail()" class="px-5 py-2 rounded-xl text-xs neon-btn">Send Code</button>
            </div>
          </div>
        </div>
      `;
    }

    async function sendPinResetEmail() {
      const email = document.getElementById("f-email").value.trim();
      const useBackup = document.getElementById("f-backup").checked;
      if (!email) return alert("Please enter the email address.");

      const res = await apiPost({ action: "requestPinReset", email: email, useBackupRecovery: useBackup });
      if (res && res.success) {
        const targetEmail = res.targetEmail || email;
        alert(res.message);
        document.getElementById("modal-root").innerHTML = `
          <div class="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
            <div class="glass-card rounded-3xl p-6 max-w-sm w-full">
              <h3 class="text-lg font-extrabold text-white mb-1">Enter Verification Code</h3>
              <p class="text-xs text-slate-400 mb-3">Resetting PIN for: <b class="text-white">${targetEmail}</b></p>
              <input id="rst-code" type="text" maxlength="6" placeholder="6-Digit Code from Email" class="w-full mb-3 p-2.5 rounded-xl bg-[#0b130f] border border-emerald-900 text-sm text-white">
              <input id="rst-pin" type="password" maxlength="6" inputmode="numeric" placeholder="New 6-Digit PIN" class="w-full mb-4 p-2.5 rounded-xl bg-[#0b130f] border border-emerald-900 text-sm text-white tracking-widest">
              <div class="flex justify-end gap-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs bg-slate-800 text-slate-300 cursor-pointer">Cancel</button>
                <button type="button" onclick="confirmPinReset('${targetEmail}')" class="px-5 py-2 rounded-xl text-xs neon-btn">Save New PIN</button>
              </div>
            </div>
          </div>
        `;
      } else if (res) alert(res.error);
    }

    async function confirmPinReset(email) {
      const code = document.getElementById("rst-code").value.trim();
      const newPin = document.getElementById("rst-pin").value.trim();
      const res = await apiPost({ action: "resetPin", email: email, code: code, newPin: newPin });
      if (res && res.success) {
        alert(res.message);
        showLoginModal();
      } else if (res) alert(res.error);
    }

    function openMyProfileModal() {
      const myHistory = (appData.games || []).filter(function(g) { return (g.roster || []).some(function(r) { return r.email.toLowerCase() === currentUser.email.toLowerCase(); }); });
      const myProf = (appData.profiles && appData.profiles[currentUser.email.toLowerCase()]) || {};
      const curPos = currentUser.position || myProf.position || "MID";
      const rel = myProf.reliability !== undefined ? myProf.reliability : 100;

      document.getElementById("modal-root").innerHTML = `
        <div class="fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
          <div class="glass-card rounded-3xl p-6 max-w-md w-full max-h-[85vh] overflow-y-auto">
            <h3 class="text-lg font-extrabold text-white">${currentUser.fullName}</h3>
            <p class="text-xs text-[#00f59b] mb-3">${currentUser.email} • ${isSystemAdminOnly(currentUser.email) ? 'System Administrator (Non-Player)' : (currentUser.role || 'Player')} • Reliability: ${rel}%</p>
            
            ${!isSystemAdminOnly(currentUser.email) ? `
              <div class="bg-[#0b130f] p-3.5 rounded-xl border border-emerald-950 mb-4">
                <label class="text-xs font-bold text-slate-400 block mb-1.5">Preferred Field Position (Used for Team Balancing)</label>
                <div class="flex gap-2">
                  <select id="prof-pos-select" class="flex-1 bg-[#111c16] border border-emerald-900 rounded-xl p-2 text-xs text-white font-semibold">
                    <option value="MID" ${curPos === 'MID' ? 'selected' : ''}>Midfielder (MID)</option>
                    <option value="DEF" ${curPos === 'DEF' ? 'selected' : ''}>Defender (DEF)</option>
                    <option value="FWD" ${curPos === 'FWD' ? 'selected' : ''}>Forward / Striker (FWD)</option>
                    <option value="GK" ${curPos === 'GK' ? 'selected' : ''}>Goalkeeper (GK)</option>
                  </select>
                  <button type="button" onclick="saveMyPosition()" class="px-4 py-2 rounded-xl text-xs neon-btn">Save</button>
                </div>
              </div>
            ` : ''}

            <h4 class="text-xs font-bold uppercase text-slate-400 mb-2">My Match RSVP History (${myHistory.length})</h4>
            <div class="space-y-2 mb-5">
              ${myHistory.length ? myHistory.map(g => {
                const st = g.roster.find(r => r.email.toLowerCase() === currentUser.email.toLowerCase()).status;
                return `<div class="bg-[#0b130f] p-3 rounded-xl flex justify-between items-center text-xs">
                  <div><b>${g.Title}</b><br><span class="text-slate-400">${g.Date} @ ${g.Time}</span></div>
                  <span class="px-2.5 py-1 rounded font-bold ${st === 'Yes' ? 'bg-emerald-950 text-[#00f59b]' : 'bg-slate-800 text-slate-300'}">${st}</span>
                </div>`;
              }).join("") : '<p class="text-xs text-slate-500">No RSVPs recorded yet.</p>'}
            </div>
            <div class="flex justify-end">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs bg-slate-800 text-white cursor-pointer">Close</button>
            </div>
          </div>
        </div>
      `;
    }

    async function saveMyPosition() {
      const pos = document.getElementById("prof-pos-select").value;
      const res = await apiPost({
        action: "updateProfileDetails",
        position: pos,
        fullName: currentUser.fullName
      });
      if (res && res.success) {
        currentUser.position = pos;
        localStorage.setItem("soccer_user", JSON.stringify(currentUser));
        appData = res;
        closeModal();
        showBanner("Position updated to " + pos + "!");
        renderAuthBar();
        renderCurrentTab();
      }
    }

    function closeModal() {
      document.getElementById("modal-root").innerHTML = "";
    }

    function logout() {
      localStorage.removeItem("soccer_user");
      currentUser = null;
      appData = { games: [], locations: [], profiles: {}, invites: [], recurring: [] };
      activeTab = "upcoming";
      renderAuthBar();
      renderCurrentTab();
    }

    // Boot Application
    applyThemeAndLanguageUI();
    renderAuthBar();
    renderCurrentTab();
    if (currentUser) {
      syncFromBackend();
    }
  </script>
</body>
</html>
