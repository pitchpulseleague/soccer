/* A persistent action cue also works in Generic and when movement is reduced. */

.rsvp-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
body[data-design="generic"] .rsvp-attention-label {

.motion-picker { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 6px; }

body[data-design="iphone"] .motion-demo > div { border-radius: 6px; }
body[data-design="android"] .motion-demo > div { border-radius: 18px; }

/* Finite native motion is applied only from deliberate interaction hooks. */
html[data-motion="reduced"] { scroll-behavior: auto !important; }
body[data-motion="reduced"] .press:active,
body[data-motion="reduced"] .neon-btn:active,
body[data-motion="reduced"] .dock-btn:active .ic { transform: none; }
@media (hover:hover) and (pointer:fine) {
  body:is([data-design="iphone"],[data-design="android"])[data-standalone="false"] .hdr-btn:hover { background: var(--pp-skin-surface-3); }
}

/* Pitch Pulse responsive layout, revision 2.
 * One set of game actions and one roster; available space controls their layout.
 * Insert after the optional design skins. Generic shares these layout repairs.
 */
:root {
  --pp-header-height: 56px;
  --pp-page-width: 1280px;
  --pp-rail-width: 80px;
  --pp-viewport-height: 100vh;
}
@supports (height: 100dvh) {
  :root { --pp-viewport-height: 100dvh; }
}
body.min-h-screen {
  --pp-layout-line: rgba(148, 163, 184, 0.20);
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: calc(88px + env(safe-area-inset-bottom));
}
body.light-mode { --pp-layout-line: rgba(15, 23, 42, 0.13); }
body[data-signed-in="false"] { padding-bottom: max(24px, env(safe-area-inset-bottom)); }

/* Keep controls reachable on a cover screen and full names out of the toolbar. */
body #app-header > div {
  width: 100%;
  max-width: var(--pp-page-width);
  height: var(--pp-header-height);
  min-height: var(--pp-header-height);
  padding-inline: 12px;
  gap: 8px;
}
body #app-header > div > div:first-child { min-width: 0; flex: 1 1 auto; gap: 10px; }
body #app-header .hdr-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
body #app-header .hdr-logo { flex: 0 0 36px; width: 36px; height: 36px; }
body #app-header .hdr-btn { min-width: 44px; height: 44px; padding-inline: 10px; flex-shrink: 0; }
body #app-header > div > div:last-child { gap: 6px; }
body #desktop-auth-bar { display: none !important; }
@media (min-width: 1120px) {
  body #desktop-auth-bar { display: flex !important; min-width: 0; max-width: 220px; }
  body #desktop-auth-bar > button { min-width: 0; max-width: 220px; }
  body #desktop-auth-bar > button > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}
@media (max-width: 359px) {
  body #app-header > div > div:first-child { gap: 7px; }
  body #app-header .hdr-logo { flex-basis: 30px; width: 30px; height: 30px; }
  body #app-header .hdr-title { font-size: 14px; letter-spacing: 0.01em; }
  body #app-header > div > div:last-child { gap: 3px; }
}

body #app-main {
  width: 100%;
  max-width: var(--pp-page-width);
  margin-top: 16px;
  padding-left: max(12px, env(safe-area-inset-left)) !important;
  padding-right: max(12px, env(safe-area-inset-right)) !important;
}
body #nav-tabs-bar { flex-wrap: wrap; gap: 8px; }
body #nav-tabs-bar > h2 { min-width: 0; flex: 1 1 110px; }
body #nav-tabs-bar > div { min-width: 0; max-width: 100%; flex-wrap: wrap; justify-content: flex-end; }
body #sync-indicator { min-width: 0; max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
body #view-container { min-width: 0; }

/* Compact matches can share a row. An open match always owns the full row. */
.games-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  gap: 14px;
  align-items: start;
}
body #view-container > .games-list > :not([hidden]) { min-width: 0; margin-top: 0; margin-bottom: 0; }
.games-list > .match-card,
.games-list > h3,
.games-list > #show-more-btn { grid-column: 1 / -1; }
body .match-card,
body .match-compact {
  min-width: 0;
  max-width: 100%;
  scroll-margin-top: calc(var(--pp-header-height) + env(safe-area-inset-top) + 12px);
}
body .match-card { container-type: inline-size; container-name: match; }
.match-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
.match-main { min-width: 0; container-type: inline-size; container-name: match-main; }
.match-side { min-width: 0; container-type: inline-size; container-name: match-side; }
.match-layout[data-has-side="false"] { grid-template-columns: minmax(0, 1fr); }
.match-layout[data-has-side="false"] > .match-main { grid-column: 1 / -1; }
.match-layout[data-has-side="false"] > .match-side,
.match-side:empty { display: none; }
body .match-side > :first-child { margin-top: 0; }
body .match-side > .roster-section:first-child { padding-top: 0; border-top: 0; }
body .match-primary-info { min-width: 0; gap: 12px; }
body .match-primary-info > .min-w-0 { min-width: 0; flex: 1 1 auto; }
body .match-header-tools { max-width: 40%; }
body .match-collapse { flex-shrink: 0; min-width: 44px; min-height: 44px; }
body .match-weather { min-width: 0; max-width: 100%; }
body .match-weather > div { white-space: normal; overflow-wrap: break-word; }
body .match-title { overflow-wrap: break-word; }
body .match-venue { max-width: 100%; text-align: start; }
body .match-venue > .truncate { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; }
body .match-turnout > .flex { flex-wrap: wrap; row-gap: 4px; }
body .match-secondary-actions > button { min-width: 0; min-height: 48px; padding: 8px; line-height: 1.35; white-space: normal; }
body .match-main > button { min-width: 0; padding-inline: 12px; padding-block: 8px; }

/* 580px of card content gives a 302px action column and 245px usable sidebar.
 * At a 669px viewport: 24px outer gutters + 44px card padding + 2px border
 * leave 599px: approximately 312px main and 254px sidebar after its inset.
 */
@container match (min-width: 580px) {
  .match-layout[data-has-side="true"] {
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 16px;
  }
  .match-layout[data-has-side="true"] > .match-side {
    border-inline-start: 1px solid var(--pp-skin-line, var(--pp-layout-line));
    padding-inline-start: 16px;
  }
}

/* A narrow action column is a narrow phone layout even inside a wide device. */
@container match-main (max-width: 360px) {
  body .match-primary-info { display: block; position: relative; }
  body .match-primary-info:has(.match-collapse) > .min-w-0 { padding-inline-end: 52px; }
  body .match-header-tools { display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; max-width: 100%; gap: 6px; }
  body .match-collapse { position: absolute; inset-inline-end: 0; inset-block-start: 0; }
  body .match-weather { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; text-align: start; }
  body .match-title { font-size: 21px; line-height: 1.25; }
  body .match-secondary-actions { gap: 6px; }
  body .match-secondary-actions > button { font-size: 13px; gap: 6px; }
}

/* RSVP choice geometry is driven by its own space, including the sidebar split. */
body .rsvp-panel { min-width: 0; container-type: inline-size; container-name: response; }
body .rsvp-grid { min-width: 0; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: stretch; }
body .rsvp-choice[data-rsvp] { min-width: 0; }
body .rsvp-choice[data-rsvp] > span { max-width: 100%; min-width: 0; }
body .rsvp-choice[data-rsvp] > span > span { min-width: 0; white-space: normal; overflow-wrap: break-word; }
@container response (max-width: 320px) {
  body[data-design] .rsvp-choice[data-rsvp] { min-height: 76px; padding: 8px 4px; }
  body[data-design] .rsvp-choice[data-rsvp] > span { flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.25; }
  body[data-design] .rsvp-choice[data-rsvp] > span > span { display: flex; align-items: center; justify-content: center; min-height: 2.5em; }
}

/* Never apply the old viewport-based two-column roster inside a narrow pane. */
body .match-side .roster-list.grid { grid-template-columns: minmax(0, 1fr); }
body .match-side .roster-row { min-width: 0; max-width: 100%; }
body .match-side .roster-row > .min-w-0 { overflow-wrap: anywhere; }
body .roster-filter { min-width: 0; white-space: normal; line-height: 1.3; }
body .roster-filter > b { white-space: nowrap; }
body .teams-list { min-width: 0; }
body .teams-panel { min-width: 0; }
body .teams-panel > .flex { flex-wrap: wrap; }
body .teams-panel .pitch-player-label { max-width: 100%; overflow-wrap: anywhere; }
@container match-side (max-width: 360px) {
  body .teams-list { grid-template-columns: minmax(0, 1fr); }
  body[data-design] .roster-filter { padding-inline: 3px; font-size: 12px; min-height: 48px; }
  body .roster-filter > b { display: block; }
}
@container match-side (min-width: 520px) {
  body .match-side .roster-list.grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* Older browsers keep a functional single column instead of stretching controls. */
@supports not (container-type: inline-size) {
  body .match-layout { grid-template-columns: minmax(0, 1fr); }
  body .match-main { max-width: 680px; width: 100%; }
  body .match-side { max-width: 680px; width: 100%; }
}

/* Shared navigation: retain conditional hidden tabs and the original handlers. */
body #mobile-dock-grid { width: 100%; max-width: 600px; }
body #mobile-dock-grid > .dock-btn { min-width: 0; }
body #mobile-dock-grid > .dock-btn > span { max-width: 100%; white-space: normal; line-height: 1.2; }

/* Square unfolded screens use the bottom bar. Short, sufficiently wide screens
 * and large desktop windows move this same bar to the left and reclaim height.
 * A 594px-wide landscape cover keeps its full width; no rail is shown there.
 */
@media (min-width: 1080px), (min-width: 840px) and (max-height: 600px) {
  body[data-signed-in="true"] { padding-bottom: max(24px, env(safe-area-inset-bottom)); }
  body[data-signed-in="true"] #mobile-bottom-dock {
    top: calc(var(--pp-header-height) + env(safe-area-inset-top));
    right: auto;
    bottom: 0;
    left: 0;
    width: calc(var(--pp-rail-width) + env(safe-area-inset-left));
    padding-top: 12px;
    padding-right: 0;
    padding-left: env(safe-area-inset-left);
    border-top: 0;
    border-inline-end: 1px solid var(--pp-skin-line, var(--pp-layout-line));
    border-radius: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  body[data-signed-in="true"] #mobile-dock-grid { display: flex; flex-direction: column; gap: 8px; padding: 0 6px; }
  body[data-signed-in="true"] #mobile-dock-grid > .dock-btn { width: 100%; min-height: 64px; padding: 8px 2px; }
  body[data-signed-in="true"] #app-main {
    width: calc(100% - var(--pp-rail-width) - env(safe-area-inset-left));
    max-width: none;
    margin-left: calc(var(--pp-rail-width) + env(safe-area-inset-left));
    margin-right: 0;
    padding-left: 20px !important;
    padding-right: max(20px, env(safe-area-inset-right)) !important;
  }
  body[data-signed-in="true"] #app-main > * { max-width: var(--pp-page-width); margin-left: auto; margin-right: auto; }
  body[data-signed-in="true"] #toast-root { padding-left: calc(var(--pp-rail-width) + env(safe-area-inset-left) + 12px); }
}

/* In landscape the viewport can be short even when it has ample horizontal room. */
@media (min-width: 480px) and (max-height: 480px) {
  :root { --pp-header-height: 48px; }
  body #app-main { margin-top: 10px; }
  body #mobile-active-view-title { font-size: 22px; line-height: 1.15; }
  body #nav-tabs-bar { margin-bottom: 10px; }
  body #mobile-dock-grid { padding-top: 2px; }
  body #mobile-dock-grid > .dock-btn { min-height: 44px; padding-top: 2px; padding-bottom: 2px; gap: 1px; }
  body #mobile-dock-grid > .dock-btn .ic { width: 22px; height: 22px; }
  body #mobile-bottom-dock { padding-bottom: max(4px, env(safe-area-inset-bottom)); }
}

/* Sheets use the visible viewport, including Safari's keyboard, when available.
 * JS may set --pp-visual-height / --pp-visual-top from window.visualViewport.
 * Without it, dvh (or vh on older browsers) supplies a working fallback.
 */
body .sheet-overlay {
  top: var(--pp-visual-top, 0px);
  bottom: auto;
  height: var(--pp-visual-height, var(--pp-viewport-height));
  min-height: 0;
  padding-top: max(8px, env(safe-area-inset-top));
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
body #sheet-panel {
  min-width: 0;
  max-height: calc(var(--pp-visual-height, var(--pp-viewport-height)) - max(8px, env(safe-area-inset-top)) - 8px);
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scroll-padding-block: 16px;
  container-type: inline-size;
  container-name: sheet;
}
body #sheet-panel input,
body #sheet-panel select,
body #sheet-panel textarea { min-width: 0; max-width: 100%; }
body #sheet-panel .pin-box { min-width: 0; flex: 1 1 0; max-width: 46px; }
body #sheet-panel .score-team { min-width: 0; }
body #sheet-panel .score-team button { width: 44px; min-width: 44px; min-height: 44px; }
body #sheet-panel .score-team input { width: 44px; min-width: 44px; }
body #sheet-panel .match-date-time > label { min-width: 0; }
@container sheet (max-width: 380px) {
  body #sheet-panel .match-date-time { grid-template-columns: minmax(0, 1fr); }
}
@container sheet (max-width: 359px) {
  body .score-entry { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  body .score-divider { display: none; }
}
@media (min-width: 640px) {
  body .sheet-overlay {
    padding-top: max(16px, env(safe-area-inset-top));
    padding-right: max(16px, env(safe-area-inset-right));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
  }
  body #sheet-panel { max-height: calc(var(--pp-visual-height, var(--pp-viewport-height)) - max(16px, env(safe-area-inset-top)) - max(16px, env(safe-area-inset-bottom))); }
}
@media (min-width: 480px) and (max-height: 480px) {
  body .sheet-overlay {
    align-items: center;
    padding-top: max(8px, env(safe-area-inset-top));
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    padding-left: max(8px, env(safe-area-inset-left));
    padding-right: max(8px, env(safe-area-inset-right));
  }
  body #sheet-panel {
    max-height: calc(var(--pp-visual-height, var(--pp-viewport-height)) - max(8px, env(safe-area-inset-top)) - max(8px, env(safe-area-inset-bottom)));
    padding-top: 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom)) !important;
  }
}

/* Navigation consolidation: the same match actions and setup forms, grouped by task.
 * Inline after responsive-layout.css. No visibility or permission decisions live here.
 */
body {
  --pp-erg-surface: #101a14;
  --pp-erg-subtle: #0b130f;
  --pp-erg-line: rgba(148,163,184,.22);
  --pp-erg-ink: #f1f5f9;
  --pp-erg-muted: #a4b1ab;
  --pp-erg-accent: #8de0b7;
  --pp-erg-radius: 18px;
}
body.light-mode {
  --pp-erg-surface: #fff;
  --pp-erg-subtle: #f5f7f6;
  --pp-erg-line: #dce3df;
  --pp-erg-ink: #17251e;
  --pp-erg-muted: #56675c;
  --pp-erg-accent: #047857;
}
body:is([data-design="iphone"],[data-design="android"]) {
  --pp-erg-surface: var(--pp-skin-surface);
  --pp-erg-subtle: var(--pp-skin-surface-2);
  --pp-erg-line: var(--pp-skin-line);
  --pp-erg-ink: var(--pp-skin-ink);
  --pp-erg-muted: var(--pp-skin-muted);
  --pp-erg-accent: var(--pp-skin-accent);
  --pp-erg-radius: var(--pp-skin-card-radius);
}

.ergonomic-page { width: 100%; max-width: 920px; margin-inline: auto; min-width: 0; }
body #view-container > .ergonomic-page > * + * { margin-top: 12px; }
.settings-groups { display: grid; gap: 10px; min-width: 0; }
.settings-group-label { margin: 6px 2px 0; font-size: 12px; font-weight: 700; line-height: 1.4; color: var(--pp-erg-muted); }

body .setup-disclosure {
  min-width: 0;
  max-width: 100%;
  border: 1px solid var(--pp-erg-line);
  border-radius: var(--pp-erg-radius);
  background: var(--pp-erg-surface);
  color: var(--pp-erg-ink);
}
body .setup-summary {
  display: grid;
  grid-template-columns: 22px minmax(0,1fr) auto auto;
  align-items: center;
  gap: 10px;
  min-height: 56px;
  padding: 12px 14px;
  border-radius: inherit;
  cursor: pointer;
  list-style: none;
  touch-action: manipulation;
}
.setup-summary::-webkit-details-marker { display: none; }
.setup-summary::marker { content: ""; }
.setup-icon { display: inline-flex; align-items: center; justify-content: center; width: 22px; color: var(--pp-erg-accent); }
.setup-icon .ic { width: 20px; height: 20px; }
.setup-copy { min-width: 0; }
.setup-title { display: block; font-size: 15px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.setup-hint { display: block; margin-top: 2px; font-size: 12px; line-height: 1.4; color: var(--pp-erg-muted); overflow-wrap: anywhere; }
.setup-count { font-size: 12px; font-weight: 600; line-height: 1.3; color: var(--pp-erg-muted); white-space: nowrap; }
.setup-chevron { display: inline-flex; align-items: center; justify-content: center; width: 18px; color: var(--pp-erg-muted); transition: transform .18s ease; }
.setup-chevron .ic { width: 18px; height: 18px; }
.setup-disclosure[open] > .setup-summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.setup-disclosure[open] > .setup-summary .setup-chevron { transform: rotate(180deg); }
.setup-disclosure[open] > .setup-summary { border-bottom: 1px solid var(--pp-erg-line); }
.setup-body { min-width: 0; padding: 14px; }
.setup-body > :first-child { margin-top: 0; }
.setup-body > :last-child { margin-bottom: 0; }

/* Existing renderers can retain their form controls and help buttons without
 * placing another card border and large padding inside the disclosure.
 */
body[data-design] .setup-body > .glass-card {
  background: transparent !important;
  border: 0 !important;
  border-radius: 0;
  box-shadow: none !important;
  padding: 0;
}
.setup-body :is(input,textarea,select) { min-width: 0; max-width: 100%; }

.games-tools { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; min-width: 0; }
.games-tools > .setup-disclosure { flex: 1 1 160px; }
.games-tools > .setup-disclosure[open] { flex-basis: 100%; }
.games-tools .setup-summary,
.setup-disclosure--compact > .setup-summary { min-height: 44px; padding-block: 9px; }
.games-tools .setup-title,
.setup-disclosure--compact .setup-title { font-size: 14px; }
.games-subnav {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  min-width: 0;
  padding: 8px 12px;
  border: 1px solid var(--pp-erg-line);
  border-radius: 12px;
  background: transparent;
  color: var(--pp-erg-accent);
  font-size: 13px;
  font-weight: 650;
  line-height: 1.35;
  text-align: center;
}
.games-subnav .ic { width: 18px; height: 18px; }
.game-create-actions { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,220px),1fr)); gap: 8px; margin-bottom: 16px; }
.game-create-actions > button {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  min-height: 48px;
  min-width: 0;
  padding: 10px 12px;
  border-radius: 12px;
  text-align: left;
  font-size: 14px;
  line-height: 1.35;
}
.game-create-actions > button > span { min-width: 0; overflow-wrap: anywhere; }

body .settings-account {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-width: 0;
  min-height: 72px;
  padding: 14px;
  border: 1px solid var(--pp-erg-line);
  border-radius: var(--pp-erg-radius);
  background: var(--pp-erg-surface);
  color: var(--pp-erg-ink);
  text-align: left;
}
.settings-account-copy { min-width: 0; flex: 1; }
.settings-account-copy > :is(strong,.setup-title) { display: block; margin-top: 0; font-size: 16px; line-height: 1.35; font-weight: 700; color: var(--pp-erg-ink); overflow-wrap: anywhere; }
.settings-account-copy > span { display: block; margin-top: 3px; font-size: 13px; line-height: 1.4; color: var(--pp-erg-muted); overflow-wrap: anywhere; }
.settings-account > .ic { flex-shrink: 0; color: var(--pp-erg-muted); }
.settings-page-note { font-size: 12px; line-height: 1.5; color: var(--pp-erg-muted); padding-inline: 2px; }

/* A player's status labels must not squeeze their name out of a cover screen.
 * The original four children and click handler remain unchanged, including
 * when search replaces just the result rows.
 */
#players-directory { min-width: 0; container-type: inline-size; container-name: players-directory; }
@container players-directory (max-width: 560px) {
  body #players-results > button {
    display: grid;
    grid-template-columns: 32px minmax(0,1fr) 18px;
    align-items: center;
    gap: 4px 10px;
    min-width: 0;
  }
  body #players-results > button > span:first-child { grid-column: 1; grid-row: 1; }
  body #players-results > button > span.min-w-0 { grid-column: 2; grid-row: 1; }
  body #players-results > button > span:last-of-type {
    grid-column: 2 / -1;
    grid-row: 2;
    min-width: 0;
    max-width: 100%;
    flex-wrap: wrap;
    gap: 4px;
  }
  body #players-results > button > span:last-of-type:empty { display: none; }
  body #players-results > button > svg:last-child { grid-column: 3; grid-row: 1; width: 18px; }
}

/* Different materials keep the three styles identifiable without adding
 * permanent setup navigation or decorative dashboard tiles.
 */
body[data-design="iphone"] .setup-summary { padding-inline: 14px; }
body[data-design="iphone"] .setup-disclosure { border-radius: 14px; }
body[data-design="iphone"] .setup-title { font-weight: 650; }
body[data-design="iphone"] .settings-account { border-radius: 16px; }
body[data-design="android"] .setup-disclosure { border-radius: 22px; }
body[data-design="android"] .setup-summary { padding-inline: 16px; }
body[data-design="android"] .setup-disclosure[open] > .setup-summary { background: var(--pp-erg-subtle); }
body[data-design="android"] .games-subnav { border-radius: 999px; background: var(--pp-erg-subtle); border-color: transparent; }
body[data-design="android"] .game-create-actions > button { border-radius: 20px; }

@media (max-width: 379px) {
  body .setup-summary { gap: 8px; padding-inline: 11px; }
  .setup-title { font-size: 14px; }
  .setup-count { max-width: 78px; white-space: normal; text-align: right; }
  .setup-body { padding: 11px; }
  .settings-account-copy > :is(strong,.setup-title) { font-size: 15px; }
  .games-subnav { padding-inline: 10px; }
}
@media (min-width: 640px) {
  .setup-body { padding: 18px; }
}
@media (hover:hover) and (pointer:fine) {
  .setup-summary:hover,
  body .settings-account:hover,
  .games-subnav:hover { background: var(--pp-erg-subtle); }
}

  <script>
    // Restore this account's local skin before the first paint. A missing/invalid session uses Generic.
    (function () {
      var design = "generic", motion = "expressive", signedIn = false;

          if (["generic", "iphone", "android"].indexOf(saved.design) !== -1) design = saved.design;

        }
      } catch (e) {}
      var reduced = motion === "reduced" || !window.matchMedia || window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      document.body.setAttribute("data-design", design);
      document.body.setAttribute("data-signed-in", String(signedIn));
      document.body.setAttribute("data-standalone", String(!!navigator.standalone || !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)));

    function profileParticipationText(profile) {
      return F("featAttendance") ? t("verifiedMatchesN",{n:Number(profile.verifiedGamesPlayed)||0}) : t("signupsN",{n:Number(profile.rsvpGamesCount)||0});
    }
    function reliabilityText(profile) {
      const n=profile && profile.reliability, count=Number(profile && profile.reliabilitySampleCount || 0);
      return n===null || n===undefined || !count ? t("noReliability") : t("reliabilityMeasured",{n:n,count:count});
    }
    function isGameSaving(id) { return !!pendingGameChanges[String(id)]; }
    function gameMeta(game) {
      const roster = game.roster || [];
      const me = myEmail();
      const myEntry = roster.find(function(r) { return r.email === me; }) || null;
      const yesList = roster.filter(function(r) { return r.status === "Yes"; });
      const waitlist = roster.filter(function(r) { return r.status === "Waitlist"; });
      const maybeList = roster.filter(function(r) { return r.status === "Maybe"; });
      const noList = roster.filter(function(r) { return r.status === "No"; });
      const isCancelled = String(game.Status) === "Cancelled";
      const yesCount = Number(game.yesCount || 0), maxCap = Number(game.MaxCap || S().defaultMax), minThreshold = Number(game.MinThreshold || S().defaultMin);
      const isGameCaptain = !!(currentUser && gf(game, "captains") && game.captainEmail && game.captainEmail === me);
      const canManage = !!(currentUser && (currentUser.isAdmin || isGameCaptain));
      const locked = !!game.rsvpLocked;
      const kickedOff = hasKickedOff(game);
      const pendingReconfirmCount = Number(game.pendingReconfirmCount !== undefined ? game.pendingReconfirmCount : yesList.reduce(function(n,r){return n+(r.needsReconfirm?1+(r.guestNames||[]).length:0);},0));
      const confirmedCount = Number(game.confirmedCount !== undefined ? game.confirmedCount : Math.max(0,yesCount-pendingReconfirmCount));
      return {
        roster, myEntry, myStatus: myEntry ? myEntry.status : "", yesList, waitlist, maybeList, noList, isCancelled,
        yesCount, confirmedCount, pendingReconfirmCount, maxCap, minThreshold, isFull: yesCount >= maxCap, isConfirmed: !isCancelled && confirmedCount >= minThreshold,
        myWaitPos: myEntry && myEntry.status === "Waitlist" ? waitlist.findIndex(function(r) { return r.email === me; }) + 1 : 0,
        isGameCaptain, canManage, locked, lockReason: game.lockReason || "", kickedOff,
        ended: isGameDisplayFinished(game),
        isSysAdmin: currentUser && isSystemAdminOnly(currentUser.email),
        mySide: myTeamSide(game, me)
      };
    }
    function myTeamSide(game, em) {
      if (!game.teams || !em) return "";
      if ((game.teams.white || []).some(function(p) { return p.email === em; })) return "white";
      if ((game.teams.dark || []).some(function(p) { return p.email === em; })) return "dark";
      return "";
    }
    function statusPill(game, m) {
      let cls = "bg-amber-500/20 text-amber-300 border border-amber-500/40", txt = t("pillNeeds", { n: Math.max(0, m.minThreshold - m.confirmedCount) });
      if (m.isCancelled) { cls = "bg-rose-500/20 text-rose-300 border border-rose-500/40"; txt = t("pillCancelled"); }
      else if (game.hasScore) { cls = "bg-slate-800 text-slate-200"; txt = t("pillFinal"); }
      else if (m.kickedOff && m.ended) { cls = "bg-slate-800 text-slate-200"; txt = t("pillFinished"); }
      else if (m.kickedOff) { cls = m.isConfirmed ? "bg-rose-500/20 text-rose-300 border border-rose-500/40" : "bg-amber-500/20 text-amber-300 border border-amber-500/40"; txt = m.isConfirmed ? t("pillLive") : t("pillNotConfirmed"); }
      else if (m.isFull) { cls = "bg-sky-500/20 text-sky-300 border border-sky-500/40"; txt = m.waitlist.length ? t("pillFull", { n: m.waitlist.length }) : t("pillFullNoWait"); }
      else if (m.isConfirmed) { cls = "bg-[#00f59b]/20 text-[#00f59b] border border-[#00f59b]/40"; txt = t("pillOn"); }
      return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-extrabold uppercase tracking-wide ${cls}"><span class="status-dot"></span>${escHtml(txt)}</span>`;
    }
    function myStatusChip(m) {
      if (m.isSysAdmin) return "";

      });

      if (!upcoming.length) {

              <div class="text-sm font-extrabold text-white whitespace-nowrap">${w.icon} ${escHtml(w.text)}</div>
              ${w.sub ? `<div class="text-[11px] text-emerald-300 whitespace-nowrap">${escHtml(w.sub)}</div>` : ""}
              ${w.heat ? `<div class="text-[11px] font-bold text-amber-300">${escHtml(t("heatAlert"))}</div>` : ""}
            </div>` : ""}
          </div>
        </div>`;

      if (m.isCancelled) {
        html += `<div class="mt-4 bg-rose-950/80 p-3.5 rounded-2xl border border-rose-600/60 text-sm font-bold text-rose-200 flex gap-2">${ic("ban", "w-5 h-5 shrink-0")}<div>${escHtml(t("cancelledNotice"))}${m.canManage && currentUser.isAdmin ? `<div class="font-semibold mt-1 text-rose-300">${escHtml(t("cancelledAdminHint"))}</div>` : ""}</div></div>`;
      } else {
        if (m.mySide) {
          const shirt = teamShirt(m.mySide);
          const dark = ["white", "yellow", "gray"].indexOf(shirt) === -1;
          html += `<div class="shirt-banner mt-4 rounded-2xl p-3.5 flex items-center gap-3" style="background:${SHIRT_HEX[shirt] || "#fff"};color:${dark ? "#ffffff" : "#0f172a"}">
            ${ic("shirt", "w-6 h-6")}
            <div class="text-sm font-extrabold uppercase leading-snug">${escHtml(t("youAreOn", { team: teamLabel(m.mySide), shirt: shirtName(shirt) }))}</div></div>`;
        }
        if (game.ScheduleChangeSummary && !m.locked) {
          html += `<div class="mt-3 p-3 rounded-2xl bg-amber-500/10 border border-amber-500/40 text-sm text-amber-300 font-semibold flex gap-2">${ic("bell", "w-5 h-5 shrink-0")}<div><b>${escHtml(t("scheduleUpdate"))}</b> ${escHtml(game.ScheduleChangeSummary)}</div></div>`;
        }
        html += `<div class="match-turnout mt-4">
            <div class="flex items-end justify-between gap-2 mb-1.5">
              <div class="text-base font-extrabold text-white">${m.yesCount}/${m.maxCap} <span class="text-sm font-semibold text-slate-400">${escHtml(t(m.pendingReconfirmCount ? "spotsReserved" : "playersIn"))}</span></div>
              <div class="text-sm font-semibold text-slate-400">${escHtml(t("spotsLeft",{n:Math.max(0,m.maxCap-m.yesCount)}))}</div>
            </div>
            <div class="relative h-2.5 rounded-full bg-slate-800 overflow-hidden" role="progressbar" aria-valuemin="0" aria-valuemax="${m.maxCap}" aria-valuenow="${m.yesCount}" aria-label="${escHtml(t("playersIn"))}">
              <div class="h-full rounded-full bg-[#00f59b]" style="width:${capPct}%"></div>
              <div class="absolute top-0 bottom-0 w-1 bg-amber-400" style="left:calc(${minPct}% - 2px)"></div>
            </div>
            <div class="text-xs text-slate-400 mt-1.5">${m.pendingReconfirmCount ? escHtml(t("confirmedN",{n:m.confirmedCount}))+" · "+escHtml(t("pendingReconfirmN",{n:m.pendingReconfirmCount}))+" · " : ""}${escHtml(t("capLine", { min: m.minThreshold, max: m.maxCap }))}${m.waitlist.length ? " · " + escHtml(t("waitlistN", { n: m.waitlist.length })) : ""}</div>
          </div>`;
        html += renderRsvpBlock(game, m);
      }


      const cal = F("featCalendar");
      html += `<div class="match-secondary-actions mt-4 grid ${cal ? "grid-cols-2" : "grid-cols-1"} gap-2">
          <button type="button" onclick="openDirectionsSheet('${escJsArg(id)}')" class="tap-lg press rounded-2xl bg-[#111c16] border border-emerald-900/60 text-white font-bold text-sm inline-flex items-center justify-center gap-2">${ic("nav", "w-[18px] h-[18px] text-emerald-300")}${escHtml(t("directions"))}</button>
          ${cal ? `<button type="button" onclick="openCalendarShareSheet('${escJsArg(id)}')" class="tap-lg press rounded-2xl bg-[#111c16] border border-emerald-900/60 text-white font-bold text-sm inline-flex items-center justify-center gap-2">${ic("calendar", "w-[18px] h-[18px] text-emerald-300")}${escHtml(t("calShareBtn"))}</button>` : ""}
        </div>`;
      if (m.canManage) {
        html += `<button type="button" onclick="openOrganizerTools('${escJsArg(id)}')" class="tap-lg press w-full mt-2 rounded-2xl bg-amber-500/20 text-amber-300 border border-amber-500/40 font-extrabold text-base inline-flex items-center justify-center gap-2">${ic("bolt", "w-5 h-5")}<span>${escHtml(t("organizerTools"))}${m.isGameCaptain ? " · " + escHtml(t("youAreCaptain")) : ""}</span></button>`;
      }
      if (m.canManage && game.adminActivity && game.adminActivity.length) {
        html += `<details class="mt-3 text-sm text-slate-400">
          <summary class="tap flex items-center gap-2 cursor-pointer font-semibold">${ic("clock", "w-4 h-4 shrink-0")}<span class="truncate">${escHtml(t("latestAction"))}: <b>${escHtml(game.adminActivity[0].actor)}</b> — ${escHtml(game.adminActivity[0].summary)}</span></summary>
          <div class="mt-1 space-y-1.5 pl-3 border-l-2 border-emerald-900 text-[13px]">${game.adminActivity.map(function(a) { return `<div><b>${escHtml(a.actor)}:</b> ${escHtml(a.summary)} <span class="text-slate-500">(${escHtml(a.timestamp)})</span></div>`; }).join("")}</div>
        </details>`;
      }
      html += `</div><div class="match-side">${sideHtml}</div></div></article>`;
      return html;
    }

    function shirtName(key) { return t("shirt_" + (key || "white")); }

    function renderRsvpBlock(game, m) {
      const id = String(game.GameID);
      if (m.isSysAdmin) {
        return `<div class="mt-4 bg-amber-500/10 p-3.5 rounded-2xl border border-amber-500/40 text-sm text-amber-300"><b>${escHtml(t("sysAdminTitle"))}</b> ${escHtml(t("sysAdminSub"))}</div>`;
      }
      if (m.locked) {
        const msg = m.lockReason === "scored" ? t("lockedScored") : t("lockedPast");
        const score = game.hasScore ? `<div class="mt-1.5 text-base font-extrabold text-white flex items-center gap-1.5">${ic("trophy", "w-5 h-5 text-amber-300")}${escHtml(teamLabel("white"))} ${escHtml(game.ScoreWhite)} – ${escHtml(game.ScoreDark)} ${escHtml(teamLabel("dark"))}</div>` : "";
        return `<div class="mt-4 bg-[#0b130f] p-3.5 rounded-2xl border border-emerald-950 text-sm text-slate-300"><div class="flex items-center gap-1.5">${ic("lock", "w-4 h-4")}${escHtml(msg)}</div>${score}
          <div class="mt-1 text-slate-400">${escHtml(t("yourAnswer"))}: <b class="text-white">${escHtml(statusWord(m.myStatus))}</b></div></div>`;
      }
      const attention = rsvpReplyState(game, m);
      let html = `<div class="rsvp-panel mt-4" data-game-id="${escHtml(id)}" data-attention="${attention}">`;
      if (m.myEntry && m.myEntry.needsReconfirm) {
        const keep = m.myStatus === "Maybe" ? "Maybe" : "Yes";
        html += `<div class="mb-3 p-3 rounded-2xl bg-amber-500/20 border border-amber-500/40 text-amber-300 text-sm">
          <b>${escHtml(t("reconfirmHint"))}</b>
          <div class="grid grid-cols-2 gap-2 mt-2">
            <button type="button" onclick="onRsvpTap('${escJsArg(id)}','${keep}')" class="tap rounded-xl neon-btn text-sm">${escHtml(keep === "Maybe" ? t("stillMaybe") : t("stillIn"))}</button>
            <button type="button" onclick="onRsvpTap('${escJsArg(id)}','No')" class="tap rounded-xl bg-rose-950 text-rose-300 font-bold text-sm">${escHtml(t("cantMakeIt"))}</button>
          </div></div>`;
      }
      if(m.ended && !m.locked) html += `<div class="mb-3 p-3 rounded-2xl bg-slate-800 text-sm text-slate-300">${escHtml(t("finishedAnswers"))}</div>`;
      if (m.kickedOff && !m.ended) {
        html += `<div class="mb-3 p-3 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-sm text-rose-300 font-semibold flex gap-2">${ic("pulse", "w-5 h-5 shrink-0")}<span>${escHtml(gf(game, "scores") ? t("liveNotice") : t("liveNoticeOpen"))}</span></div>`;
      }
      // Waiting but a spot is free (it can happen once the match has started): offer "I'm in".
      const waitingFull = m.myStatus === "Waitlist" && m.isFull;
      const yesLabel = m.myStatus === "Yes" ? t("rsvpIn") : (waitingFull ? t("rsvpWaitPos", { n: m.myWaitPos }) : (m.isFull && m.myStatus !== "Waitlist" ? t("rsvpJoinWait") : t("rsvpIn")));
      const btn = function(status, icon, label, count, onCls) {
        const on = m.myStatus === status || (status === "Yes" && waitingFull);
        return `<button type="button" onclick="onRsvpTap('${escJsArg(id)}','${status}')" data-rsvp="${status}" aria-pressed="${on}" ${isGameSaving(id) ? "disabled" : ""} class="rsvp-choice tap-lg press rounded-2xl font-extrabold flex flex-col items-center justify-center gap-0.5 px-1 py-2 border ${on ? onCls : "seg-off"}">
          <span class="inline-flex items-center justify-center gap-1.5 text-[15px] leading-tight text-center">${ic(icon, "w-[18px] h-[18px]", 2.6)}<span>${escHtml(label)}</span></span></button>`;
      };
      html += `<div class="rsvp-heading text-sm font-bold text-white mb-2">${escHtml(t(m.ended ? "correctAnswer" : "yourAnswer"))}${attention ? `<span class="rsvp-attention-label">${escHtml(t(attention === "reconfirm" ? "replyReconfirm" : "replyNeeded"))}</span>` : ""}</div>
        <div class="rsvp-grid grid grid-cols-3 gap-2" role="group" aria-label="${escHtml(t("rsvpPrompt"))}">
          ${btn("Yes", waitingFull || (m.isFull && m.myStatus !== "Yes") ? "hourglass" : "check", yesLabel, m.yesCount + "/" + m.maxCap, m.myStatus === "Waitlist" ? "bg-sky-500 text-white border-sky-400" : "bg-[#00f59b] text-[#070b09] border-[#00f59b]")}
          ${btn("Maybe", "help", t("rsvpMaybe"), m.maybeList.length, "bg-amber-400 text-[#070b09] border-amber-400")}
          ${btn("No", "x", t("rsvpOut"), m.noList.length, "bg-rose-500 text-white border-rose-500")}
        </div>
        <p class="rsvp-status text-sm text-slate-300 mt-2" role="status">${escHtml(isGameSaving(id) ? t("savingAnswer") : myStatusSentence(m))}</p>`;
      if (m.myStatus === "Yes" && m.myEntry) html += renderMyExtras(game, m);
      html += `</div>`;
      return html;
    }
    function statusWord(st) {
      return { Yes: t("statusYes"), Maybe: t("statusMaybe"), No: t("statusNo"), Waitlist: t("statusWaitlist") }[st] || t("statusNone");
    }
    function myStatusSentence(m) {
      if(m.myStatus === "Yes" && m.myEntry && m.myEntry.needsReconfirm) return t("reservedReconfirm");
      if (m.myStatus === "Yes") return m.mySide ? t("sentInTeam", { team: teamLabel(m.mySide) }) : t("sentIn");
      if (m.myStatus === "Waitlist") return m.isFull ? t("sentWaitlist", { n: m.myWaitPos }) : t("spotOpenWaitlist");
      if (m.myStatus === "Maybe") return t("sentMaybe");
      if (m.myStatus === "No") return t("sentOut");
      return m.isFull ? t("sentFull") : t("sentNone");
    }

    // Guests are on unless the league sets 0 or an admin blocked them for this player.
    function myGuestsAllowed() {
      const profile = profileFor(myEmail()) || {};
      return maxGuests() > 0 && !(currentUser.canBringGuests === false || profile.canBringGuests === false);
    }
    function renderMyExtras(game, m) {
      const id = String(game.GameID), e = m.myEntry;
      const ball = gf(game, "ball"), pinnies = gf(game, "pinnies"), gk = gf(game, "gk"), arrival = gf(game, "arrival");
      const guestsAllowed = myGuestsAllowed();
      if (!ball && !pinnies && !gk && !arrival && !guestsAllowed && !(e.guestNames||[]).length) return "";
      const pill = function(field, on, icon, label) {
        return `<button type="button" onclick="toggleSignupExtra('${escJsArg(id)}','${field}',${!on})" aria-pressed="${on}" class="tap press px-3.5 rounded-full border font-bold text-sm inline-flex items-center gap-1.5 ${on ? "bg-emerald-950 text-[#00f59b] border-[#00f59b]/60" : "seg-off"}">${ic(on ? "check" : icon, "w-4 h-4", on ? 2.8 : 2)}${escHtml(label)}</button>`;
      };
      const guests = e.guestNames || [];
      let html = `<div class="mt-3 pt-3 border-t border-emerald-950">`;
      if (ball || pinnies || gk) {
        html += `<div class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">${escHtml(t("bringingTitle"))}</div><div class="flex flex-wrap gap-2">`;
        if (ball) html += pill("bringBall", !!e.bringBall, "ball", t("gearBall"));
        if (pinnies) html += pill("bringPinnies", !!e.bringPinnies, "vest", t("gearPinnies"));
        if (gk) html += pill("playGK", !!e.playGK, "glove", t("gearGK"));
        html += `</div>`;
      }
      if (arrival || guestsAllowed || guests.length) {
        const left = arrival
          ? `${ic("clock", "w-[18px] h-[18px] text-emerald-300")}<span class="truncate">${escHtml(timingLabel(e.availabilityNote || ""))}</span>`
          : `${ic("users", "w-[18px] h-[18px] text-emerald-300")}<span class="truncate">${escHtml(guests.length ? (maxGuests() >= guests.length ? t("guestsCount", { n: guests.length, max: maxGuests() }) : t("existingGuests")+" ("+guests.length+")") : t("addGuestsBtn"))}</span>`;
        const right = arrival && guestsAllowed ? `${ic("users", "w-4 h-4")}${escHtml((maxGuests() >= guests.length ? t("guestsCount", { n: guests.length, max: maxGuests() }) : t("existingGuests")+" ("+guests.length+")"))}` : "";
        html += `<button type="button" onclick="openMyMatchSheet('${escJsArg(id)}')" class="tap-lg press w-full ${ball || pinnies || gk ? "mt-2.5" : ""} px-4 rounded-2xl bg-[#111c16] border border-emerald-900/60 flex items-center justify-between gap-3 text-left">
          <span class="text-sm font-bold text-white min-w-0 flex items-center gap-2">${left}</span>
          <span class="text-sm font-bold text-emerald-300 whitespace-nowrap inline-flex items-center gap-1">${right}${ic("chevRight", "w-4 h-4 text-slate-400", 2.4)}</span>
        </button>`;
      }
      if (guests.length) html += `<div class="text-sm text-emerald-300 mt-1.5 flex items-center gap-1.5">${ic("users", "w-4 h-4")}<span>${escHtml(guests.join(", "))}</span></div>`;
      html += `</div>`;
      return html;
    }

    function renderTeamsPanel(game, m) {
      const id = String(game.GameID);
      const me = myEmail();
      const col = function(side) {
        const list = game.teams[side] || [];
        return `<div class="bg-[#111c16] rounded-2xl border border-emerald-950 p-2.5 min-w-0">
          <div class="flex items-center gap-2 mb-2">${shirtDot(teamShirt(side))}<span class="text-sm font-extrabold text-white truncate">${escHtml(teamLabel(side))}</span><span class="text-xs text-slate-400 ml-auto">${list.length}</span></div>
          <ul class="space-y-1">${list.map(function(p) {
            const mine = p.email && p.email === me;
            return `<li class="flex items-center gap-1.5 text-[13px] rounded-lg px-1 py-0.5 ${mine ? "bg-emerald-950 font-extrabold" : ""}"><span class="truncate ${mine ? "text-[#00f59b]" : "text-slate-200"}">${escHtml(p.fullName)}</span><span class="ml-auto text-[10px] font-mono text-slate-400">${escHtml(p.isGuest ? t("guestTag") : p.position)}</span></li>`;
          }).join("") || `<li class="text-[13px] text-slate-500 italic">—</li>`}</ul></div>`;
      };
      const score = game.hasScore ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-emerald-950 text-[#00f59b] text-xs font-extrabold">${ic("trophy", "w-3.5 h-3.5")}${escHtml(game.ScoreWhite)} – ${escHtml(game.ScoreDark)}</span>` : "";
      return `<section class="teams-panel mt-4">
        <div class="flex items-center justify-between gap-2 mb-2">
          <h3 class="text-sm font-extrabold uppercase tracking-wide text-[#00f59b] inline-flex items-center gap-1.5">${ic("shirt", "w-4 h-4")}${escHtml(t("teamsTitle"))}</h3>
          <div class="flex items-center gap-2">${score}<button type="button" onclick="togglePitch('${escJsArg(id)}')" class="tap px-3 rounded-xl bg-[#111c16] border border-emerald-900/60 text-xs font-bold text-emerald-300 inline-flex items-center gap-1.5">${ic("field", "w-4 h-4")}${escHtml(openPitchByGame[id] ? t("hidePitch") : t("pitchView"))}</button></div>
        </div>
        ${openPitchByGame[id] ? render2dPitch(game) : `<div class="teams-list grid grid-cols-2 gap-2">${col("white")}${col("dark")}</div>`}
        ${m.canManage && game.teamsStale ? `<div class="mt-2 text-xs font-semibold text-amber-300">${escHtml(t("teamsChangedHint"))}</div>` : ""}
      </section>`;
    }
    function togglePitch(id) { openPitchByGame[id] = !openPitchByGame[id]; renderCurrentTab(); const card=byId("game-"+id); if(card)animateNavigationSurface(card.querySelector(".teams-panel"), "filter"); }
    function render2dPitch(game) {
      const pills = function(list) {
        return list.map(function(p) {
          return `<span class="pitch-player-label inline-flex items-center gap-1 px-2 py-1 rounded-full bg-black/55 border border-white/30 text-white text-xs font-bold">${escHtml(p.fullName)}<span class="text-[9px] opacity-80 font-mono">${escHtml(p.isGuest ? t("guestTag") : p.position)}</span></span>`;
        }).join("");
      };
      return `<div class="soccer-pitch-bg rounded-2xl p-4 text-white">
        <div class="relative z-10 text-center">
          <div class="text-xs uppercase tracking-widest font-extrabold mb-2 flex items-center justify-center gap-1.5">${shirtDot(teamShirt("white"))} ${escHtml(teamLabel("white"))}</div>
          <div class="flex flex-wrap justify-center gap-1.5 mb-6">${pills(game.teams.white)}</div>
          <div class="flex flex-wrap justify-center gap-1.5 mt-6">${pills(game.teams.dark)}</div>
          <div class="text-xs uppercase tracking-widest font-extrabold mt-2 flex items-center justify-center gap-1.5">${shirtDot(teamShirt("dark"))} ${escHtml(teamLabel("dark"))}</div>
        </div></div>`;
    }

    function renderAnnouncements(game, m) {
      if (!gf(game, "announcements")) return "";
      const isAdmin = !!(currentUser && currentUser.isAdmin);
      const list = (game.blasts || []).filter(function(b) { return isAdmin || !b.hidden; }).slice().reverse();
      if (!list.length) return "";
      const item = function(b) {
        return `<div class="p-3 rounded-2xl border ${b.hidden ? "border-amber-500/40 bg-amber-500/10" : "border-emerald-950 bg-[#111c16]"}">
          <div class="flex items-center justify-between gap-2 mb-1">
            <span class="text-sm font-bold text-white truncate">${escHtml(b.senderName)} <span class="text-xs font-normal text-slate-400">· ${escHtml(b.timestamp || "")}</span></span>
            ${isAdmin ? `<button type="button" onclick="toggleBlastVisibility('${escJsArg(b.blastId)}', ${!b.hidden})" class="tap px-3 rounded-xl bg-slate-800 text-xs font-bold text-slate-200 shrink-0">${escHtml(b.hidden ? t("show") : t("hide"))}</button>` : ""}
          </div>
          <div class="text-sm text-slate-200 whitespace-pre-wrap leading-relaxed">${escHtml(b.message)}</div></div>`;
      };
      return `<section class="mt-4">
        <h3 class="text-sm font-extrabold uppercase tracking-wide text-[#00f59b] mb-2 inline-flex items-center gap-1.5">${ic("megaphone", "w-4 h-4")}${escHtml(t("announcements"))}</h3>
        <div class="space-y-2">${item(list[0])}</div>
        ${list.length > 1 ? `<details class="mt-2"><summary class="tap flex items-center text-sm font-bold text-emerald-300 cursor-pointer">${escHtml(t("showOlder", { n: list.length - 1 }))}</summary><div class="space-y-2 mt-1">${list.slice(1).map(item).join("")}</div></details>` : ""}
      </section>`;
    }

    // Player cards open when there's something to show: standings, or an admin looking.
    function playerCardsOpen() { return standingsOn() || !!(currentUser && currentUser.isAdmin); }
    function toggleRosterExpanded(gameId) { expandedRosterByGame[gameId]=!expandedRosterByGame[gameId];renderCurrentTab(); animateNavigationSurface(byId("roster-panel-" + gameId), "filter"); }
    function setRosterSubTab(gameId, sub) { triggerHaptic(); rosterSubTabByGame[gameId] = sub; renderCurrentTab(); animateNavigationSurface(byId("roster-panel-" + gameId), "filter"); }
    function renderRosterTabs(game, m) {
      const id = String(game.GameID);
      const active = rosterSubTabByGame[id] || "yes";
      const teamsOn = gf(game, "teams"), arrival = gf(game, "arrival");
      const fBall = gf(game, "ball"), fPin = gf(game, "pinnies"), fGk = gf(game, "gk");
      const cards = playerCardsOpen();
      // the waitlist tab only appears when someone is actually waiting
      const showWait = m.waitlist.length > 0 || active === "waitlist";
      const tab = function(key, icon, label, n) {
        return `<button type="button" role="tab" id="roster-tab-${escHtml(id)}-${key}" aria-controls="roster-panel-${escHtml(id)}" onclick="setRosterSubTab('${escJsArg(id)}','${key}')" aria-selected="${active===key}" class="roster-filter">${escHtml(label)} <b>${n}</b></button>`;
      };
      const row = function(r, i) {
        const pos = r.playPosition || effectivePos(r.position, r.playGK, game);
        const gear = (fBall && r.bringBall ? ic("ball", "w-3.5 h-3.5 text-emerald-300") : "") + (fPin && r.bringPinnies ? ic("vest", "w-3.5 h-3.5 text-emerald-300") : "") + (fGk && r.playGK ? ic("glove", "w-3.5 h-3.5 text-amber-300") : "");
        const inner = `${renderAvatarBadge(r.fullName, teamsOn ? pos : "")}
          <span class="min-w-0 flex-1"><span class="flex items-center gap-1 text-sm font-bold text-white min-w-0"><span class="truncate">${i !== undefined ? (i + 1) + ". " : ""}${escHtml(r.fullName)}</span>${teamsOn ? ` <span class="text-[11px] font-mono text-slate-400 shrink-0">${escHtml(pos)}</span>` : ""}${gear ? `<span class="inline-flex gap-0.5 shrink-0">${gear}</span>` : ""}</span>
          ${r.needsReconfirm ? `<span class="block text-xs text-amber-300">${escHtml(t("awaitingReconfirm"))}</span>` : ""}${r.attendanceStatus === "NoShow" ? `<span class="block text-xs text-rose-300">${escHtml(t("noShowLabel"))}</span>` : ""}
          ${r.guestNames && r.guestNames.length ? `<span class="block text-xs text-emerald-300">+${r.guestNames.length}: ${escHtml(r.guestNames.join(", "))}</span>` : ""}
          ${arrival && r.availabilityNote ? `<span class="block text-xs text-amber-300 truncate">${escHtml(timingLabel(r.availabilityNote))}</span>` : ""}</span>`;
        return cards
          ? `<button type="button" onclick="openPlayerCareerModal('${escJsArg(r.email)}')" class="roster-row tap w-full text-left p-2 rounded-xl bg-[#111c16] border border-emerald-950 flex items-center gap-2.5">${inner}</button>`
          : `<div class="roster-row w-full p-2 min-h-[44px] rounded-xl bg-[#111c16] border border-emerald-950 flex items-center gap-2.5">${inner}</div>`;
      };

        document.head.appendChild(css);

        js.onload = function() { resolve(window.L); };

    // Street map or satellite photo (Esri World Imagery, with place names on top). The choice is
    // remembered on this phone: players start on the street map, the admin field picker on satellite.
    const MAP_STYLE_DEFAULTS = { directions: "map", picker: "satellite" };
    function mapStylePref(kind) {
      const v = lsGet("soccer_map_style_" + kind, MAP_STYLE_DEFAULTS[kind] || "map");
      return v === "satellite" ? "satellite" : "map";
    }
    function addMapStyleSwitch(L, map, kind) {
      const layers = {
        map: L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }),
        satellite: L.layerGroup([
          L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics" }),
          L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 })
        ])
      };
      let current = mapStylePref(kind);
      layers[current].addTo(map);
      const Switch = L.Control.extend({
        options: { position: "topright" },
        onAdd: function() {
          const box = L.DomUtil.create("div", "map-style-switch");
          box.setAttribute("role", "group");
          box.setAttribute("aria-label", t("mapStyleLabel"));
          box.innerHTML = ["map", "satellite"].map(function(k) {
            return `<button type="button" data-style="${k}" aria-pressed="${k === current}">${escHtml(k === "map" ? t("mapStyleMap") : t("mapStyleSatellite"))}</button>`;
          }).join("");
          // Taps on the switch must never reach the map: on the field picker a map tap moves the pin.
          // (The buttons stay in place and only their pressed state changes, so Leaflet can always
          // tell the tap started on a control.)
          L.DomEvent.disableClickPropagation(box);
          L.DomEvent.disableScrollPropagation(box);
          L.DomEvent.on(box, "click", function(e) {
            L.DomEvent.stop(e);
            const b = e.target && e.target.closest ? e.target.closest("button[data-style]") : null;
            if (!b) return;
            const next = b.getAttribute("data-style");
            if (next === current) return;
            map.removeLayer(layers[current]);
            layers[next].addTo(map);
            current = next;
            lsSet("soccer_map_style_" + kind, next);
            triggerHaptic();
            box.querySelectorAll("button[data-style]").forEach(function(x) { x.setAttribute("aria-pressed", String(x.getAttribute("data-style") === current)); });
          });
          return box;
        }
      });
      new Switch().addTo(map);
    }

    async function saveMyMatchSheet(gameId) {
      const g=findGame(gameId);if(!g)return;const m=gameMeta(g),oldGuests=m.myEntry.guestNames||[];
      const checked=document.querySelector('input[name="mm-timing"]:checked'),noteEditable=!!document.querySelector('input[name="mm-timing"]');
      const newNote=checked?checked.value:"";
      const inputs=Array.from(document.querySelectorAll('[id^="mm-guest-"]'));
      const keep=Array.from(document.querySelectorAll('input[name="mm-keep-guest"]'));
      const guestsEditable=inputs.length>0||keep.length>0;
      const newGuests=inputs.length?inputs.map(function(el){return el.value.replace(/,/g," ").trim();}).filter(Boolean):keep.filter(function(el){return el.checked;}).map(function(el){return oldGuests[Number(el.value)];});
      const guestsChanged=guestsEditable&&JSON.stringify(newGuests)!==JSON.stringify(oldGuests),noteChanged=noteEditable&&newNote!==(m.myEntry.availabilityNote||"");
      if(!guestsChanged&&!noteChanged){closeModal();return;}
      if(inFlight["mm-"+gameId])return;
      setBusyButton("mm-save",true);
      await runAction("mm-"+gameId,async function(){
        const updates=[];if(guestsChanged)updates.push(["guestNames",newGuests]);if(noteChanged)updates.push(["availabilityNote",newNote]);
        for(const update of updates){
          const res=await apiPost({action:"updateSignupExtras",gameId:gameId,field:update[0],value:update[1]});
          if(res&&res.staleAuth)return;
          if(!res||!res.success){if(res&&res.uncertain)await reconcileUncertainSave();showToast(res&&res.error||t("errNetwork"),true);return;}
          setAppData(res);
        }
        closeModal();showToast(t("saved"));renderCurrentTab();
      }).finally(function(){setBusyButton("mm-save",false);});
    }

    function buildGoogleCalendarUrl(game) {
      const c=calTimes(game),addr=(game.locationDetails&&game.locationDetails.address)||game.LocationName;

    function buildIcsCalendar(game) {
      const c=calTimes(game),addr=(game.locationDetails&&game.locationDetails.address)||game.LocationName;

    function bumpScore(side, d) {

    function readScoreValue(value) {

    function getPinVal() { return [0, 1, 2, 3, 4, 5].map(function(i) { const b = byId("pin-box-" + i); return b ? b.value.trim() : ""; }).join(""); }
    function onPinInput(idx, e) {
      const v = e.target.value.replace(/[^0-9]/g, "");
      // iOS/Android can fill the whole code into one box (paste or autofill): spread it out
      if (v.length > 1) {
        for (let i = 0; i < 6; i++) { const bx = byId("pin-box-" + i); if (bx && i >= idx) bx.value = v[i - idx] || ""; }
        if (getPinVal().length === 6) doLogin();
        return;
      }
      e.target.value = v.slice(-1);
      if (e.target.value && idx < 5) { const n = byId("pin-box-" + (idx + 1)); if (n) n.focus(); }
      if (getPinVal().length === 6) doLogin();
    }
    function onPinKey(idx, e) {
      if (e.key === "Backspace" && !e.target.value && idx > 0) { const p = byId("pin-box-" + (idx - 1)); if (p) p.focus(); }
      if (e.key === "Enter") doLogin();
    }
    function onPinPaste(e) {
      const p = (e.clipboardData || window.clipboardData).getData("text").replace(/[^0-9]/g, "").slice(0, 6);

        e.preventDefault();
        for (let i = 0; i < 6; i++) { const bx = byId("pin-box-" + i); if (bx) bx.value = p[i] || ""; }
        if (p.length === 6) doLogin();
      }
    }

    function initFieldPickerMap(L) {
      const el = byId("field-map"); if (!el) return;
      el.innerHTML = "";
      let lat = parseFloat(byId("loc-lat").value), lng = parseFloat(byId("loc-lng").value);
      if (isNaN(lat) || isNaN(lng)) { lat = 33.1434; lng = -117.1661; }
      fieldPickerMap = L.map(el).setView([lat, lng], 17);
      addMapStyleSwitch(L, fieldPickerMap, "picker");
      fieldPickerMarker = L.marker([lat, lng], { draggable: true }).addTo(fieldPickerMap);
      fieldPickerMarker.on("dragend", function(e) { updateCoords(e.target.getLatLng().lat, e.target.getLatLng().lng); });
      fieldPickerMap.on("click", function(e) { fieldPickerMarker.setLatLng(e.latlng); updateCoords(e.latlng.lat, e.latlng.lng); });
      liveMaps.push(fieldPickerMap);
      setTimeout(function() { fieldPickerMap.invalidateSize(); }, 150);

    async function updateCoords(lat, lng) {
      if (!byId("loc-lat")) return;
      byId("loc-lat").value = lat.toFixed(6); byId("loc-lng").value = lng.toFixed(6);
      try {
        const res = await fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat=" + lat + "&lon=" + lng);
        const data = await res.json();
        if (data && data.display_name && byId("loc-addr")) byId("loc-addr").value = data.display_name;
      } catch (e) {}
    }
    async function searchFieldOnMap() {
      const q = byId("map-search-query").value.trim();
      if (!q) return;
      try {
        const res = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q));
        const hits = await res.json();
        if (!hits || !hits.length) { showToast(t("placeNotFound"), true); return; }
        const lat = parseFloat(hits[0].lat), lng = parseFloat(hits[0].lon);
        byId("loc-lat").value = lat.toFixed(6); byId("loc-lng").value = lng.toFixed(6);
        byId("loc-addr").value = hits[0].display_name;
        if (!byId("loc-name").value) byId("loc-name").value = hits[0].display_name.split(",")[0];
        if (fieldPickerMap) { fieldPickerMap.setView([lat, lng], 16); fieldPickerMarker.setLatLng([lat, lng]); }
      } catch (e) { showToast(t("errNetwork"), true); }
    }

    function minutesToKickoff(g) { return Math.round((gameStartDate(g).getTime() - leagueNowMs()) / 60000); }

    function onRsvpTap(gameId, status) {
      if (!currentUser) { showLoginModal(); return; }
      const g = findGame(gameId); if (!g) return;
      const m = gameMeta(g);
      if (m.isCancelled) { showToast(t("errCancelledMatch"), true); return; }
      if (m.locked) { showToast(m.lockReason === "scored" ? t("lockedScored") : t("lockedPast"), true); return; }
      if (status === "Yes" && m.myStatus === "Waitlist" && m.isFull) { showToast(t("sentWaitlist", { n: m.myWaitPos })); return; }
      // the same answer again is how you confirm it still stands after a time/place change
      if (status === m.myStatus && !(m.myEntry && m.myEntry.needsReconfirm)) { showToast(t("alreadyAnswered", { status: statusWord(status) })); return; }
      if (m.myStatus === "Yes" && status !== "Yes") {
        const guests = (m.myEntry && m.myEntry.guestNames ? m.myEntry.guestNames.length : 0);
        const mins = minutesToKickoff(g);
        const late = gf(g, "lateDrops") && g.Date === getTodayIso() && mins <= 180 && mins > -60;
        const gear = [];
        if (gf(g, "ball") && m.myEntry.bringBall) gear.push(t("gearBall"));
        if (gf(g, "pinnies") && m.myEntry.bringPinnies) gear.push(t("gearPinnies"));
        const goalie = gf(g, "gk") && m.myEntry.playGK;
        if (guests || late || gear.length || goalie) {
          const body = [guests ? t("leaveGuests", { n: guests }) : "", gear.length ? t("leaveGear", { items: gear.join(", ") }) : "", goalie ? t("leaveGK") : "", late ? t("leaveLate") : ""].filter(Boolean).join(" ");
          confirmDialog({ icon: "help", title: t("leaveConfirmTitle"), body: body, okLabel: status === "Maybe" ? t("rsvpMaybe") : t("rsvpOut"), cancelLabel: t("stayIn"), danger: true,
            onOk: function() { closeModal(); submitRsvp(gameId, status); } });
          return;
        }
      }
      submitRsvp(gameId, status);
    }

      }
      const openBtn = currentUser
        ? `<button type="button" onclick="closeEmailAnswer(true)" class="tap-lg w-full rounded-2xl neon-btn text-base">${escHtml(myEmail() === a.email ? t("eaSeeWho") : t("eaOpenApp"))}</button>`
        : `<button type="button" onclick="closeEmailAnswer(false); showLoginModal('${escJsArg(a.email)}')" class="tap-lg w-full rounded-2xl neon-btn text-base">${escHtml(t("eaLoginToSee"))}</button>`;
      if (st.error) {
        renderSheetModal(`<div class="text-center pt-1">
          <span class="w-14 h-14 mx-auto mb-3 rounded-full inline-flex items-center justify-center bg-amber-500/20 text-amber-300">${ic("alert", "w-7 h-7")}</span>
          <p class="text-base font-bold text-white leading-snug mb-4">${escHtml(st.error)}</p>
          ${st.retry ? `<button type="button" onclick="loadEmailAnswerPreview()" class="tap-lg w-full mb-2 rounded-2xl bg-slate-800 text-slate-200 font-bold text-base">${escHtml(t("eaRetry"))}</button>` : ""}
          ${openBtn}</div>`, "max-w-sm");
        return;
      }
      const res = st.res, g = res.game || {}, fin = res.finalStatus;
      const first = String(res.playerName || "").trim().split(/\s+/)[0] || "";
      const look = {
        Yes: ["check", "bg-[#00f59b]/20 text-[#00f59b]", t("eaIn", { name: first })],
        Waitlist: ["hourglass", "bg-sky-500/20 text-sky-300", t("eaWait", { n: g.waitPos || 1, name: first })],
        Maybe: ["help", "bg-amber-500/20 text-amber-300", t("eaMaybe", { name: first })],
        No: ["xCircle", "bg-slate-800 text-slate-300", t("eaOut", { name: first })]
      }[fin] || ["check", "bg-[#00f59b]/20 text-[#00f59b]", t("saved")];
      const confirmed = Number(g.confirmedCount === undefined ? g.yesCount : g.confirmedCount) >= Number(g.MinThreshold);
      const segBtn = function(status, icon, label) {
        const on = fin === status || (status === "Yes" && fin === "Waitlist");
        return `<button type="button" id="ea-${status}" onclick="showEmailAnswerConfirmation('${status}')" aria-pressed="${on}" class="tap-lg rounded-2xl border font-extrabold text-sm inline-flex items-center justify-center gap-1.5 ${on ? "bg-emerald-950 text-[#00f59b] border-[#00f59b]/60" : "seg-off"}">${ic(icon, "w-4 h-4", 2.6)}${escHtml(label)}</button>`;
      };
      renderSheetModal(`
        <div class="text-center pt-1">
          <span class="w-16 h-16 mx-auto mb-3 rounded-full inline-flex items-center justify-center ${look[1]}">${ic(look[0], "w-8 h-8", 2.6)}</span>
          <h3 class="text-xl font-extrabold text-white leading-snug">${escHtml(look[2])}</h3>
          ${fin === "Waitlist" ? `<p class="text-sm text-sky-300 mt-1">${escHtml(t("eaWaitSub"))}</p>` : ""}
        </div>
        <div class="mt-4 p-3.5 rounded-2xl bg-[#0b130f] border border-emerald-950">
          <div class="text-base font-extrabold text-white">${escHtml(g.Title || "")}</div>
          <div class="text-sm text-slate-300 mt-1 flex items-center gap-1.5">${ic("calendar", "w-4 h-4 text-slate-400")}${escHtml(whenLabel({ Date: g.Date, Time: g.Time }))}</div>
          <div class="text-sm text-slate-300 flex items-center gap-1.5 min-w-0">${ic("pin", "w-4 h-4 text-slate-400")}<span class="truncate">${escHtml(g.LocationName || "")}</span></div>
          <div class="mt-2 text-sm font-bold ${confirmed ? "text-[#00f59b]" : "text-amber-300"}">${g.yesCount}/${g.MaxCap} ${escHtml(t("playersIn"))} · ${escHtml(confirmed ? t("pillOn") : t("pillNeeds", { n: Math.max(0, Number(g.MinThreshold) - Number(g.confirmedCount === undefined ? g.yesCount : g.confirmedCount)) }))}</div>
        </div>
        <div class="mt-4 text-xs font-bold uppercase tracking-wide text-slate-400 mb-1.5">${escHtml(t("eaChange"))}</div>
        <div class="grid grid-cols-3 gap-2 mb-4">${segBtn("Yes", "check", t("rsvpIn"))}${segBtn("Maybe", "help", t("rsvpMaybe"))}${segBtn("No", "x", t("rsvpOut"))}</div>
        ${currentUser && myEmail() !== res.email ? `<p class="text-xs text-slate-400 text-center mb-2">${escHtml(t("eaSavedFor", { email: res.email }))}</p>` : ""}
        ${openBtn}
      `, "max-w-sm");
    }
    function closeEmailAnswer(showGame) {
      const a = pendingEmailAnswer;
      pendingEmailAnswer = null;
      closeModal();
      if (!showGame || !a || !currentUser) return;
      if (activeTab !== "upcoming") switchTab("upcoming");
      expandedGames[a.gameId] = true;
      renderCurrentTab();
      syncFromBackend(true);
      setTimeout(function() { const el = byId("game-" + a.gameId); if (el) try { el.scrollIntoView({ block: "start", behavior: motionAllowed() ? "smooth" : "auto" }); } catch (e) {} }, 60);
    }

    function emailRsvpNote(r) { return t("rsvpLinkLogin", { status: statusWord(r.status) }); }
    function applyEmailRsvpIfReady() {
      const r = pendingEmailRsvp;
      if (!r || !currentUser) return;
      pendingEmailRsvp = null;
      if (r.email && myEmail() !== r.email) {
        confirmDialog({ icon: "mail", title: t("rsvpLinkOtherTitle", { email: r.email }), body: t("rsvpLinkOtherBody", { me: currentUser.email, email: r.email }), okLabel: t("logoutBtn"),
          onOk: function() { logout(); pendingEmailRsvp = r; showLoginModal(r.email, emailRsvpNote(r)); } });
        return;
      }
      const g = findGame(r.gameId);
      if (!g) { showToast(t("rsvpLinkGone"), true); return; }
      if (activeTab !== "upcoming") switchTab("upcoming");
      expandedGames[r.gameId] = true;
      renderCurrentTab();
      setTimeout(function() {
        const el = byId("game-" + r.gameId);
        if (el) try { el.scrollIntoView({ block: "start" }); } catch (e) {}
        confirmDialog({icon:"mail",title:t("eaConfirmAction",{status:statusWord(r.status)}),body:t("eaLegacyConfirm",{name:currentUser.fullName})+" "+whenLabel(g),okLabel:t("confirmBtn"),onOk:function(){closeModal();onRsvpTap(r.gameId,r.status);}});
      }, 60);
    }

    // =========================================================================
    // INVITE LINKS (?invite=…&email=…) & BOOT
    // =========================================================================
    function handleInviteLink() {
      let params;
      try { params = new URLSearchParams(location.search); } catch (e) { return; }
      const token = params.get("invite"), email = String(params.get("email") || "").toLowerCase().trim();
      if (!token || !email) return;
      if (currentUser && myEmail() === email) {
        try { history.replaceState(null, "", location.pathname); } catch (e) {}
        return;
      }
      pendingInvite = { token: token, email: email };
      if (currentUser) {
        setTimeout(function() {
          confirmDialog({ icon: "mail", title: t("inviteOtherTitle", { email: email }), body: t("inviteOtherBody", { me: currentUser.email }), okLabel: t("logoutBtn"),
            onOk: function() { logout(); showRegisterModal(); } });
        }, 300);
      }
    }

    applyThemeAndLanguageUI();
    readEmailRsvpLink();
    handleInviteLink();
    renderAuthBar();
    renderCurrentTab();
    if (pendingEmailAnswer) {
      // Preview the email link without changing the answer; the user must explicitly confirm.
      loadEmailAnswerPreview().then(function() { if (currentUser) { fetchWeatherForAllGamesAsync(); syncFromBackend(true); initOneSignalSdkIfConfigured(); } });
    } else if (currentUser) {
      fetchWeatherForAllGamesAsync();
      syncFromBackend(true);           // an older email answer is applied once fresh data arrives
      initOneSignalSdkIfConfigured();
    } else if (pendingInvite) {
      showRegisterModal();
    } else if (pendingEmailRsvp) {
      showLoginModal(pendingEmailRsvp.email, emailRsvpNote(pendingEmailRsvp));
    }
  </script>
</body>
</html>
